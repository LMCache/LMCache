name: Build Artifacts
description: Build and upload a selected LMCache release artifact variant.

inputs:
  target:
    description: "Artifact target: main, main-arm64, cli, cpu, cu129, rocm, xpu, musa, or rocm-torch210."
    required: true
  dev_version:
    description: Build a development version for targets that support it.
    required: false
    default: "false"
  dockerhub_token:
    description: DockerHub token for authenticated image pulls.
    required: false
    default: ""

outputs:
  version:
    description: Resolved version for versioned platform wheels.
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0

    - name: Remove non-release tags
      shell: bash
      run: |
        git tag -l | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+((rc|a|b)[0-9]+)?$' | xargs -r git tag -d

    - name: Pin main release version from tag
      if: (inputs.target == 'main' || inputs.target == 'main-arm64') && startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Login to DockerHub
      if: (inputs.target == 'cu129' || inputs.target == 'rocm' || inputs.target == 'xpu' || inputs.target == 'rocm-torch210') && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      env:
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub_token }}
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ inputs.dockerhub_token }}

    - name: Free disk space
      if: inputs.target != 'cli'
      uses: ./.github/actions/free-disk-space

    - name: Setup Python 3.13
      if: inputs.target != 'rocm' && inputs.target != 'xpu' && inputs.target != 'musa' && inputs.target != 'rocm-torch210'
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: "3.13"

    - name: Install standard build tooling
      if: inputs.target == 'main' || inputs.target == 'main-arm64' || inputs.target == 'cu129'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install build cibuildwheel

    - name: Install CLI build tooling
      if: inputs.target == 'cli'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Install CPU build tooling
      if: inputs.target == 'cpu'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -r requirements/build.txt
        pip install build

    - name: Resolve platform wheel version
      id: version
      if: inputs.target == 'cu129' || inputs.target == 'rocm' || inputs.target == 'xpu' || inputs.target == 'musa' || inputs.target == 'rocm-torch210'
      env:
        TARGET: ${{ inputs.target }}
        DEV_VERSION: ${{ inputs.dev_version }}
      shell: bash
      run: |
        set -euo pipefail
        latest_tag=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          base="${GITHUB_REF_NAME#v}"
        elif [[ "${DEV_VERSION}" == "true" && -n "${latest_tag}" && ( "${TARGET}" == "rocm" || "${TARGET}" == "musa" ) ]]; then
          commits=$(git rev-list --count "${latest_tag}..HEAD")
          IFS=. read -r major minor patch <<< "${latest_tag#v}"
          base="${major}.${minor}.$((patch + 1)).dev${commits}"
        else
          base="${latest_tag#v}"
          base="${base:-0.0.0.dev0}"
        fi
        case "${TARGET}" in
          cu129) version="${base}"; env_name=CU129_VERSION ;;
          rocm) version="${base}+rocm7.2"; env_name=ROCM_VERSION ;;
          xpu) version="${base}+xpu"; env_name=XPU_VERSION ;;
          musa) version="${base}+musa"; env_name=MUSA_VERSION ;;
          rocm-torch210) version="${base}+rocm7.2.4.torch2.10.git3d3aa833.cxx11abi1"; env_name=ROCM_TORCH210_VERSION ;;
        esac
        echo "${env_name}=${version}" >> "$GITHUB_ENV"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Build main CUDA artifacts
      if: inputs.target == 'main'
      env:
        CIBW_TEST_COMMAND: "python {project}/.github/scripts/assert_native_ops.py"
      shell: bash
      run: |
        rm -rf dist/
        NO_NATIVE_EXT=1 python -m build --sdist
        python -m cibuildwheel --output-dir dist

    - name: Build main arm64 CUDA artifacts
      if: inputs.target == 'main-arm64'
      env:
        CIBW_BUILD: "cp3*-manylinux_aarch64"
        CIBW_TEST_COMMAND: "python -c 'import lmcache.cuda_ops'"
      shell: bash
      run: |
        rm -rf dist/
        python -m cibuildwheel --output-dir dist

    - name: Build CLI artifact
      if: inputs.target == 'cli'
      shell: bash
      run: |
        rm -rf dist/
        cp pyproject_cli.toml pyproject.toml
        NO_NATIVE_EXT=1 python -m build --wheel
        pip install dist/lmcache_cli-*.whl
        ! unzip -l dist/lmcache_cli-*.whl | grep -E '\.(so|pyd)$'
        python -c "import lmcache"
        ! python -c "import lmcache.cuda_ops" 2>/dev/null
        lmcache --help
        for cmd in mock kvcache describe ping query bench tool trace; do lmcache "$cmd" --help; done

    - name: Build CPU artifact
      if: inputs.target == 'cpu'
      shell: bash
      run: |
        rm -rf dist/
        NO_GPU_EXT=1 python -m build --wheel --no-isolation --skip-dependency-check
        for mod in lmcache_native lmcache_redis lmcache_fs; do unzip -l dist/lmcache-*.whl | grep -qE "lmcache/${mod}\..*\.so"; done
        for mod in cuda_ops xpu_ops; do ! unzip -l dist/lmcache-*.whl | grep -qE "lmcache/${mod}\..*\.so"; done
        cd "$RUNNER_TEMP"
        pip install "$GITHUB_WORKSPACE"/dist/lmcache-*.whl
        python -c "import lmcache; assert lmcache.torch_device_type == 'cpu'"
        python -c "import lmcache.lmcache_native as native; assert hasattr(native, 'TransferDirection')"
        python -c "import lmcache.lmcache_redis"
        python -c "import lmcache.lmcache_fs"
        python -c "import lmcache; assert lmcache.device_ops.device_type == 'cpu'; assert not hasattr(lmcache.device_ops, 'TransferDirection')"

    - name: Build cu129 artifact
      if: inputs.target == 'cu129'
      env:
        CIBW_MANYLINUX_X86_64_IMAGE: docker.io/pytorch/manylinux2_28-builder:cuda12.9
        CIBW_ENVIRONMENT: 'TORCH_CUDA_ARCH_LIST="7.0;7.5;8.0;8.6;8.9;9.0;10.0;12.0" ENABLE_CXX11_ABI=1 LMCACHE_CUDA_MAJOR=12 SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.CU129_VERSION }} PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu129 PIP_CONSTRAINT=/project/cibw-constraints.txt'
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --plat manylinux_2_28_x86_64 --exclude libtorch.so --exclude libtorch_cuda.so --exclude libtorch_python.so --exclude libtorch_cpu.so --exclude libc10.so --exclude libc10_cuda.so --exclude libcudart.so.12 -w {dest_dir} {wheel}
        CIBW_TEST_COMMAND: "python {project}/.github/scripts/assert_native_ops.py"
      shell: bash
      run: |
        rm -rf dist/
        python -m cibuildwheel --output-dir dist

    - name: Build ROCm artifact
      if: inputs.target == 'rocm'
      shell: bash
      run: |
        docker run --rm -e PYTORCH_ROCM_ARCH='gfx942;gfx950' -e SETUPTOOLS_SCM_PRETEND_VERSION="${ROCM_VERSION}" -e TORCH_ROCM_SPEC='torch==2.11.0+rocm7.2' -e TORCH_ROCM_INDEX='https://download.pytorch.org/whl/rocm7.2' -v "${PWD}:/work/LMCache" --entrypoint bash rocm/dev-ubuntu-22.04:7.2.3-complete /work/LMCache/.github/scripts/build_rocm_wheel.sh

    - name: Build XPU artifact
      if: inputs.target == 'xpu'
      shell: bash
      run: |
        docker run --rm -e SETUPTOOLS_SCM_PRETEND_VERSION="${XPU_VERSION}" -e TORCH_XPU_SPEC='torch==2.12.0+xpu' -e TORCH_XPU_INDEX='https://download.pytorch.org/whl/xpu' -v "${PWD}:/work/LMCache" --entrypoint bash vllm/vllm-openai-xpu:v0.26.0 /work/LMCache/.github/scripts/build_xpu_wheel.sh
        docker run --rm --shm-size=4g -v "${PWD}:/work/LMCache" --entrypoint bash vllm/vllm-openai-xpu:v0.26.0 -lc 'set -euxo pipefail; WHEEL=$(ls /work/LMCache/dist/*.whl | head -n 1); python3 -m pip install --no-deps "$WHEEL"; python3 -c "import lmcache, torch"'

    - name: Build MUSA artifact
      if: inputs.target == 'musa'
      env:
        MUSA_IMAGE: ${{ env.MUSA_IMAGE || 'registry.mthreads.com/mcconline/musa-pytorch-release-public:rc5.1.0-v2.9.1-S5000-py310_tef' }}
        MUSA_IMAGE_DIGEST: ${{ env.MUSA_IMAGE_DIGEST || '' }}
        MUSA_HOME: ${{ env.MUSA_HOME || '/usr/local/musa' }}
        TORCH_MUSA_PACKAGES: ${{ env.TORCH_MUSA_PACKAGES || '' }}
        TORCH_MUSA_INDEX: ${{ env.TORCH_MUSA_INDEX || '' }}
        MUSA_MANYLINUX_PLATFORM: manylinux_2_35_x86_64
        MUSA_LOCAL_VERSION: musa
        SKIP_AUDITWHEEL_REPAIR: '0'
        MAX_JOBS: '2'
      shell: bash
      run: |
        image_ref="${MUSA_IMAGE}"
        if [[ -n "${MUSA_IMAGE_DIGEST}" ]]; then
          [[ "${MUSA_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "MUSA_IMAGE_DIGEST must be a sha256 digest" >&2; exit 1; }
          image_ref="${image_ref%@sha256:*}@${MUSA_IMAGE_DIGEST}"
        fi
        docker run --rm --ipc=host --network=host -e SETUPTOOLS_SCM_PRETEND_VERSION="${MUSA_VERSION}" -e MUSA_HOME -e TORCH_DEVICE_BACKEND_AUTOLOAD=0 -e TORCH_MUSA_PACKAGES -e TORCH_MUSA_INDEX -e MUSA_MANYLINUX_PLATFORM -e MUSA_LOCAL_VERSION -e SKIP_AUDITWHEEL_REPAIR -e MAX_JOBS -v "${PWD}:/work/LMCache" --entrypoint bash "${image_ref}" /work/LMCache/.github/scripts/build_musa_wheel.sh
        docker run --rm --ipc=host --network=host --shm-size=4g -e TORCH_DEVICE_BACKEND_AUTOLOAD=0 -e LMCACHE_LOG_LEVEL=ERROR -v "${PWD}:/work/LMCache" --entrypoint bash "${image_ref}" -lc 'set -euxo pipefail; WHEEL=$(ls /work/LMCache/dist/*.whl | head -n 1); python3 -m pip install --no-deps "$WHEEL"; python3 -c "import lmcache, lmcache.lmcache_native, torch"'

    - name: Build ROCm torch 2.10 artifact
      if: inputs.target == 'rocm-torch210'
      shell: bash
      run: |
        image='rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0@sha256:4449f856653602317e4101a76fce599c7fcd58ccec2e539951fce5f73083179e'
        docker run --rm -e EXPECTED_TORCH_VERSION='2.10.0+rocm7.2.4.git3d3aa833' -e EXPECTED_TORCH_GIT_VERSION=3d3aa833db84eed6b7f5595cb5f162c2f78300a4 -e EXPECTED_HIP_VERSION=7.2.53211 -e EXPECTED_ROCM_VERSION=7.2.4 -e EXPECTED_PYTHON_ABI=cp312 -e EXPECTED_CXX11_ABI=1 -e EXPECTED_WHEEL_TAG=cp312-cp312-manylinux_2_39_x86_64 -e PYTORCH_ROCM_ARCH='gfx942;gfx950' -e MANYLINUX_PLATFORM=manylinux_2_39_x86_64 -e SETUPTOOLS_SCM_PRETEND_VERSION="${ROCM_TORCH210_VERSION}" -v "${PWD}:/work/LMCache" --entrypoint bash "${image}" /work/LMCache/.github/scripts/build_rocm_torch210_wheel.sh
        docker run --rm -e EXPECTED_TORCH_VERSION='2.10.0+rocm7.2.4.git3d3aa833' -e EXPECTED_TORCH_GIT_VERSION=3d3aa833db84eed6b7f5595cb5f162c2f78300a4 -e EXPECTED_HIP_VERSION=7.2.53211 -e EXPECTED_ROCM_VERSION=7.2.4 -e EXPECTED_PYTHON_ABI=cp312 -e EXPECTED_CXX11_ABI=1 -e EXPECTED_WHEEL_TAG=cp312-cp312-manylinux_2_39_x86_64 -v "${PWD}/dist_rocm_torch210:/wheel:ro" -v "${PWD}/.github/scripts/validate_rocm_torch210_wheel.py:/validate_rocm_torch210_wheel.py:ro" --entrypoint bash "${image}" -lc 'set -euo pipefail; python -m pip uninstall -y lmcache; python -m pip install aiohttp "numpy<=2.2.6" cachetools msgspec numba "prometheus-client>=0.18.0,<=0.24.1" psutil py-cpuinfo pyyaml "pyzmq>=25.0.0" requests sortedcontainers; python -m pip install --no-deps --force-reinstall /wheel/*.whl; cd /tmp; python /validate_rocm_torch210_wheel.py'

    - name: Upload artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ inputs.target == 'main' && 'release-artifacts' || inputs.target == 'main-arm64' && 'release-artifacts-arm64' || format('release-{0}-artifacts', inputs.target) }}
        path: ${{ inputs.target == 'rocm-torch210' && 'dist_rocm_torch210/' || 'dist/' }}