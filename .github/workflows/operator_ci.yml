name: "Operator: CI"

on:
  push:
    branches:
      - dev
      - "release-**"
  pull_request:
    branches:
      - dev
      - "release-**"

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: operator

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      operator: ${{ steps.filter.outputs.operator == 'true' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            operator:
              - 'operator/**'
              - '.github/workflows/operator_ci.yml'

  ci:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Check linter configuration
        run: make lint-config

      - name: Lint
        run: make lint

      - name: Test
        run: |
          go mod tidy
          make test

  chart:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6

      - name: Validate chart contracts
        run: make test-chart

      - name: Check generated CRDs and RBAC are current
        run: git diff --exit-code -- charts/lmcache-operator config/crd/bases config/rbac/role.yaml config/webhook/manifests.yaml

  smoke:
    needs: [changes, chart]
    if: needs.changes.outputs.operator == 'true'
    name: Helm lifecycle and operator smoke on Kind
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6

      - name: Setup Kind
        run: go install sigs.k8s.io/kind@v0.29.0

      - name: Run smoke tests in an isolated Kind cluster
        run: make test-e2e-kind
