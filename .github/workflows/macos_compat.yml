name: macOS Compat

# Two-job macOS compatibility suite:
#
# 1. macos-smoke  — fast sanity check: installs lmcache (NO_GPU_EXT=1,
#    no vLLM), verifies common C++ extensions load, and confirms the
#    LMCache HTTP server starts and answers /healthcheck.
#
# 2. macos-vllm-e2e  — full CPU e2e: installs vLLM CPU build on top of
#    lmcache, starts LMCache server (pickle transport, macOS has no
#    /dev/shm), starts vLLM with LMCacheMPConnector, and sends a
#    completion request to verify the whole stack works end-to-end.
#    Mirrors .buildkite/k3_tests/multiprocess/scripts/
#    run-cpu-e2e-validation.sh but adapted for macOS.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - "dev"
      - "release-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Single source of truth for the smoke-script contract. The script
# (.github/scripts/macos_smoke_test.sh) reads these from the env, and
# the failure-artifact upload step below references LMCACHE_LOG_FILE.
env:
  LMCACHE_HTTP_PORT: "18080"
  LMCACHE_ZMQ_PORT: "15555"
  LMCACHE_LOG_FILE: "/tmp/lmcache_server.log"
  LMCACHE_STARTUP_TIMEOUT: "180"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # workflow_call / workflow_dispatch bypass the paths-filter (which
      # only runs for push / pull_request). Treat both as "always run"
      # so callers don't get a silently-skipped job.
      lmcache: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || steps.filter.outputs.lmcache == 'true' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - 'lmcache/**'
              - 'pyproject.toml'
              - 'setup.py'
              - 'requirements/**.txt'
              - '.github/workflows/macos_compat.yml'
              - '.github/scripts/macos_smoke_test.sh'
              - '.github/scripts/macos_vllm_e2e_test.sh'
              - '!operator/**'

  macos-smoke:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: "macOS smoke: py${{ matrix.python }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
        platform:
          # macos-latest is Apple Silicon (arm64);
          - "macos-latest"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Shallow clone is enough; SETUPTOOLS_SCM_PRETEND_VERSION
          # below avoids any git-tag resolution by setuptools-scm.
          fetch-depth: 1

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Install lmcache (CPU-only, common C++ ext, no vLLM)
        env:
          # NO_GPU_EXT=1: build common C++ extensions (native_storage_ops,
          # lmcache_redis, lmcache_fs) but skip the CUDA / ROCm / SYCL
          # backend. Mirrors build_cpu_artifacts.yml on the macOS axis.
          NO_GPU_EXT: "1"
          # Pin a synthetic version so setuptools-scm never inspects
          # git tags. Defense-in-depth on top of pyproject.toml's
          # tag_regex; harmless if tag_regex already filters tags.
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt
          # Pure-Python deps. macOS wheels exist for everything in
          # common.txt; we explicitly skip requirements/cuda13_core.txt
          # (the default core file picked by setup.py) since cupy and
          # nixl are CUDA/Linux-only.
          python -m pip install torch
          python -m pip install -r requirements/common.txt
          # CLI entry points eagerly import openai / matplotlib (e.g.
          # lmcache.cli.commands.bench), so cli.txt is needed for the
          # `lmcache --help` step inside the smoke script.
          python -m pip install -r requirements/cli.txt
          # Install lmcache itself with --no-deps so setup.py's
          # install_requires (which appends cuda13_core.txt by default)
          # cannot drag CUDA-only wheels onto macOS.
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Run macOS smoke test
        run: |
          chmod +x .github/scripts/macos_smoke_test.sh
          .github/scripts/macos_smoke_test.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lmcache-server-log-${{ matrix.platform }}-py${{ matrix.python }}
          path: ${{ env.LMCACHE_LOG_FILE }}
          if-no-files-found: ignore

  macos-vllm-e2e:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: "macOS vLLM CPU e2e: py3.12"
    # macos-latest is Apple Silicon (arm64); vLLM CPU wheels support arm64.
    runs-on: macos-latest
    # vLLM CPU install + model download + server startup can be slow.
    timeout-minutes: 60

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
            .github/workflows/macos_compat.yml

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opt-125m-v1

      # Separate cache for vLLM CPU wheel (large, keyed by commit hash).
      # Must be declared before the install step so the cache is restored
      # before pip runs.
      - name: Cache vLLM pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            vllm-cpu-macos-py3.12-71df063c
          restore-keys: |
            vllm-cpu-macos-py3.12-

      - name: Install lmcache (CPU-only, no vLLM)
        env:
          NO_GPU_EXT: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt
          python -m pip install torch
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/cli.txt
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Install vLLM CPU build
        run: |
          pip install "numpy<2"
          pip install vllm \
            --extra-index-url \
            https://wheels.vllm.ai/71df063c494c111ab60f6a33c54aafe7b9ae1d02/cpu

      - name: Download facebook/opt-125m
        run: |
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download('facebook/opt-125m')
          print('model ready')
          "

      - name: Run macOS vLLM CPU e2e test
        env:
          LMCACHE_HTTP_PORT: "18080"
          VLLM_PORT: "18000"
          LMCACHE_LOG_FILE: "/tmp/macos_e2e_lmcache.log"
          # macOS has no /dev/shm -> pickle transport
          LMCACHE_SHM_NAME: ""
          # GitHub macOS runners are slower; give vLLM more time to start.
          VLLM_READY_TIMEOUT: "300"
          LMCACHE_HEALTHCHECK_TIMEOUT: "60"
        run: |
          chmod +x .github/scripts/macos_vllm_e2e_test.sh
          .github/scripts/macos_vllm_e2e_test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-vllm-e2e-logs
          path: |
            /tmp/macos_e2e_lmcache.log
            /tmp/macos_e2e_vllm.log
          if-no-files-found: ignore
