name: Build Artifacts

# Reusable workflow that builds all release artifacts (sdist + CUDA wheel,
# pure-Python CLI wheel, cu130 wheel) and uploads them to the run.
# Callers:
#   - publish.yml  (push to dev/release-**, tag push, release published)
#   - pr_full_build.yml  (PRs labeled `full`)

on:
    workflow_call:

env:
    LC_ALL: en_US.UTF-8

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    # Create release artifacts
    # - build source dist (tar ball) and wheel
    # - upload artifacts to GHA
    build-artifacts:
        name: Build artifacts
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: block
                allowed-endpoints: >
                  api.github.com:443
                  github.com:443
                  registry-1.docker.io:443
                  production.cloudflare.docker.com:443
                  auth.docker.io:443
                  azure.archive.ubuntu.com:80
                  pypi.org:443
                  files.pythonhosted.org:443
                  codeload.github.com:443
                  objects.githubusercontent.com:443
                  releases.githubusercontent.com:443

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                # for setuptools-scm
                fetch-depth: 0

            - name: Remove non-release tags
              run: git tag -l | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+$' | xargs -r git tag -d

            - name: Free disk space
              uses: ./.github/actions/free-disk-space

            - name: Setup Python 3.13
              uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
              with:
                python-version: "3.13"

            - name: Install build tooling
              run: |
                python -m pip install --upgrade pip
                pip install build cibuildwheel

            - name: Clean up release artifacts
              run: |
                rm -rf dist/

            - name: Build source distribution (no CUDA)
              run: |
                NO_CUDA_EXT=1 python -m build --sdist

            - name: Build CUDA wheels with cibuildwheel
              # Configuration is set in pyproject.toml
              # this will build lmcache with the latest version of torch
              # building from source will be required if a serving engine uses
              # an earlier non-ABI compatible version of torch
              env:
                CIBW_TEST_COMMAND: "python -c 'import lmcache.c_ops'"
              run: |
                python -m cibuildwheel --output-dir dist

            - name: Upload release artifacts to GHA
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                name: release-artifacts
                path: dist/

    # Build lmcache-cli pure-Python wheel (no CUDA)
    build-cli-artifacts:
        name: Build CLI artifacts
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: block
                allowed-endpoints: >
                  api.github.com:443
                  github.com:443
                  azure.archive.ubuntu.com:80
                  pypi.org:443
                  files.pythonhosted.org:443
                  objects.githubusercontent.com:443

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Remove non-release tags
              run: git tag -l | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+$' | xargs -r git tag -d

            - name: Setup Python 3.13
              uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
              with:
                python-version: "3.13"

            - name: Install build tooling
              run: |
                python -m pip install --upgrade pip
                pip install build

            - name: Clean up release artifacts
              run: |
                rm -rf dist/

            - name: Build lmcache-cli wheel (pure Python, no CUDA)
              run: |
                cp pyproject_cli.toml pyproject.toml
                NO_CUDA_EXT=1 python -m build --wheel

            - name: Smoke-test CLI wheel (no torch)
              run: |
                pip install dist/lmcache_cli-*.whl
                python -c "import lmcache"
                lmcache --help

            - name: Upload CLI release artifacts to GHA
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                name: release-cli-artifacts
                path: dist/

    # Build cu130 wheel and upload to GHA artifact storage
    # The cu13 wheel carries no local version suffix and is published to a
    # dedicated v{tag}-cu13 GitHub Release (not PyPI).
    build-cu130-artifacts:
        name: Build cu130 artifacts
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: block
                allowed-endpoints: >
                  api.github.com:443
                  github.com:443
                  registry-1.docker.io:443
                  index.docker.io:443
                  production.cloudflare.docker.com:443
                  auth.docker.io:443
                  azure.archive.ubuntu.com:80
                  pypi.org:443
                  files.pythonhosted.org:443
                  codeload.github.com:443
                  objects.githubusercontent.com:443
                  releases.githubusercontent.com:443
                  download.pytorch.org:443
                  download-r2.pytorch.org:443
                  pypi.nvidia.com:443

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Remove non-release tags
              run: git tag -l | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+$' | xargs -r git tag -d

            - name: Login to DockerHub
              if: vars.DOCKERHUB_USERNAME != ''
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Free disk space
              uses: ./.github/actions/free-disk-space

            - name: Setup Python 3.13
              uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
              with:
                python-version: "3.13"

            - name: Install build tooling
              run: |
                python -m pip install --upgrade pip
                pip install build cibuildwheel

            - name: Clean up release artifacts
              run: |
                rm -rf dist/

            - name: Get base version for cu13 wheel
              run: |
                BASE=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//' || echo "0.0.0.dev")
                echo "CU130_VERSION=${BASE}" >> "$GITHUB_ENV"

            - name: Build cu130 CUDA wheels with cibuildwheel
              env:
                CIBW_MANYLINUX_X86_64_IMAGE: docker.io/pytorch/manylinux2_28-builder:cuda13.0
                CIBW_ENVIRONMENT: 'TORCH_CUDA_ARCH_LIST="8.0;8.6;8.9;9.0;10.0;12.0" ENABLE_CXX11_ABI=1 SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.CU130_VERSION }} PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130'
                CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
                  auditwheel repair
                  --plat manylinux_2_28_x86_64
                  --exclude libtorch.so
                  --exclude libtorch_cuda.so
                  --exclude libtorch_python.so
                  --exclude libtorch_cpu.so
                  --exclude libc10.so
                  --exclude libc10_cuda.so
                  --exclude libcudart.so.13
                  -w {dest_dir} {wheel}
                CIBW_TEST_COMMAND: "python -c 'import lmcache.c_ops'"
              run: |
                python -m cibuildwheel --output-dir dist

            - name: Upload cu130 release artifacts to GHA
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                name: release-cu130-artifacts
                path: dist/
