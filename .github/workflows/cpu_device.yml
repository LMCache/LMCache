name: CPU Device Tests

# CPU device tests: server bench + vLLM e2e in single environment
# Avoids repeated vLLM installation by running both test types sequentially

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - "dev"
      - "release-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lmcache: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_call' ||
          steps.filter.outputs.lmcache == 'true'
        }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - 'lmcache/**'
              - 'pyproject.toml'
              - 'setup.py'
              - 'requirements/**.txt'
              - '.github/workflows/cpu_device.yml'
              - '.github/scripts/cpu_device_test.sh'
              - '.github/scripts/cpu_server_bench_test.sh'
              - '.github/scripts/cpu_vllm_e2e_test.sh'
              - '.buildkite/k3_tests/multiprocess/scripts/run-cpu-e2e-validation.sh'
              - '!operator/**'

  cpu-device-test-ubuntu:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: CPU device (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opt-125m-v1

      - name: Install vLLM CPU (prebuilt nightly from PyPI)
        run: |
          # Pre-built CPU-only vLLM wheel published as `vllm-cpu-nightly`
          # on PyPI by .github/workflows/build_and_publish_vllm_cpu_nightly.sh
          # (runs on devcloud). Avoids the ~30-40 min in-CI compile.
          # The wheel is built on ubuntu-22.04 + py3.12 with the same gcc-12
          # toolchain, so it is ABI-compatible with this runner.
          # `--extra-index-url` is needed because the wheel depends on
          # torch==2.11.0 which is only published on the pytorch CPU index.
          pip install "numpy<2"
          pip install vllm-cpu-nightly \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # The wheel installs the `vllm/` python package but its
          # distribution metadata is registered under `vllm-cpu-nightly`.
          # vLLM's own CLI entrypoint (`/usr/bin/vllm`) and many internal
          # callers use `importlib.metadata.version("vllm")`, which looks
          # up the *distribution* name, not the import name. Without the
          # alias below, that call raises PackageNotFoundError and the
          # vLLM server fails to start. Synthesize a `vllm-<ver>.dist-info`
          # alias that points at the same RECORD so the metadata lookup
          # succeeds. Idempotent: re-running just rewrites the alias.
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import shutil
          dist = md.distribution("vllm-cpu-nightly")
          ver = dist.version
          # Locate the *.dist-info dir without poking private attributes:
          # dist.files lists every installed file relative to site-packages,
          # and the first entry under a `*.dist-info/` dir gives us its name.
          site_root = pathlib.Path(dist.locate_file(""))
          info_name = next(
              p.parts[0] for p in (dist.files or [])
              if p.parts and p.parts[0].endswith(".dist-info")
          )
          src = site_root / info_name
          dst = src.with_name(f"vllm-{ver}.dist-info")
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)
          meta = dst / "METADATA"
          txt = meta.read_text()
          # Only the very first `Name:` header (case-sensitive, line-start).
          new = txt.replace("Name: vllm-cpu-nightly", "Name: vllm", 1)
          meta.write_text(new)
          print(f"Aliased {src.name} -> {dst.name}")
          print("vllm version (via importlib.metadata):", md.version("vllm"))
          PY
          python -c "import vllm, torch; print('vllm:', vllm.__version__, 'torch:', torch.__version__, 'cuda:', torch.cuda.is_available())"

      - name: Install lmcache (CPU-only, no vLLM)
        env:
          NO_GPU_EXT: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: |
          # vLLM is already installed above (along with torch==2.11.0+cpu),
          # so we deliberately skip `pip install torch` here to avoid pip
          # pulling a newer torch and then having to downgrade it back.
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/cli.txt
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Download facebook/opt-125m
        run: |
          python3 << 'EOF'
          from huggingface_hub import snapshot_download
          import time
          import sys
          
          max_retries = 3
          retry_delay = 30
          
          for attempt in range(max_retries):
              try:
                  print(f'Attempt {attempt + 1}/{max_retries}: Downloading facebook/opt-125m...')
                  snapshot_download('facebook/opt-125m')
                  print('Model downloaded successfully')
                  sys.exit(0)
              except Exception as e:
                  print(f'Attempt {attempt + 1} failed: {e}')
                  if attempt < max_retries - 1:
                      print(f'Waiting {retry_delay} seconds before retry...')
                      time.sleep(retry_delay)
                      retry_delay *= 2  # Exponential backoff
                  else:
                      print('All retry attempts failed. Continuing anyway...')
                      print('NOTE: The test may fail if the model is not available locally')
          EOF

      - name: Server bench — Data
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=data \
          LMCACHE_HTTP_PORT_BENCH=18080 \
          LMCACHE_ZMQ_PORT_BENCH=15555 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: Server bench — Handle
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=handle \
          LMCACHE_HTTP_PORT_BENCH=18081 \
          LMCACHE_ZMQ_PORT_BENCH=15556 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: vLLM e2e — Data (pickle)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=pickle \
          LMCACHE_HTTP_PORT_E2E=18082 \
          LMCACHE_ZMQ_PORT_E2E=15557 \
          VLLM_PORT_E2E=18000 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: vLLM e2e — Data (shm)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=shm \
          LMCACHE_HTTP_PORT_E2E=18083 \
          LMCACHE_ZMQ_PORT_E2E=15558 \
          VLLM_PORT_E2E=18001 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: vLLM e2e — Handle
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=handle \
          LMCACHE_HTTP_PORT_E2E=18084 \
          LMCACHE_ZMQ_PORT_E2E=15559 \
          VLLM_PORT_E2E=18002 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-device-logs-ubuntu-22.04
          path: |
            /tmp/cpu_device_*.log
          if-no-files-found: ignore

  cpu-device-test-macos:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: CPU device (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opt-125m-v1

      - name: Install vLLM CPU (prebuilt nightly from PyPI)
        run: |
          # Pre-built CPU-only vLLM wheel published as `vllm-cpu-nightly`
          # on PyPI by .github/workflows/build_and_publish_vllm_cpu_nightly_macos.sh
          # (runs on a Mac arm64 host or via the opendataio/vllm-cpu CI).
          # Avoids the ~30-40 min in-CI compile. The wheel is built on
          # macos arm64 + py3.12 and tagged macosx_11_0_universal2, so
          # GitHub-hosted macos-latest (arm64) runners accept it.
          # `--extra-index-url` is harmless on mac (mac torch wheels live
          # on PyPI) but lets us reuse a single command across platforms.
          pip install "numpy<2"
          pip install vllm-cpu-nightly \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Same dist-info alias trick as the ubuntu job: vLLM's CLI
          # entrypoint does `importlib.metadata.version("vllm")`, which
          # looks up the *distribution* name. Our nightly wheel ships as
          # `vllm-cpu-nightly`, so we synthesize a `vllm-<ver>.dist-info`
          # alias to make the lookup succeed. Idempotent.
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import shutil
          dist = md.distribution("vllm-cpu-nightly")
          ver = dist.version
          site_root = pathlib.Path(dist.locate_file(""))
          info_name = next(
              p.parts[0] for p in (dist.files or [])
              if p.parts and p.parts[0].endswith(".dist-info")
          )
          src = site_root / info_name
          dst = src.with_name(f"vllm-{ver}.dist-info")
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)
          meta = dst / "METADATA"
          txt = meta.read_text()
          new = txt.replace("Name: vllm-cpu-nightly", "Name: vllm", 1)
          meta.write_text(new)
          print(f"Aliased {src.name} -> {dst.name}")
          print("vllm version (via importlib.metadata):", md.version("vllm"))
          PY
          python -c "import vllm, torch; print('vllm:', vllm.__version__, 'torch:', torch.__version__, 'cuda:', torch.cuda.is_available())"

      - name: Install lmcache (CPU-only, no vLLM)
        env:
          NO_GPU_EXT: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: |
          # vLLM is already installed above (along with the torch version
          # it pins), so we deliberately skip `pip install torch` here to
          # avoid pip pulling a newer torch and then having to downgrade
          # it back.
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/cli.txt
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Download facebook/opt-125m
        run: |
          python3 << 'EOF'
          from huggingface_hub import snapshot_download
          import time
          import sys
          
          max_retries = 3
          retry_delay = 30
          
          for attempt in range(max_retries):
              try:
                  print(f'Attempt {attempt + 1}/{max_retries}: Downloading facebook/opt-125m...')
                  snapshot_download('facebook/opt-125m')
                  print('Model downloaded successfully')
                  sys.exit(0)
              except Exception as e:
                  print(f'Attempt {attempt + 1} failed: {e}')
                  if attempt < max_retries - 1:
                      print(f'Waiting {retry_delay} seconds before retry...')
                      time.sleep(retry_delay)
                      retry_delay *= 2  # Exponential backoff
                  else:
                      print('All retry attempts failed. Continuing anyway...')
                      print('NOTE: The test may fail if the model is not available locally')
          EOF

      - name: Server bench — Data
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=data \
          LMCACHE_HTTP_PORT_BENCH=18080 \
          LMCACHE_ZMQ_PORT_BENCH=15555 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: Server bench — Handle
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=handle \
          LMCACHE_HTTP_PORT_BENCH=18081 \
          LMCACHE_ZMQ_PORT_BENCH=15556 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: vLLM e2e — Data (pickle)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=pickle \
          LMCACHE_HTTP_PORT_E2E=18082 \
          LMCACHE_ZMQ_PORT_E2E=15557 \
          VLLM_PORT_E2E=18000 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: vLLM e2e — Handle
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=handle \
          LMCACHE_HTTP_PORT_E2E=18083 \
          LMCACHE_ZMQ_PORT_E2E=15558 \
          VLLM_PORT_E2E=18001 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-device-logs-macos-latest
          path: |
            /tmp/cpu_device_*.log
          if-no-files-found: ignore