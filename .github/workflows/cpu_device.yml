name: CPU Device Tests

# CPU device tests: server bench + vLLM e2e. Both job types share a
# single environment (built once per OS) to avoid re-installing vLLM.

on:
  workflow_call:
    inputs:
      nightly_verify:
        description: >-
          Nightly verification mode. Runs the whole suite regardless of
          which paths changed, installs the newest vllm-cpu-nightly on
          every OS (instead of the macOS-pinned wheel below), and uploads
          one verify_result.json per matrix leg so
          nightly-aggregate-vllm-verify.sh can decide what to pin.
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    branches:
      - "dev"
      - "release-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # `github.event_name` inside a reusable workflow is the *caller's*
      # event (schedule, pull_request, ...) and never 'workflow_call', so
      # callers that must always run signal it through nightly_verify.
      lmcache: >-
        ${{
          inputs.nightly_verify ||
          github.event_name == 'workflow_dispatch' ||
          steps.filter.outputs.lmcache == 'true'
        }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - 'lmcache/**'
              - 'pyproject.toml'
              - 'setup.py'
              - 'requirements/**.txt'
              - '.github/workflows/cpu_device.yml'
              - '.github/scripts/cpu_device_test.sh'
              - '.github/scripts/cpu_server_bench_test.sh'
              - '.github/scripts/cpu_vllm_e2e_test.sh'
              - '.github/scripts/install_vllm_cpu.sh'
              - '.github/scripts/install_lmcache_cpu.sh'
              - '.github/scripts/download_model.sh'
              - '.github/scripts/download_gh_release_model.sh'
              - '.github/scripts/run-cpu-e2e-validation.sh'
              - '!operator/**'

  cpu-device-test:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: CPU device (${{ matrix.os }} / ${{ matrix.model.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        # Each entry is a self-contained model profile the e2e steps
        # thread through env vars. Adding a new model = adding a new
        # entry here. All models share the same downloader
        # (download_gh_release_model.sh); the per-model fields below
        # tell it which GitHub Release tarball to pull and how to lay
        # it out under ~/.cache/huggingface/hub/.
        model:
          - name: opt-125m
            id: facebook/opt-125m
            tarball_url: https://github.com/LMCache/opt-125m/releases/download/v1.0/opt-125m.tar.gz
            cache_marker: pytorch_model.bin
            load_format: ""
            hf_overrides: ""
            trust_remote_code: "0"
            mla_disable: "0"
          # DeepSeek-V2-Lite-Chat with MLA DISABLED (vLLM CPU backend
          # currently raises NotImplementedError for MLA on CPU, see
          # vllm/platforms/cpu.py:get_attn_backend_cls). MLA is a
          # runtime attention-backend decision inside vLLM, not a HF
          # config field, so the only way to short-circuit it is the
          # `VLLM_MLA_DISABLE=1` env var vLLM checks in
          # `get_attn_backend_cls`. We still exercise the DeepSeek
          # architecture (MoE + custom modelling code) on the CPU e2e
          # path; MLA validation is deferred until vLLM CPU supports
          # it. Weights are random (`--load-format dummy`) and served
          # from a weight-less GitHub mirror (opendataio/deepseek_v2_lite
          # tag `v1.0`, GitHub auto-generates the tar.gz).
          # `hf_overrides` shrinks the model to 2 layers / 4 routed
          # experts so CPU runners can host it.
          - name: deepseek-v2-lite
            id: deepseek-ai/DeepSeek-V2-Lite-Chat
            tarball_url: https://github.com/opendataio/deepseek_v2_lite/archive/refs/tags/v1.0.tar.gz
            cache_marker: config.json
            load_format: dummy
            hf_overrides: >-
              {"num_hidden_layers": 2, "n_routed_experts": 4,
               "first_k_dense_replace": 0, "num_experts_per_tok": 2}
            trust_remote_code: "1"
            mla_disable: "1"

    env:
      # Threaded to run-cpu-e2e-validation.sh; server_bench ignores them.
      VLLM_MODEL_ID: ${{ matrix.model.id }}
      VLLM_LOAD_FORMAT: ${{ matrix.model.load_format }}
      VLLM_HF_OVERRIDES: ${{ matrix.model.hf_overrides }}
      VLLM_TRUST_REMOTE_CODE: ${{ matrix.model.trust_remote_code }}
      # Downloader args, consumed by run-cpu-e2e-validation.sh's
      # Phase 2 / Step 2 (which re-invokes download_gh_release_model.sh
      # to be idempotent — the Prepare model step above may have
      # already populated the cache, in which case this is a no-op).
      VLLM_TARBALL_URL: ${{ matrix.model.tarball_url }}
      VLLM_TARBALL_CACHE_MARKER: ${{ matrix.model.cache_marker }}
      # vLLM's own env: 1 -> force non-MLA attention backend even for
      # models that would normally route through MLA. Required on CPU
      # today because vLLM's CPU backend raises for MLA.
      VLLM_MLA_DISABLE: ${{ matrix.model.mla_disable }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          else
            echo "ffmpeg already installed: $(ffmpeg -version | head -n1)"
          fi

      # Cache key varies per model so the two matrix legs don't
      # thrash each other's HF hub directory.
      - name: Cache HuggingFace hub (${{ matrix.model.name }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-${{ matrix.model.name }}-v2

      - name: Resolve verified vLLM CPU nightly version
        id: resolve-vllm
        env:
          # Reuse the buildkite pin-resolver: it reads the bare version from
          # the first line of the per-OS pointer file on the
          # `github_nightly_tested_vllm` branch -- the version the nightly
          # verification pipeline most recently confirmed working on this OS.
          # A missing/unreachable pointer leaves PINNED_VLLM_VERSION empty,
          # so we fall back to the newest nightly and the job still runs.
          LMCACHE_VLLM_PIN_URL: >-
            https://raw.githubusercontent.com/LMCache/LMCache/github_nightly_tested_vllm/latest_tested_vllm_${{ runner.os == 'macOS' && 'macos-latest' || 'ubuntu-22.04' }}.txt
        run: |
          source .buildkite/k3_harness/resolve-pinned-vllm.sh
          if [[ -n "${PINNED_VLLM_VERSION}" ]]; then
            echo "VLLM_CPU_NIGHTLY_SPEC=vllm-cpu-nightly==${PINNED_VLLM_VERSION}" \
              | tee -a "$GITHUB_OUTPUT"
          else
            echo "VLLM_CPU_NIGHTLY_SPEC=vllm-cpu-nightly" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Install vLLM CPU (prebuilt nightly from PyPI)
        id: install-vllm
        env:
          # nightly_verify deliberately ignores the pin: its whole job is to
          # find out whether today's build works, and a pinned wheel would
          # just re-validate the same known-good one every night.
          VLLM_CPU_NIGHTLY_SPEC: >-
            ${{ inputs.nightly_verify
                && 'vllm-cpu-nightly'
                || steps.resolve-vllm.outputs.VLLM_CPU_NIGHTLY_SPEC }}
        run: bash .github/scripts/install_vllm_cpu.sh

      - name: Install lmcache (CPU-only, no vLLM)
        id: install-lmcache
        run: bash .github/scripts/install_lmcache_cpu.sh

      # server_bench is model-agnostic (cpu_server_bench_test.sh never
      # touches any model — it only exercises the lmcache server's KV
      # transfer path via `lmcache bench server`). Gate it on the
      # opt-125m leg so we run it exactly once per OS instead of once
      # per (os, model) combo — running it on every leg would just
      # burn CI minutes on identical work.
      - name: Server bench — LMCache-driven
        if: matrix.model.name == 'opt-125m'
        run: |
          LMCACHE_BENCH_TRANSFER_MODE=lmcache_driven \
          LMCACHE_HTTP_PORT_BENCH=18080 \
          LMCACHE_ZMQ_PORT_BENCH=15555 \
            bash .github/scripts/cpu_device_test.sh server_bench

      - name: Server bench — Engine-driven
        if: matrix.model.name == 'opt-125m'
        run: |
          LMCACHE_BENCH_TRANSFER_MODE=engine_driven \
          LMCACHE_HTTP_PORT_BENCH=18081 \
          LMCACHE_ZMQ_PORT_BENCH=15556 \
            bash .github/scripts/cpu_device_test.sh server_bench

      - name: Prepare model — ${{ matrix.model.name }}
        env:
          MODEL_ID: ${{ matrix.model.id }}
          TARBALL_URL: ${{ matrix.model.tarball_url }}
          CACHE_MARKER: ${{ matrix.model.cache_marker }}
        run: bash .github/scripts/download_gh_release_model.sh

      # The three e2e steps below cover the three worker-side transfer
      # paths exactly once: engine-driven splits into pickle and shm data
      # modes, and lmcache-driven is the IPC handle path.
      #
      # Never pass a bare `engine_driven` here: LMCACHE_E2E_DATA_MODE then
      # defaults to shm, so the step silently becomes a second copy of the
      # shm leg below instead of testing anything new.
      - name: vLLM e2e — Engine-driven (pickle)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          LMCACHE_E2E_TRANSPORT_MODE=pickle \
          LMCACHE_HTTP_PORT_E2E=18082 \
          LMCACHE_ZMQ_PORT_E2E=15557 \
          VLLM_PORT_E2E=18000 \
            bash .github/scripts/cpu_device_test.sh vllm_e2e

      # Runs on macOS too: POSIX SHM turns out to work there. The runner
      # has been executing this exact configuration all along via the
      # mislabelled `engine_driven` step this replaces, which reports
      # "Transport mode confirmed: shm" on Darwin.
      - name: vLLM e2e — Engine-driven (shm)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          LMCACHE_E2E_TRANSPORT_MODE=shm \
          LMCACHE_HTTP_PORT_E2E=18083 \
          LMCACHE_ZMQ_PORT_E2E=15558 \
          VLLM_PORT_E2E=18001 \
            bash .github/scripts/cpu_device_test.sh vllm_e2e

      # Exercises LMCacheDrivenTransferContext (server-side IPC handle
      # path) rather than the worker-side gather/scatter copy. On CPU it
      # resolves to CpuShmTensorWrapper, bound to the device through
      # CpuDeviceSpec.ipc_wrapper_cls (lmcache/v1/platform/cpu/shm.py).
      # `Server bench — LMCache-driven` already covers this transport,
      # but nothing covered it end-to-end through vLLM.
      - name: vLLM e2e — LMCache-driven
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          LMCACHE_E2E_TRANSPORT_MODE=lmcache_driven \
          LMCACHE_HTTP_PORT_E2E=18084 \
          LMCACHE_ZMQ_PORT_E2E=15559 \
          VLLM_PORT_E2E=18002 \
            bash .github/scripts/cpu_device_test.sh vllm_e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpu-device-logs-${{ matrix.os }}-${{ matrix.model.name }}
          path: |
            /tmp/cpu_device_*.log
          if-no-files-found: ignore

      # Nightly only: hand the pin/report job a machine-readable verdict
      # for this leg. Note there is deliberately no continue-on-error
      # anywhere above — a broken e2e still fails the job (and the PR
      # gate); these two steps just record what happened.
      - name: Collect verify result
        if: always() && inputs.nightly_verify
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALL_VLLM_OUTCOME: ${{ steps.install-vllm.outcome }}
          INSTALL_LMC_OUTCOME: ${{ steps.install-lmcache.outcome }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_MODEL: ${{ matrix.model.name }}
        run: python3 .github/scripts/nightly-collect-verify-result.py

      - name: Upload verify result
        if: always() && inputs.nightly_verify
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verify-result-${{ matrix.os }}-${{ matrix.model.name }}
          path: verify_result.json
