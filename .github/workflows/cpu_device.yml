name: CPU Device Tests

# CPU device tests: server bench + vLLM e2e in single environment
# Avoids repeated vLLM installation by running both test types sequentially

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - "dev"
      - "release-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lmcache: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_call' ||
          steps.filter.outputs.lmcache == 'true'
        }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - 'lmcache/**'
              - 'pyproject.toml'
              - 'setup.py'
              - 'requirements/**.txt'
              - '.github/workflows/cpu_device.yml'
              - '.github/scripts/cpu_device_test.sh'
              - '.github/scripts/cpu_server_bench_test.sh'
              - '.github/scripts/cpu_vllm_e2e_test.sh'
              - '.buildkite/k3_tests/multiprocess/scripts/run-cpu-e2e-validation.sh'
              - '!operator/**'

  cpu-device-test-ubuntu:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: CPU device (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opt-125m-v1

      - name: Cache vLLM pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: vllm-cpu-ubuntu-22.04-py3.12-nightly
          restore-keys: |
            vllm-cpu-ubuntu-22.04-py3.12-

      - name: Install lmcache (CPU-only, no vLLM)
        env:
          NO_GPU_EXT: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt
          python -m pip install torch
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/cli.txt
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Install vLLM CPU build
        env:
          VLLM_TARGET_DEVICE: cpu
          VLLM_VERSION_TAG: v0.22.1
        run: |
          # The Linux x86_64 wheel on wheels.vllm.ai is published under a
          # clean "0.22.1" version (no "+cpu" PEP 440 local label), so
          # vllm.platforms.cpu_platform_plugin's vllm_version_matches_substr
          # ("cpu") check fails at runtime and the engine falls into
          # UnspecifiedPlatform, raising "Failed to infer device type".
          # Build from the upstream git tag with VLLM_TARGET_DEVICE=cpu so
          # the resulting install advertises itself as a CPU build.
          pip install "numpy<2"
          pip install \
            "vllm @ git+https://github.com/vllm-project/vllm@${VLLM_VERSION_TAG}"
          python -c "import vllm, torch; print('vllm:', vllm.__version__, 'torch:', torch.__version__, 'cuda:', torch.cuda.is_available())"

      - name: Download facebook/opt-125m
        run: |
          python3 << 'EOF'
          from huggingface_hub import snapshot_download
          import time
          import sys
          
          max_retries = 3
          retry_delay = 30
          
          for attempt in range(max_retries):
              try:
                  print(f'Attempt {attempt + 1}/{max_retries}: Downloading facebook/opt-125m...')
                  snapshot_download('facebook/opt-125m')
                  print('Model downloaded successfully')
                  sys.exit(0)
              except Exception as e:
                  print(f'Attempt {attempt + 1} failed: {e}')
                  if attempt < max_retries - 1:
                      print(f'Waiting {retry_delay} seconds before retry...')
                      time.sleep(retry_delay)
                      retry_delay *= 2  # Exponential backoff
                  else:
                      print('All retry attempts failed. Continuing anyway...')
                      print('NOTE: The test may fail if the model is not available locally')
          EOF

      - name: Server bench (data mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=data \
          LMCACHE_HTTP_PORT_BENCH=18080 \
          LMCACHE_ZMQ_PORT_BENCH=15555 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: Server bench (handle mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=handle \
          LMCACHE_HTTP_PORT_BENCH=18081 \
          LMCACHE_ZMQ_PORT_BENCH=15556 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: vLLM e2e (pickle mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=pickle \
          LMCACHE_HTTP_PORT_E2E=18082 \
          LMCACHE_ZMQ_PORT_E2E=15557 \
          VLLM_PORT_E2E=18000 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: vLLM e2e (shm mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=shm \
          LMCACHE_HTTP_PORT_E2E=18083 \
          LMCACHE_ZMQ_PORT_E2E=15558 \
          VLLM_PORT_E2E=18001 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: vLLM e2e (handle mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=handle \
          LMCACHE_HTTP_PORT_E2E=18084 \
          LMCACHE_ZMQ_PORT_E2E=15559 \
          VLLM_PORT_E2E=18002 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-device-logs-ubuntu-22.04
          path: |
            /tmp/cpu_device_*.log
          if-no-files-found: ignore

  cpu-device-test-macos:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: CPU device (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opt-125m-v1

      - name: Cache vLLM pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: vllm-cpu-macos-latest-py3.12-nightly
          restore-keys: |
            vllm-cpu-macos-latest-py3.12-

      - name: Install lmcache (CPU-only, no vLLM)
        env:
          NO_GPU_EXT: "1"
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt
          python -m pip install torch
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/cli.txt
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Install vLLM CPU build
        env:
          VLLM_TARGET_DEVICE: cpu
          VLLM_VERSION_TAG: v0.22.1
        run: |
          # macOS has no prebuilt CPU wheel on wheels.vllm.ai, and the
          # PyPI sdist for vLLM carries a "+cpu" PEP 440 local label that
          # pip 26 rejects as "inconsistent version", forcing a silent
          # fallback to 0.19.1 (which predates kv_connector_module_path
          # and breaks LMCacheMPConnector). Build from the upstream git
          # tag instead so the source-tree version stays clean. Build
          # isolation is left on so vLLM's pyproject build-system pulls
          # in cmake / setuptools-rust / torch on its own.
          pip install "numpy<2"
          pip install \
            "vllm @ git+https://github.com/vllm-project/vllm@${VLLM_VERSION_TAG}"
          python -c "import vllm; print('vllm:', vllm.__version__)"

      - name: Download facebook/opt-125m
        run: |
          python3 << 'EOF'
          from huggingface_hub import snapshot_download
          import time
          import sys
          
          max_retries = 3
          retry_delay = 30
          
          for attempt in range(max_retries):
              try:
                  print(f'Attempt {attempt + 1}/{max_retries}: Downloading facebook/opt-125m...')
                  snapshot_download('facebook/opt-125m')
                  print('Model downloaded successfully')
                  sys.exit(0)
              except Exception as e:
                  print(f'Attempt {attempt + 1} failed: {e}')
                  if attempt < max_retries - 1:
                      print(f'Waiting {retry_delay} seconds before retry...')
                      time.sleep(retry_delay)
                      retry_delay *= 2  # Exponential backoff
                  else:
                      print('All retry attempts failed. Continuing anyway...')
                      print('NOTE: The test may fail if the model is not available locally')
          EOF

      - name: Server bench (data mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=data \
          LMCACHE_HTTP_PORT_BENCH=18080 \
          LMCACHE_ZMQ_PORT_BENCH=15555 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: Server bench (handle mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_BENCH_TRANSFER_MODE=handle \
          LMCACHE_HTTP_PORT_BENCH=18081 \
          LMCACHE_ZMQ_PORT_BENCH=15556 \
            .github/scripts/cpu_device_test.sh server_bench

      - name: vLLM e2e (pickle mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=pickle \
          LMCACHE_HTTP_PORT_E2E=18082 \
          LMCACHE_ZMQ_PORT_E2E=15557 \
          VLLM_PORT_E2E=18000 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: vLLM e2e (handle mode)
        run: |
          chmod +x .github/scripts/cpu_device_test.sh
          LMCACHE_E2E_TRANSPORT_MODE=handle \
          LMCACHE_HTTP_PORT_E2E=18083 \
          LMCACHE_ZMQ_PORT_E2E=15558 \
          VLLM_PORT_E2E=18001 \
            .github/scripts/cpu_device_test.sh vllm_e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-device-logs-macos-latest
          path: |
            /tmp/cpu_device_*.log
          if-no-files-found: ignore