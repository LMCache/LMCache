name: "Operator: Nightly"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: lmcache/lmcache-operator

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: operator

jobs:
  nightly:
    name: Build, push, and release nightly
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute nightly tag
        id: tag
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "TAG=nightly-${DATE}" >> "$GITHUB_OUTPUT"
          echo "CHART_VERSION=0.0.0-nightly.${DATE//-/}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3

      - name: Build installer and Helm chart
        id: artifacts
        run: |
          make package-chart VERSION=${{ steps.tag.outputs.TAG }} CHART_VERSION=${{ steps.tag.outputs.CHART_VERSION }}
          chart_packages=(dist/lmcache-operator-*.tgz)
          test "${#chart_packages[@]}" -eq 1
          test -f "${chart_packages[0]}"
          make build-installer CHART="${chart_packages[0]}" IMG=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
          echo "CHART_FILE=$(basename "${chart_packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: operator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:nightly

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: operator-nightly-latest
          name: "Operator Nightly Latest (${{ steps.tag.outputs.TAG }})"
          prerelease: true
          make_latest: false
          body: |
            Automated nightly operator build from `dev` branch.

            **Image:** `${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}`

            Install cert-manager before installing the operator.

            ```bash
            helm upgrade --install lmcache-operator \
              https://github.com/${{ github.repository }}/releases/download/operator-nightly-latest/${{ steps.artifacts.outputs.CHART_FILE }} \
              --namespace lmcache-operator-system --create-namespace --wait
            ```

            Or use the rendered YAML:

            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/operator-nightly-latest/install.yaml
            ```
          files: |
            operator/dist/install.yaml
            operator/dist/lmcache-operator-*.tgz
