name: PR CI

on:
  pull_request:
    branches: [dev, "release-**"]
    types: [opened, synchronize, reopened, ready_for_review]

# Label-driven full builds have their own workflow and concurrency group.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/ci_fast_gate.yml

  changes:
    if: github.event.pull_request.draft != true
    name: Select PR checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      actionlint: ${{ steps.filter.outputs.actionlint }}
      aerospike: ${{ steps.filter.outputs.aerospike }}
      build-cpu: ${{ steps.filter.outputs.build_cpu }}
      build-cli: ${{ steps.filter.outputs.build_cli }}
      build-rbln: ${{ steps.filter.outputs.build_rbln }}
      codeql: ${{ github.base_ref == 'dev' }}
    steps:
      # Reusable calls do not apply the callee's event filters. Preserve their
      # coverage here using picomatch syntax (which differs from GitHub globs).
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            actionlint:
              - '.github/actions/*.{yml,yaml}'
              - '.github/workflows/*.{yml,yaml}'
              - '.github/workflows/actionlint.*'
            aerospike:
              - 'csrc/storage_backends/aerospike/**'
              - 'lmcache/v1/distributed/l2_adapters/aerospike_l2_adapter.py'
              - 'setup.py'
              - 'tests/aerospike_ce.conf.template'
              - 'tests/v1/distributed/test_aerospike_*'
              - '.github/workflows/aerospike_integration.yml'
            build_cpu:
              - 'setup.py'
              - 'pyproject.toml'
              - 'csrc/**'
              - 'requirements/common.txt'
              - 'requirements/build.txt'
              - 'lmcache/__init__.py'
              - '.github/workflows/build_cpu_artifacts.yml'
              - '.github/actions/build-artifacts/action.yml'
            build_cli:
              - 'lmcache/cli/**/*.py'
              - 'pyproject_cli.toml'
              - 'requirements/cli.txt'
              - '.github/workflows/build_cli_artifacts.yml'
              - '.github/actions/build-artifacts/action.yml'
            build_rbln:
              - '.github/workflows/build_rbln_artifacts.yml'
              - '.github/scripts/build_rbln_wheel.sh'
              - 'setup_extensions/build_profiles/rbln.py'

  test:
    needs: gate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml

  cpu:
    needs: gate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/cpu_device.yml
    secrets:
      hf_token: ${{ secrets.hf_token }}

  operator:
    needs: gate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/operator_ci.yml

  actionlint:
    needs: [gate, changes]
    if: needs.changes.outputs.actionlint == 'true'
    uses: ./.github/workflows/actionlint.yml

  aerospike:
    needs: [gate, changes]
    if: needs.changes.outputs.aerospike == 'true'
    uses: ./.github/workflows/aerospike_integration.yml

  build-cpu:
    needs: [gate, changes]
    if: needs.changes.outputs.build-cpu == 'true'
    uses: ./.github/workflows/build_cpu_artifacts.yml

  build-cli:
    needs: [gate, changes]
    if: needs.changes.outputs.build-cli == 'true'
    uses: ./.github/workflows/build_cli_artifacts.yml

  build-rbln:
    needs: [gate, changes]
    if: needs.changes.outputs.build-rbln == 'true'
    uses: ./.github/workflows/build_rbln_artifacts.yml

  codeql:
    needs: [gate, changes]
    if: needs.changes.outputs.codeql == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  summary:
    name: ${{ github.event.pull_request.draft == true && 'Ignored PR CI event' || 'PR CI Summary' }}
    if: always() && github.event.pull_request.draft != true
    needs: [gate, changes, test, cpu, operator, actionlint, aerospike, build-cpu, build-cli, build-rbln, codeql]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required and selected jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          # A skipped required job is a failure, even when every dependent
          # job was skipped too. Optional jobs must match the path decision.
          jq -e '
            . as $jobs |
            all(["gate", "changes", "test", "cpu", "operator"][];
                $jobs[.].result == "success") and
            all(["actionlint", "aerospike", "build-cpu", "build-cli", "build-rbln", "codeql"][];
                . as $name |
                $jobs.changes.outputs[$name] as $selected |
                ($selected == "true" or $selected == "false") and
                $jobs[$name].result ==
                  (if $selected == "true" then "success" else "skipped" end))
          ' <<<"$NEEDS"
