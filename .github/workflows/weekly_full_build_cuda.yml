name: Weekly full build (CUDA)

on:
  workflow_call:
    inputs:
      run_prepare:
        description: Fast-forward ci-weekly-full before running
        required: false
        default: true
        type: boolean
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: weekly-full-build-cuda
  cancel-in-progress: false

jobs:
  weekly:
    permissions:
      contents: write
    uses: ./.github/workflows/weekly_device_build.yml
    with:
      label: CUDA
      manifest: .buildkite/k3_tests/weekly/manifest.json
      out_dir: weekly-full-build
      artifact: weekly-full-build
      timeout_minutes: 330
      run_prepare: ${{ inputs.run_prepare }}
    secrets: inherit
