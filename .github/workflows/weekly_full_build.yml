name: Weekly full build

# Runs the full CUDA, Intel XPU, AMD ROCm, and RBLN suites as a weekly
# regression checkpoint while per-PR CI gets narrower. A run passes only when
# every required job ran and passed (.buildkite/k3_tests/weekly/manifest*.json,
# README.md next to them).
#
# Sunday 08:00 UTC is the quietest window of the k8s CUDA GPU queue in the
# 30-day PR CI baseline (2026-10-17 to 2026-11-15): 0.6 of 16 GPUs busy on
# average over the following six hours.

on:
  # Enable after validating manual runs (see #6919 for CUDA schedule):
  # schedule:
  #   - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      device:
        description: Device suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - cuda
          - xpu
          - amd
          - rbln

permissions:
  contents: read

concurrency:
  group: weekly-full-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ci-weekly-full branch
    if: github.repository == 'LMCache/LMCache'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Moves the CI-owned ci-weekly-full branch to the tested commit.
      contents: write
    outputs:
      matrix: ${{ steps.select-devices.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Select device matrix
        id: select-devices
        env:
          SELECTED_DEVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.device || 'all' }}
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os

          selected = os.environ["SELECTED_DEVICE"]
          all_devices = [
              {
                  "device": "cuda",
                  "label": "CUDA",
                  "manifest": ".buildkite/k3_tests/weekly/manifest.json",
                  "out_dir": "weekly-full-build",
                  "artifact": "weekly-full-build",
                  "timeout_minutes": 330,
              },
              {
                  "device": "xpu",
                  "label": "XPU",
                  "manifest": ".buildkite/k3_tests/weekly/manifest-xpu.json",
                  "out_dir": "weekly-full-build-xpu",
                  "artifact": "weekly-full-build-xpu",
                  "timeout_minutes": 330,
              },
              {
                  "device": "amd",
                  "label": "AMD",
                  "manifest": ".buildkite/k3_tests/weekly/manifest-amd.json",
                  "out_dir": "weekly-full-build-amd",
                  "artifact": "weekly-full-build-amd",
                  "timeout_minutes": 345,
              },
              {
                  "device": "rbln",
                  "label": "RBLN",
                  "manifest": ".buildkite/k3_tests/weekly/manifest-rbln.json",
                  "out_dir": "weekly-full-build-rbln",
                  "artifact": "weekly-full-build-rbln",
                  "timeout_minutes": 330,
              },
          ]
          include = [
              d for d in all_devices if selected == "all" or d["device"] == selected
          ]
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

      # Builds run on their own branch: dev cancels intermediate builds, so a
      # weekly build on dev would be cancelled by the next merge.
      - name: Fast-forward ci-weekly-full to the tested commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "${SOURCE_REF}" != "refs/heads/dev" ]]; then
            echo "::error::Weekly full build must run from refs/heads/dev (got ${SOURCE_REF})." >&2
            exit 1
          fi
          if git fetch --no-tags origin \
              refs/heads/ci-weekly-full:refs/remotes/origin/ci-weekly-full; then
            if ! git merge-base --is-ancestor \
                refs/remotes/origin/ci-weekly-full "${SOURCE_COMMIT}"; then
              echo "::error::ci-weekly-full cannot fast-forward to ${SOURCE_COMMIT}; run this workflow from dev." >&2
              exit 1
            fi
          fi
          git push origin "${SOURCE_COMMIT}:refs/heads/ci-weekly-full"
          # If a pipeline still builds pushes to this branch, let that build
          # exist before the weekly ones: created later, it could cancel them
          # through "Cancel Intermediate Builds".
          sleep 90

  full-build:
    name: Weekly full build (${{ matrix.label }})
    needs: prepare
    if: github.repository == 'LMCache/LMCache'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run and check the ${{ matrix.label }} full build on Buildkite
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILD_KITE_API_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/weekly_full_build.py \
            --manifest "${{ matrix.manifest }}" \
            --commit "${SOURCE_COMMIT}" \
            --out-dir "${{ matrix.out_dir }}" \
            --timeout-minutes "${{ matrix.timeout_minutes }}"

      - name: Keep the report and failed-job logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: ${{ matrix.out_dir }}/
          if-no-files-found: warn
          retention-days: 90
