name: Weekly full build

# Orchestrates the weekly CUDA, Intel XPU, AMD ROCm, and RBLN suites from a
# single schedule and produces one combined workflow run. Each device suite
# lives in its own workflow file (weekly_full_build_<device>.yml) so it can
# be maintained independently, while manual and scheduled runs always go
# through this orchestrator.
#
# Sunday 08:00 UTC is the quietest window of the k8s CUDA GPU queue in the
# 30-day PR CI baseline (2026-10-17 to 2026-11-15): 0.6 of 16 GPUs busy on
# average over the following six hours.

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      device:
        description: Device suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - cuda
          - xpu
          - amd
          - rbln

permissions:
  contents: read

concurrency:
  group: weekly-full-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ci-weekly-full branch
    if: github.repository == 'LMCache/LMCache'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Moves the CI-owned ci-weekly-full branch to the tested commit.
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      # Builds run on their own branch: dev cancels intermediate builds, so a
      # weekly build on dev would be cancelled by the next merge.
      - name: Fast-forward ci-weekly-full to the tested commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "${SOURCE_REF}" != "refs/heads/dev" ]]; then
            echo "::error::Weekly full build must run from refs/heads/dev (got ${SOURCE_REF})." >&2
            exit 1
          fi
          if git fetch --no-tags origin \
              refs/heads/ci-weekly-full:refs/remotes/origin/ci-weekly-full; then
            if ! git merge-base --is-ancestor \
                refs/remotes/origin/ci-weekly-full "${SOURCE_COMMIT}"; then
              echo "::error::ci-weekly-full cannot fast-forward to ${SOURCE_COMMIT}; run this workflow from dev." >&2
              exit 1
            fi
          fi
          git push origin "${SOURCE_COMMIT}:refs/heads/ci-weekly-full"
          # If a pipeline still builds pushes to this branch, let that build
          # exist before the weekly ones: created later, it could cancel them
          # through "Cancel Intermediate Builds".
          sleep 90

  cuda:
    name: Weekly full build (CUDA)
    needs: prepare
    if: github.repository == 'LMCache/LMCache' && (github.event_name != 'workflow_dispatch' || inputs.device == 'all' || inputs.device == 'cuda')
    uses: ./.github/workflows/weekly_full_build_cuda.yml
    secrets: inherit

  xpu:
    name: Weekly full build (XPU)
    needs: prepare
    if: github.repository == 'LMCache/LMCache' && (github.event_name != 'workflow_dispatch' || inputs.device == 'all' || inputs.device == 'xpu')
    uses: ./.github/workflows/weekly_full_build_xpu.yml
    secrets: inherit

  amd:
    name: Weekly full build (AMD)
    needs: prepare
    if: github.repository == 'LMCache/LMCache' && (github.event_name != 'workflow_dispatch' || inputs.device == 'all' || inputs.device == 'amd')
    uses: ./.github/workflows/weekly_full_build_amd.yml
    secrets: inherit

  rbln:
    name: Weekly full build (RBLN)
    needs: prepare
    if: github.repository == 'LMCache/LMCache' && (github.event_name != 'workflow_dispatch' || inputs.device == 'all' || inputs.device == 'rbln')
    uses: ./.github/workflows/weekly_full_build_rbln.yml
    secrets: inherit
