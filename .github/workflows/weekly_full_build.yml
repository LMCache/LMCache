name: Weekly full build

# Runs the full CUDA and Intel XPU suites as a weekly regression checkpoint
# while per-PR CI gets narrower: CUDA (k3-unit-tests, k3-multiprocess-test +
# DSV4 TP=4, k3-blend-test) and Intel XPU (unit-tests-xpu, xpu-mp-test).
# A run passes only when every required job ran and passed
# (.buildkite/k3_tests/weekly/manifest.json, manifest-xpu.json, README.md).
#
# Sunday 08:00 UTC is the quietest window of the k8s CUDA GPU queue in the
# 30-day PR CI baseline (2026-10-17 to 2026-11-15): 0.6 of 16 GPUs busy on
# average over the following six hours.

on:
  # Enable after validating manual runs (see #6919 for CUDA schedule):
  # schedule:
  #   - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      device:
        description: Device suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - cuda
          - xpu

permissions:
  contents: read

concurrency:
  group: weekly-full-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ci-weekly-full branch
    if: github.repository == 'LMCache/LMCache'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Moves the CI-owned ci-weekly-full branch to the tested commit.
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      # Builds run on their own branch: dev cancels intermediate builds, so a
      # weekly build on dev would be cancelled by the next merge.
      - name: Fast-forward ci-weekly-full to the tested commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "${SOURCE_REF}" != "refs/heads/dev" ]]; then
            echo "::error::Weekly full build must run from refs/heads/dev (got ${SOURCE_REF})." >&2
            exit 1
          fi
          if git fetch --no-tags origin \
              refs/heads/ci-weekly-full:refs/remotes/origin/ci-weekly-full; then
            if ! git merge-base --is-ancestor \
                refs/remotes/origin/ci-weekly-full "${SOURCE_COMMIT}"; then
              echo "::error::ci-weekly-full cannot fast-forward to ${SOURCE_COMMIT}; run this workflow from dev." >&2
              exit 1
            fi
          fi
          git push origin "${SOURCE_COMMIT}:refs/heads/ci-weekly-full"
          # If a pipeline still builds pushes to this branch, let that build
          # exist before the weekly ones: created later, it could cancel them
          # through "Cancel Intermediate Builds".
          sleep 90

  full-build:
    name: Weekly full build (CUDA)
    needs: prepare
    if: >-
      github.repository == 'LMCache/LMCache' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.device == 'all' || inputs.device == 'cuda')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run and check the full build on Buildkite
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILD_KITE_API_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/weekly_full_build.py \
            --manifest .buildkite/k3_tests/weekly/manifest.json \
            --commit "${SOURCE_COMMIT}" \
            --out-dir weekly-full-build \
            --timeout-minutes 330

      - name: Keep the report and failed-job logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weekly-full-build-${{ github.run_number }}
          path: weekly-full-build/
          if-no-files-found: warn
          retention-days: 90

  full-build-xpu:
    name: Weekly full build (XPU)
    needs: prepare
    if: >-
      github.repository == 'LMCache/LMCache' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.device == 'all' || inputs.device == 'xpu')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run and check the XPU full build on Buildkite
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILD_KITE_API_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/weekly_full_build.py \
            --manifest .buildkite/k3_tests/weekly/manifest-xpu.json \
            --commit "${SOURCE_COMMIT}" \
            --out-dir weekly-full-build-xpu \
            --timeout-minutes 330

      - name: Keep the report and failed-job logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weekly-full-build-xpu-${{ github.run_number }}
          path: weekly-full-build-xpu/
          if-no-files-found: warn
          retention-days: 90
