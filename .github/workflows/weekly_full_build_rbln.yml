name: Weekly full build (RBLN)

on:
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: weekly-full-build-rbln
  cancel-in-progress: false

jobs:
  weekly:
    uses: ./.github/workflows/weekly_device_build.yml
    with:
      label: RBLN
      manifest: .buildkite/k3_tests/weekly/manifest-rbln.json
      out_dir: weekly-full-build-rbln
      artifact: weekly-full-build-rbln
      timeout_minutes: 330
    secrets: inherit
