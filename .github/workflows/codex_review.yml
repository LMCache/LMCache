name: Codex PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.triage.outputs.tier }}
      final_message: ${{ steps.agent.outputs.final-message }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          # After stabilizing, switch to block and allowlist:
          #   api.openai.com:443
          #   github.com:443
          #   registry.npmjs.org:443
          #   huggingface.co:443

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Smart triage
        id: triage
        run: |
          BASE="${{ github.base_ref }}"
          FILES=$(git diff --name-only origin/${BASE}...HEAD)
          INSERTIONS=$(git diff --shortstat origin/${BASE}...HEAD \
            | grep -oP '\d+(?= insertion)' || echo 0)

          # Docs/config only → skip
          NON_DOC=$(echo "$FILES" | grep -vE '\.(md|yml|yaml|txt|rst|json|toml)$' || true)
          if [ -z "$NON_DOC" ]; then
            echo "tier=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CUDA/Rust/core/new files/large diff → full
          HEAVY=$(echo "$FILES" | grep -E '\.(cu|cuh|rs)$|csrc/|rust/|lmcache/v1/' || true)
          NEW=$(git diff --diff-filter=A --name-only origin/${BASE}...HEAD || true)
          if [ -n "$HEAVY" ] || [ -n "$NEW" ] || [ "$INSERTIONS" -gt 300 ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
          else
            echo "tier=lite" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex agent
        id: agent
        if: steps.triage.outputs.tier != 'skip'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          model: o3
          sandbox: danger-full-access
          safety-strategy: drop-sudo
          output-file: /tmp/review.json
          allow-bots: dependabot[bot]
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PR_BASE: ${{ github.base_ref }}
          PR_TIER: ${{ steps.triage.outputs.tier }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  post_comment:
    needs: codex
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post review comment
        uses: actions/github-script@v7
        env:
          TIER: ${{ needs.codex.outputs.tier }}
          CODEX_MSG: ${{ needs.codex.outputs.final_message }}
        with:
          script: |
            const tier = process.env.TIER;
            const raw = process.env.CODEX_MSG || '';

            if (tier === 'skip') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '**Codex Review:** Skipped (docs/config-only changes)'
              });
              return;
            }

            let body;
            try {
              const data = JSON.parse(raw);
              const icons = { pass: 'PASS', fail: 'FAIL', warn: 'WARN' };
              const sevIcons = { error: 'ERROR', warning: 'WARN', info: 'info' };
              const verdict = icons[data.verdict] || 'UNKNOWN';

              let table = '';
              if (data.findings && data.findings.length > 0) {
                table = '\n### Findings\n\n';
                table += '| # | Severity | Category | File | Message |\n';
                table += '|---|----------|----------|------|---------|\n';
                data.findings.forEach((f, i) => {
                  const loc = f.line ? `${f.file}:${f.line}` : f.file;
                  table += `| ${i + 1} | ${sevIcons[f.severity] || f.severity} | ${f.category} | \`${loc}\` | ${f.message} |\n`;
                });
              }

              body = `## Codex PR Review\n\n`;
              body += `**Verdict: ${verdict}** | Confidence: ${data.confidence} | Tier: ${tier}\n\n`;
              body += `### Summary\n${data.summary}\n`;
              body += table;
              body += `\n---\n*Powered by [Codex GHA](https://developers.openai.com/codex/github-action) with o3*`;
            } catch (e) {
              // Fail-closed: if we can't parse, show raw output
              body = `## Codex PR Review\n\n`;
              body += `**Verdict: ERROR** — could not parse agent output.\n\n`;
              body += `<details><summary>Raw output</summary>\n\n\`\`\`\n${raw || '(empty)'}\n\`\`\`\n</details>`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  gate:
    needs: codex
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate verdict (fail-closed)
        env:
          TIER: ${{ needs.codex.outputs.tier }}
          CODEX_MSG: ${{ needs.codex.outputs.final_message }}
        run: |
          if [ "$TIER" = "skip" ]; then
            echo "Docs-only PR — pass"
            exit 0
          fi

          # Fail-closed: if output is empty or unparsable, block the PR
          if [ -z "$CODEX_MSG" ]; then
            echo "::error::Codex agent produced no output — failing closed"
            exit 1
          fi

          VERDICT=$(echo "$CODEX_MSG" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              v = data.get('verdict', '')
              if v not in ('pass', 'fail', 'warn'):
                  print('error')
              else:
                  print(v)
          except Exception:
              print('error')
          ")

          echo "Verdict: $VERDICT"

          case "$VERDICT" in
            pass)
              echo "Codex review passed"
              exit 0
              ;;
            warn)
              echo "::warning::Codex review has warnings — see PR comment"
              exit 0
              ;;
            fail)
              echo "::error::Codex review failed — see PR comment for details"
              exit 1
              ;;
            *)
              echo "::error::Could not parse Codex output — failing closed"
              exit 1
              ;;
          esac
