name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  codex:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.triage.outputs.tier }}
      final_message: ${{ steps.agent.outputs.final-message }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          # After stabilizing, switch to block and allowlist:
          #   api.openai.com:443
          #   github.com:443
          #   registry.npmjs.org:443
          #   huggingface.co:443

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Smart triage
        id: triage
        run: |
          BASE="${{ github.base_ref }}"
          FILES=$(git diff --name-only origin/${BASE}...HEAD)
          INSERTIONS=$(git diff --shortstat origin/${BASE}...HEAD \
            | grep -oP '\d+(?= insertion)' || echo 0)

          # Docs/config only → skip
          NON_DOC=$(echo "$FILES" | grep -vE '\.(md|yml|yaml|txt|rst|json|toml)$' || true)
          if [ -z "$NON_DOC" ]; then
            echo "tier=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CUDA/Rust/core/new files/large diff → full
          HEAVY=$(echo "$FILES" | grep -E '\.(cu|cuh|rs)$|csrc/|rust/|lmcache/v1/' || true)
          NEW=$(git diff --diff-filter=A --name-only origin/${BASE}...HEAD || true)
          if [ -n "$HEAVY" ] || [ -n "$NEW" ] || [ "$INSERTIONS" -gt 300 ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
          else
            echo "tier=lite" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex agent
        id: agent
        if: steps.triage.outputs.tier != 'skip'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          model: o3
          sandbox: danger-full-access
          safety-strategy: drop-sudo
          output-file: /tmp/review.json
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PR_BASE: ${{ github.base_ref }}
          PR_TIER: ${{ steps.triage.outputs.tier }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  gate:
    needs: codex
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate verdict (fail-closed)
        env:
          TIER: ${{ needs.codex.outputs.tier }}
          CODEX_MSG: ${{ needs.codex.outputs.final_message }}
        run: |
          if [ "$TIER" = "skip" ]; then
            echo "Docs-only PR — pass"
            exit 0
          fi

          if [ -z "$CODEX_MSG" ]; then
            echo "::error::Codex agent produced no output — failing closed"
            exit 1
          fi

          VERDICT=$(echo "$CODEX_MSG" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              v = data.get('verdict', '')
              if v not in ('pass', 'fail', 'warn'):
                  print('error')
              else:
                  print(v)
          except Exception:
              print('error')
          ")

          echo "Verdict: $VERDICT"

          case "$VERDICT" in
            pass)
              echo "Codex review passed"
              exit 0
              ;;
            warn)
              echo "::warning::Codex review has warnings"
              exit 0
              ;;
            fail)
              echo "::error::Codex review failed"
              exit 1
              ;;
            *)
              echo "::error::Could not parse Codex output — failing closed"
              exit 1
              ;;
          esac
