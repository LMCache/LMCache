name: PR Full Build

# Build all release artifacts (sdist + CUDA wheel, CLI wheel, raw-block Rust
# module wheels, cu129 wheel, standard ROCm wheel, ROCm torch 2.10 wheel) on
# PRs carrying the `full` label.
# The `full` label is added automatically by automerge-labeler.yml when
# auto-merge is enabled on a code-change PR, so this acts as a pre-merge sanity
# check that wheels still build.
#
# No tests, no code-quality checks, no publishing — those are covered by
# test.yml / code_quality_checks.yml (per-PR) and publish.yml (on merge).

on:
    pull_request:
        branches:
            - dev
            - "release-**"
        types: [opened, synchronize, reopened, labeled]

# Cancel older in-flight runs on the same PR. github.ref is
# refs/pull/<N>/merge on pull_request events, so each PR gets its own group.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Each build runs independently — a failure in one does not skip the
    # others, matching publish.yml's isolation model.

    build-main:
        name: Build main
        if: contains(github.event.pull_request.labels.*.name, 'full')
        uses: ./.github/workflows/build_main_artifacts.yml

    build-cli:
        name: Build CLI
        if: contains(github.event.pull_request.labels.*.name, 'full')
        uses: ./.github/workflows/build_cli_artifacts.yml

    build-raw-block:
        name: Build raw-block Rust module
        if: contains(github.event.pull_request.labels.*.name, 'full')
        uses: ./.github/workflows/build_raw_block_artifacts.yml

    build-cpu:
        name: Build CPU
        if: contains(github.event.pull_request.labels.*.name, 'full')
        uses: ./.github/workflows/build_cpu_artifacts.yml

    # cu12.9 wheels need a cu129 build of the pyproject.toml torch pin.
    cu129-check:
        name: Check cu12.9 torch
        if: contains(github.event.pull_request.labels.*.name, 'full')
        runs-on: ubuntu-24.04
        outputs:
            cu129: ${{ steps.check.outputs.cu129 }}
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                sparse-checkout: |
                    .github/scripts/resolve_release_stack.py
                    pyproject.toml
                sparse-checkout-cone-mode: false
            - id: check
              run: |
                PIN=$(grep -m1 -oE '"torch==[0-9.]+"' pyproject.toml | tr -d '"' | cut -d= -f3)
                python3 .github/scripts/resolve_release_stack.py --cu129-for-torch "$PIN"

    build-cu129:
        name: Build cu129
        needs: cu129-check
        if: contains(github.event.pull_request.labels.*.name, 'full') && needs.cu129-check.outputs.cu129 == 'true'
        uses: ./.github/workflows/build_cu129_artifacts.yml
        # Fork PRs won't expose DOCKERHUB_TOKEN even with `inherit`; the login
        # step in build_cu129_artifacts.yml guards on the token being non-empty.
        secrets:
            dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

    build-rocm:
        name: Build ROCm
        if: contains(github.event.pull_request.labels.*.name, 'full')
        uses: ./.github/workflows/build_rocm_artifacts.yml
        secrets: inherit

    build-rocm-torch210:
        name: Build ROCm torch 2.10
        if: contains(github.event.pull_request.labels.*.name, 'full')
        uses: ./.github/workflows/build_rocm_torch210_artifacts.yml
        secrets: inherit
