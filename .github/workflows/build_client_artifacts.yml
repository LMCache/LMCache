name: Build Client Artifacts

# Build the lmcache-client wheel from pyproject_client.toml (#6315), the way
# build_cli_artifacts.yml builds lmcache-cli, and smoke-test the installed
# wheel. pr_full_build.yml calls this on `full` PRs.

on:
    workflow_call:
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches:
            - dev
            - "release-**"
        paths:
            - 'lmcache/**'
            - 'pyproject_client.toml'
            - 'requirements/client.txt'
            - 'setup.py'
            - 'setup_extensions/**'
            - 'csrc/lmcache_native/**'
            - 'pyproject.toml'
            - 'requirements/build.txt'
            - '.github/scripts/build_client_wheel.sh'
            - '.github/scripts/smoke_client_wheel.py'
            - '.github/workflows/build_client_artifacts.yml'

env:
    LC_ALL: en_US.UTF-8

defaults:
    run:
        shell: bash

concurrency:
    # Under pr_full_build.yml github.workflow is the caller's name, so an
    # unprefixed group equals the caller's and the call is cancelled as a deadlock.
    group: build-client-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-client-cpu:
        if: github.event.pull_request.draft != true
        name: Build lmcache-client (CPU)
        runs-on: ubuntu-24.04
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Prepare artifact build
              uses: ./.github/actions/build-artifacts
              with:
                python_version: "3.13"
                pip_packages: build
                requirements_file: requirements/build.txt
                release_tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

            - name: Check every listed module has a file
              # setuptools only warns about a py-modules entry without one.
              run: |
                python - <<'EOF'
                import pathlib, tomllib
                config = tomllib.loads(pathlib.Path("pyproject_client.toml").read_text())
                missing = [
                    m for m in config["tool"]["setuptools"]["py-modules"]
                    if m != "lmcache._version"
                    and not pathlib.Path(m.replace(".", "/") + ".py").is_file()
                ]
                if missing:
                    raise SystemExit(f"pyproject_client.toml lists no file for {missing}")
                EOF

            - name: Install the CPU build of the pinned torch
              run: |
                pip install --index-url https://download.pytorch.org/whl/cpu \
                  "$(grep -oE 'torch==[0-9][0-9.]*' pyproject_client.toml | head -1)"

            - name: Build lmcache-client wheel
              run: |
                .github/scripts/build_client_wheel.sh dist --no-isolation
                test -z "$(git status --porcelain)"

            - name: Install the wheel in a clean venv
              run: |
                python -m venv "$RUNNER_TEMP/venv-client"
                "$RUNNER_TEMP/venv-client/bin/pip" install --index-url https://download.pytorch.org/whl/cpu \
                  "$(grep -oE 'torch==[0-9][0-9.]*' pyproject_client.toml | head -1)"
                "$RUNNER_TEMP/venv-client/bin/pip" install dist/lmcache_client-*.whl

            - name: Smoke-test the installed client wheel
              # Outside the checkout and isolated, so lmcache is the installed wheel.
              run: |
                cd "$RUNNER_TEMP"
                venv-client/bin/python -I "$GITHUB_WORKSPACE/.github/scripts/smoke_client_wheel.py"
