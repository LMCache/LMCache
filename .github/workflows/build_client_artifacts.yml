name: Build Client Artifacts

# Build the lmcache-client wheel with tools/client_wheel/build.py in both
# boundary modes (#6315) and check that the checkout is left untouched.
# pr_full_build.yml calls this on `full` PRs; the paths below cover the rest.

on:
    workflow_call:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches:
            - dev
            - "release-**"
        paths:
            - 'tools/client_wheel/**'
            - 'setup_extensions/**'
            - 'csrc/lmcache_native/**'
            - 'setup.py'
            - 'pyproject.toml'
            - 'requirements/build.txt'
            - '.github/workflows/build_client_artifacts.yml'
            - '.github/scripts/assert_native_ops.py'
            - '.github/scripts/install_vllm_cpu.sh'
            - 'pyproject_cli.toml'

env:
    LC_ALL: en_US.UTF-8

defaults:
    run:
        shell: bash

concurrency:
    # Under pr_full_build.yml github.workflow is the caller's name, so an
    # unprefixed group equals the caller's and the call is cancelled as a deadlock.
    group: build-client-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-client-cpu:
        if: github.event.pull_request.draft != true
        name: Build lmcache-client (CPU)
        runs-on: ubuntu-24.04
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Prepare artifact build
              uses: ./.github/actions/build-artifacts
              with:
                python_version: "3.13"
                pip_packages: build
                requirements_file: requirements/build.txt
                release_tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

            - name: Install the CPU build of the pinned torch
              # build.py --no-isolation requires the [build-system] torch pin.
              run: |
                pip install --index-url https://download.pytorch.org/whl/cpu \
                  "$(grep -oE 'torch==[0-9][0-9.]*' pyproject.toml | head -1)"

            - name: Use the version the root build would get
              run: echo "CLIENT_VERSION=$(python -m setuptools_scm | tail -1)" >> "$GITHUB_ENV"

            - name: Snapshot the checkout
              run: |
                git status --porcelain --ignored=matching --untracked-files=all > "$RUNNER_TEMP/before.txt"
                git ls-files -z --others | xargs -0 -r sha256sum >> "$RUNNER_TEMP/before.txt"

            - name: Build (strict boundary)
              run: |
                NO_GPU_EXT=1 python tools/client_wheel/build.py --no-isolation \
                  --version "${CLIENT_VERSION}" --out "$RUNNER_TEMP/client-strict"

            - name: Build (transitional boundary)
              run: |
                NO_GPU_EXT=1 python tools/client_wheel/build.py --no-isolation \
                  --boundary transitional --version "${CLIENT_VERSION}" \
                  --out "$RUNNER_TEMP/client-transitional"

            - name: Check the checkout is unchanged
              run: |
                git status --porcelain --ignored=matching --untracked-files=all > "$RUNNER_TEMP/after.txt"
                git ls-files -z --others | xargs -0 -r sha256sum >> "$RUNNER_TEMP/after.txt"
                diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"

            - name: Audit both wheels and the transitional imports
              # Requirement differences without a reason (exit 3) are fatal only on PRs
              # that edit tools/client_wheel/, like the ratchet below.
              env:
                BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                status=0
                for mode in strict transitional; do
                  python tools/client_wheel/audit.py "$RUNNER_TEMP"/client-$mode/*.whl \
                    --staging "$RUNNER_TEMP/client-$mode/STAGING_MANIFEST.json" --boundary $mode \
                    --requirements || status=$?
                  [ "$status" = 0 ] || [ "$status" = 3 ] || exit "$status"
                done
                python tools/client_wheel/check_imports.py --boundary transitional \
                  --wheel "$RUNNER_TEMP"/client-transitional/*.whl
                [ "$status" = 0 ] && exit 0
                echo "::warning::give each requirement difference a reason in tools/client_wheel/manifest.toml"
                [ -z "$BASE_SHA" ] || git diff --quiet "$BASE_SHA" HEAD -- tools/client_wheel/

            - name: Strict failures must equal the transitional list
              # Fatal only on PRs that edit tools/client_wheel/, so a stale entry
              # does not block source migrations elsewhere.
              env:
                BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                python tools/client_wheel/check_imports.py --ratchet \
                  --wheel "$RUNNER_TEMP"/client-transitional/*.whl && exit 0
                [ -z "$BASE_SHA" ] || git diff --quiet "$BASE_SHA" HEAD -- tools/client_wheel/
                echo "::warning::update transitional in tools/client_wheel/manifest.toml"

            - name: A server file in the manifest must fail the build
              run: |
                sed -i '0,/^files = \[/s||&\n    "lmcache/v1/multiprocess/server.py",|' tools/client_wheel/manifest.toml
                if NO_GPU_EXT=1 python tools/client_wheel/build.py --no-isolation --version "$CLIENT_VERSION" \
                    --out "$RUNNER_TEMP/neg" 2> "$RUNNER_TEMP/neg.txt"; then exit 1; fi
                git checkout -- tools/client_wheel/manifest.toml
                grep "in a deny area: lmcache/v1/multiprocess/server.py" "$RUNNER_TEMP/neg.txt"

            - name: Excluding a file the client imports must fail
              run: |
                cp tools/client_wheel/manifest.toml "$RUNNER_TEMP/exclude.toml"
                printf '\n[[exclude]]\nowner = "test"\nreason = "counterexample"\npaths = ["lmcache/logging.py"]\n' \
                  >> "$RUNNER_TEMP/exclude.toml"
                if python tools/client_wheel/check_imports.py --source-tree . --boundary transitional \
                    --manifest "$RUNNER_TEMP/exclude.toml" > "$RUNNER_TEMP/neg-exclude.txt"; then exit 1; fi
                grep "excluded, not in boundary_gaps (test: counterexample): lmcache/logging.py" \
                  "$RUNNER_TEMP/neg-exclude.txt"

            - name: The full wheel must fail the audit
              run: |
                NO_GPU_EXT=1 python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/full"
                if python tools/client_wheel/audit.py "$RUNNER_TEMP"/full/*.whl \
                    --staging "$RUNNER_TEMP/client-strict/STAGING_MANIFEST.json" > "$RUNNER_TEMP/full.txt"; then exit 1; fi
                grep "server file: lmcache/v1/multiprocess/server.py" "$RUNNER_TEMP/full.txt"

            - name: Install the transitional wheel in a clean venv
              run: |
                python -m venv "$RUNNER_TEMP/venv-client"
                "$RUNNER_TEMP/venv-client/bin/pip" install --index-url https://download.pytorch.org/whl/cpu \
                  "$(grep -oE 'torch==[0-9][0-9.]*' pyproject.toml | head -1)"
                "$RUNNER_TEMP/venv-client/bin/pip" install "$RUNNER_TEMP"/client-transitional/*.whl

            - name: Import every client module in its own process
              # A stale runtime_gaps entry is fatal only on PRs that edit
              # tools/client_wheel/, like the ratchet.
              env:
                BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                (cd "$RUNNER_TEMP" && venv-client/bin/python -I -B \
                  "$GITHUB_WORKSPACE/.github/scripts/assert_native_ops.py" lmcache.lmcache_native)
                status=0
                python tools/client_wheel/check_imports.py --wheel "$RUNNER_TEMP"/client-transitional/*.whl \
                  --runtime "$RUNNER_TEMP/venv-client/bin/python" | tee "$RUNNER_TEMP/runtime.txt" || status=$?
                [ "$status" = 3 ] || exit "$status"
                [ -z "$BASE_SHA" ] || git diff --quiet "$BASE_SHA" HEAD -- tools/client_wheel/
                echo "::warning::update runtime_gaps in tools/client_wheel/manifest.toml"

            - name: Build the lmcache-cli wheel
              run: |
                mkdir "$RUNNER_TEMP/cli-src"
                git archive HEAD | tar -x -C "$RUNNER_TEMP/cli-src"
                cd "$RUNNER_TEMP/cli-src" && cp pyproject_cli.toml pyproject.toml
                SETUPTOOLS_SCM_PRETEND_VERSION="$CLIENT_VERSION" NO_NATIVE_EXT=1 \
                  python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/cli"

            - name: Replace and uninstall each lmcache distribution
              run: |
                python -m venv "$RUNNER_TEMP/venv-matrix"
                python tools/client_wheel/check_install.py matrix "$RUNNER_TEMP/venv-matrix/bin/python" \
                  "$RUNNER_TEMP"/client-strict/*.whl "$RUNNER_TEMP"/full/*.whl "$RUNNER_TEMP"/cli/*.whl

    client-vllm-cpu:
        if: github.event.pull_request.draft != true
        name: Import lmcache-client with vLLM (CPU)
        # vllm-cpu-nightly ships cp312 wheels only, so this job builds its own client wheel.
        runs-on: ubuntu-22.04
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Prepare artifact build
              uses: ./.github/actions/build-artifacts
              with:
                python_version: "3.12"
                pip_packages: build
                requirements_file: requirements/build.txt
                release_tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

            - name: Install the CPU build of the pinned torch
              run: |
                pip install --index-url https://download.pytorch.org/whl/cpu \
                  "$(grep -oE 'torch==[0-9][0-9.]*' pyproject.toml | head -1)"

            - name: Build (transitional boundary)
              run: |
                NO_GPU_EXT=1 python tools/client_wheel/build.py --no-isolation --boundary transitional \
                  --version "$(python -m setuptools_scm | tail -1)" --out "$RUNNER_TEMP/client"

            - name: Install the verified vLLM CPU nightly, then the client wheel
              env:
                # The version cpu_device.yml last verified on this runner image.
                LMCACHE_VLLM_PIN_URL: https://raw.githubusercontent.com/LMCache/LMCache/github_nightly_tested_vllm/latest_tested_vllm_ubuntu-22.04.txt
              run: |
                source .buildkite/k3_harness/resolve-pinned-vllm.sh
                export VLLM_CPU_NIGHTLY_SPEC="vllm-cpu-nightly${PINNED_VLLM_VERSION:+==$PINNED_VLLM_VERSION}"
                python -m venv "$RUNNER_TEMP/venv-vllm"
                source "$RUNNER_TEMP/venv-vllm/bin/activate"
                bash .github/scripts/install_vllm_cpu.sh
                pip install "$RUNNER_TEMP"/client/*.whl

            - name: Import the vLLM integration and vLLM's LMCacheMPConnector
              # vLLM falls back to its own adapter and connector when these imports fail.
              run: |
                python tools/client_wheel/check_imports.py --wheel "$RUNNER_TEMP"/client/*.whl \
                  --runtime "$RUNNER_TEMP/venv-vllm/bin/python" --only lmcache.integration.vllm
                cd "$RUNNER_TEMP"
                venv-vllm/bin/python -I -B "$GITHUB_WORKSPACE/.github/scripts/assert_native_ops.py" lmcache.lmcache_native
                venv-vllm/bin/python -I -B -c '
                import sys
                from vllm.distributed.kv_transfer.kv_connector.v1.lmcache_mp_connector import LMCacheMPConnector
                assert LMCacheMPConnector.__module__ == "lmcache.integration.vllm.lmcache_mp_connector", LMCacheMPConnector
                assert "lmcache.integration.vllm.vllm_multi_process_adapter" in sys.modules'
