name: Build Main Artifacts

# Reusable workflow that builds the main release artifacts:
# - source distribution (tar ball)
# - CUDA wheel (built via cibuildwheel, latest torch)
# Uploaded as the `release-artifacts` GHA artifact.

on:
    workflow_call:

env:
    LC_ALL: en_US.UTF-8

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    build-artifacts:
        name: Build artifacts
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Prepare artifact build
              uses: ./.github/actions/build-artifacts
              with:
                free_disk_space: "true"
                python_version: "3.13"
                pip_packages: build cibuildwheel

            - name: Pin release version from tag (setuptools-scm)
              if: startsWith(github.ref, 'refs/tags/v')
              run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - name: Clean up release artifacts
              run: |
                rm -rf dist/

            - name: Build source distribution (no native extensions)
              run: |
                NO_NATIVE_EXT=1 python -m build --sdist

            - name: Build CUDA wheels with cibuildwheel
              # Configuration is set in pyproject.toml. The torch pin there
              # tracks the latest *stable* vLLM release, because that is the
              # torch the published wheel is installed next to; building from
              # source is required for any other torch.
              env:
                CIBW_TEST_COMMAND: "python {project}/.github/scripts/assert_native_ops.py"
              run: |
                python -m cibuildwheel --output-dir dist

            - name: Upload release artifacts to GHA
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                name: release-artifacts
                path: dist/
