name: Auto Translate Documentation

on:
  push:
    branches:
      - 'dev'
    paths:
      - 'docs/source/**/*.rst'
      - 'docs/source/**/*.md'
      - '!docs/source/locale/**'
      - 'docs/TRANSLATION_GLOSSARY_zh.md'
  
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-translate all content'
        required: false
        type: boolean
        default: false
      target_lang:
        description: 'Target language'
        required: false
        type: string
        default: 'zh_CN'

jobs:
  auto-translate:
    name: Auto translate documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/docs.txt
          pip install openai anthropic polib
      
      - name: Update translation templates
        run: |
          cd docs
          make gettext
          sphinx-intl update -p build/gettext -l ${{ github.event.inputs.target_lang || 'zh_CN' }}
      
      - name: Auto translate with AI
        env:
          # Choose one API according to your needs
          ANYROUTER_API_KEY: ${{ secrets.ANYROUTER_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          
          python docs/tools/auto_translate.py \
            --api openai \
            --target-lang ${{ github.event.inputs.target_lang || 'zh_CN' }} \
            --error-threshold 0.3 \
            $FORCE_FLAG
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/source/locale/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-translate documentation to ${{ github.event.inputs.target_lang || 'zh_CN' }}"
          title: "🤖 Auto translate documentation to ${{ github.event.inputs.target_lang || 'zh_CN' }} - $(date +'%Y-%m-%d')"
          body: |
            ## Auto translation update
            
            This PR is automatically generated by GitHub Actions, containing the following updates:
            
            - 🔄 Updated translation files (.po)
            - 🤖 Used AI translation API to automatically translate new/modified content
            - 📝 Maintained consistency of the glossary
            
            ### Checklist
            
            - [ ] Check translation quality
            - [ ] Verify the accuracy of technical terms
            - [ ] Confirm that the format markers are complete
            - [ ] Local build test: `cd docs && make html-${{ github.event.inputs.target_lang || 'zh_CN' }}`
            
            ### Related files
            
            Updated translation files are located in: `docs/source/locale/{{ github.event.inputs.target_lang || 'zh_CN' }}/LC_MESSAGES/`
            
            ---
            
            *This PR is automatically created by the [auto_translate.yml](.github/workflows/auto_translate.yml) workflow*
          branch: auto-translate-${{ github.event.inputs.target_lang || 'zh_CN' }}-${{ github.run_number }}
          delete-branch: true
          labels: |
            documentation
            translation
            automated
      
      - name: Summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "✅ Translation completed, Pull Request created"
          echo "📊 Translation statistics:"
          cd docs
          make i18n-stat || true

