name: Aggregate verified CPU runtime (2026-11-19 recovery)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: github.repository == 'LMCache/LMCache'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Require seven successful immutable model validations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/LMCache/LMCache/actions/runs/44451525443 > run.json
          gh api 'repos/LMCache/LMCache/actions/runs/44451525443/jobs?per_page=100' > jobs.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("run.json").read_text())
          assert run["head_sha"] == "b3692189937f706bc9d193be6b0c4412a6e8737e"
          jobs = json.loads(Path("jobs.json").read_text())["jobs"]
          legs = [j for j in jobs if j["name"].startswith("CPU device tests / CPU device (")]
          assert len(legs) == 7 and all(j["conclusion"] == "success" for j in legs)
          PY
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: 4f7d30f7f8193c94f02f65bfa937570e83697f12
          fetch-depth: 1
      - name: Download the seven immutable verification records
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: 44451525443
          pattern: verify-result-*
          path: verify-results
      - name: Verify complete coverage, published version and fresh provenance
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          files = list(Path("verify-results").glob("*/verify_result.json"))
          assert len(files) == 7
          results = [json.loads(p.read_text()) for p in files]
          expected = {("ubuntu-22.04", "opt-125m", t) for t in ("zmq", "grpc", "grpc-aio", "grpc-native")}
          expected |= {("ubuntu-22.04", "deepseek-v2-lite", "zmq"), ("macos-latest", "opt-125m", "zmq"), ("macos-latest", "deepseek-v2-lite", "zmq")}
          assert {(r["os"], r["model"], r["request_transport"]) for r in results} == expected
          now = datetime.datetime.now(datetime.timezone.utc)
          for result in results:
              assert result["status"] == "ok"
              assert result["vllm_version"] == "0.34.1.dev202611190133"
              assert result["source_sha"] == "8700cc9ba0016bf14d8f2756f3b673e93fbcf2fd"
              assert result["run_id"] == "44451525443"
              built = datetime.datetime.fromisoformat(result["built_at"])
              assert datetime.timedelta(0) <= now - built < datetime.timedelta(hours=48)
              print(result["os"], result["model"], result["request_transport"], result["source_sha"], result["built_at"])
          PY
      - name: Dry-run the trusted aggregation and pin writer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIN_SCRIPT: ${{ github.workspace }}/.github/scripts/pin-tested-vllm.sh
          EXPECTED_OSS: ubuntu-22.04 macos-latest
          DRY_RUN: "1"
          COMMIT_SHA: 4f7d30f7f8193c94f02f65bfa937570e83697f12
          BUILD_NUMBER: "44451525443"
          BUILD_URL: https://github.com/LMCache/LMCache/actions/runs/44451525443
        run: bash .github/scripts/nightly-aggregate-vllm-verify.sh
