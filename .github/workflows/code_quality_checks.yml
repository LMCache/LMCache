name: Code Quality

on:
  workflow_call:
  pull_request:

# Cancel older in-flight runs on the same PR / branch.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Check code quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout changes
        if: github.event_name == 'push'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 2

      - name: Detect changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lmcache:
              - '**'
              - '!operator/**'
              - '!.github/workflows/operator_*.yml'

      - name: Checkout code
        if: github.event_name == 'release' || steps.filter.outputs.lmcache == 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # for setuptools-scm
          fetch-depth: 0

      - name: Setup Python 3.12 and 3.13
        if: github.event_name == 'release' || steps.filter.outputs.lmcache == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.12
            3.13

      - name: Add mypy matcher
        if: github.event_name == 'release' || steps.filter.outputs.lmcache == 'true'
        run: echo "::add-matcher::.github/workflows/matchers/mypy.json"

      - name: Run code quality checks - lint, format, spell, & static checks
        if: github.event_name == 'release' || steps.filter.outputs.lmcache == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

