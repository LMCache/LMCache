name: Build and Publish to PyPI

on:
    # Trigger the workflow on push to the dev and any release branches,
    # and on release tag pushes / GitHub release publication.
    # Per-PR verification lives in test.yml, code_quality_checks.yml, and
    # pr_full_build.yml — this workflow is the release pipeline.
    push:
        branches:
            - dev
            - "release-**"
        tags:
            - "v*"
    release:
        types:
            - published

env:
    LC_ALL: en_US.UTF-8

# Cancel superseded runs on the same ref, but never abort a tag/release publish.
concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'release' }}

defaults:
    run:
        shell: bash

permissions:
    contents: read
    pull-requests: read

jobs:
    changes:
        name: Detect changes
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            # Skip the whole pipeline for operator releases (tags like `operator-v*`).
            # operator_release.yml handles those; this workflow is lmcache-only.
            lmcache: ${{ !startsWith(github.ref_name, 'operator-') && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.lmcache == 'true') }}
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
              with:
                fetch-depth: 2

            - uses: dorny/paths-filter@v3
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
              id: filter
              with:
                filters: |
                    lmcache:
                        - '**.py'
                        - 'pyproject.toml'
                        - 'pyproject_cli.toml'
                        - 'requirements/**.txt'
                        - 'docker/**'
                        - '.github/workflows/test.yml'
                        - '.github/workflows/code_quality_checks.yml'
                        - '.github/workflows/publish.yml'
                        - '.github/workflows/build_main_artifacts.yml'
                        - '.github/workflows/build_main_artifacts_arm64.yml'
                        - '.github/workflows/build_cli_artifacts.yml'
                        - '.github/workflows/build_cu129_artifacts.yml'
                        - '.github/workflows/build_rocm_artifacts.yml'
                        - '.github/workflows/build_xpu_artifacts.yml'
                        - '.github/workflows/build_musa_artifacts.yml'
                        - '.github/workflows/build_rocm_torch210_artifacts.yml'
                        - '.github/scripts/build_rocm_wheel.sh'
                        - '.github/scripts/rocm_wheel_common.sh'
                        - '.github/scripts/build_xpu_wheel.sh'
                        - '.github/scripts/build_musa_wheel.sh'
                        - '.github/scripts/build_rocm_torch210_wheel.sh'
                        - '.github/scripts/validate_rocm_torch210_wheel.py'
                        - '!operator/**'

    # Build each artifact group in its own reusable workflow so that a
    # failure in one (e.g. cu129) does not block publishing of the others.

    build-main:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build main
        uses: ./.github/workflows/build_main_artifacts.yml

    build-main-arm64:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build main (arm64)
        uses: ./.github/workflows/build_main_artifacts_arm64.yml

    build-cli:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build CLI
        uses: ./.github/workflows/build_cli_artifacts.yml

    build-cu129:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build cu129
        uses: ./.github/workflows/build_cu129_artifacts.yml
        # DockerHub creds needed for the cu12.9 manylinux image pull;
        # reusable workflows do not auto-inherit secrets.
        secrets: inherit

    build-rocm:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build ROCm
        uses: ./.github/workflows/build_rocm_artifacts.yml
        # DockerHub creds avoid anonymous rate limits pulling the ROCm
        # dev image; reusable workflows do not auto-inherit secrets.
        secrets: inherit

    resolve-xpu-release-runtime:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Resolve XPU release runtime
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.runtime.outputs.image }}
        steps:
            - name: Resolve immutable XPU runtime image
              id: runtime
              run: |
                  set -Eeuo pipefail
                  IMAGE="vllm/vllm-openai-xpu"
                  TAG="v0.26.0"
                  DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
                  [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
                  echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

    build-xpu:
        needs: [changes, resolve-xpu-release-runtime]
        if: needs.changes.outputs.lmcache == 'true'
        name: Build XPU
        uses: ./.github/workflows/build_xpu_artifacts.yml
        with:
            xpu_image: ${{ needs.resolve-xpu-release-runtime.outputs.image }}
        # DockerHub creds avoid anonymous rate limits pulling the oneAPI image;
        # reusable workflows do not auto-inherit secrets.
        secrets: inherit

    build-musa:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build MUSA
        uses: ./.github/workflows/build_musa_artifacts.yml

    build-rocm-torch210:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Build ROCm torch 2.10
        uses: ./.github/workflows/build_rocm_torch210_artifacts.yml
        # DockerHub credentials avoid rate limits when pulling the pinned
        # torch 2.10 builder image; forks can still pull it anonymously.
        secrets: inherit

    # Run tests and code quality checks before publishing
    test:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Run tests
        uses: ./.github/workflows/test.yml

    code-quality:
        needs: changes
        if: needs.changes.outputs.lmcache == 'true'
        name: Run code quality checks
        uses: ./.github/workflows/code_quality_checks.yml

    # Push to Test PyPI when:
    # - a new GitHub release is published
    # - a commit lands on dev (PR merged)
    publish-test-pypi:
        name: Publish packages to test.pypi.org
        # Require upstream jobs to have succeeded so a cancelled/skipped build
        # doesn't trigger a publish that fails on the missing artifact.
        if: |
            needs.build-main.result == 'success' &&
            needs.build-main-arm64.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' &&
            github.event_name == 'push' && github.ref == 'refs/heads/dev'
        permissions:
            contents: read
            # see https://docs.pypi.org/trusted-publishers/
            id-token: write
        runs-on: ubuntu-latest
        needs: [changes, build-main, build-main-arm64, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Fetch release artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release-artifacts
                  path: dist

            - name: Fetch arm64 release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: release-artifacts-arm64
                  path: dist

            - name: Upload to Test PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                  repository-url: https://test.pypi.org/legacy/
                  verbose: true

    publish-cli-test-pypi:
        name: Publish lmcache-cli packages to test.pypi.org
        if: |
            needs.build-cli.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' &&
            github.event_name == 'push' && github.ref == 'refs/heads/dev'
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [changes, build-cli, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Fetch CLI release artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release-cli-artifacts
                  path: dist

            - name: Upload lmcache-cli to Test PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                  repository-url: https://test.pypi.org/legacy/
                  verbose: true

    # Push to PyPI (production) when:
    # - a new GitHub release is created
    publish-pypi:
        name: Publish release to pypi.org
        if: |
            needs.build-main.result == 'success' &&
            needs.build-main-arm64.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            # see https://docs.pypi.org/trusted-publishers/
            id-token: write
            # allow gh release upload
            contents: write

        runs-on: ubuntu-latest
        needs: [changes, build-main, build-main-arm64, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch release artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release-artifacts
                  path: dist

            - name: Fetch arm64 release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: release-artifacts-arm64
                  path: dist

            - name: Upload release artifacts to GitHub release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: >-
                  gh release upload '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}'

            - name: Upload to PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                verbose: true

    publish-cli-pypi:
        name: Publish lmcache-cli release to pypi.org
        if: |
            needs.build-cli.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            id-token: write
            contents: write
        runs-on: ubuntu-latest
        needs: [changes, build-cli, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch CLI release artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release-cli-artifacts
                  path: dist

            - name: Upload lmcache-cli release artifacts to GitHub release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: >-
                  gh release upload '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}'

            - name: Upload lmcache-cli to PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                verbose: true

    # Publish cu12.9 wheels to GitHub Release (not PyPI) when a release is published
    publish-cu129-github-release:
        name: Publish cu129 wheels to GitHub Release
        if: |
            needs.build-cu129.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        needs: [changes, build-cu129, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch cu12.9 release artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: release-cu129-artifacts-*
                  merge-multiple: true
                  path: dist

            - name: Publish cu12.9 wheels to dedicated GitHub Release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}-cu129" \
                    --repo "${{ github.repository }}" \
                    --target "$GITHUB_SHA" \
                    --latest=false \
                    --title "Release ${{ github.ref_name }} · CUDA 12.9" \
                    --notes "CUDA 12.9 wheels for LMCache ${{ github.ref_name }} on linux/amd64 and linux/arm64.

                  \`\`\`
                  VERSION=${{ github.ref_name }}
                  uv pip install lmcache==${VERSION#v} \\
                    --extra-index-url https://download.pytorch.org/whl/cu129 \\
                    --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/${VERSION}-cu129 \\
                    --index-strategy unsafe-best-match
                  \`\`\`" \
                    dist/*.whl

    # Publish ROCm wheel to GitHub Release (not PyPI) when a release is published.
    # gfx942 (MI300X/MI325X) + gfx950 (MI350X/MI355X), ABI-matched to the
    # upstream vllm/vllm-openai-rocm image. Mirrors the cu129 flow.
    publish-rocm-github-release:
        name: Publish ROCm wheel to GitHub Release
        if: |
            needs.build-rocm.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        needs: [changes, build-rocm, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch ROCm release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: release-rocm-artifacts
                  path: dist

            - name: Publish ROCm wheel to dedicated GitHub Release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}-rocm" \
                    --repo "${{ github.repository }}" \
                    --target "$GITHUB_SHA" \
                    --latest=false \
                    --title "Release ${{ github.ref_name }} · ROCm (gfx942, gfx950)" \
                    --notes "ROCm 7.2 wheel for LMCache ${{ github.ref_name }}, built for AMD
                  Instinct gfx942 (MI300X/MI325X) and gfx950 (MI350X/MI355X). ABI-matched
                  to the upstream \`vllm/vllm-openai-rocm\` image (torch 2.11, cp312).

                  Install into an upstream vLLM ROCm container:
                  \`\`\`
                  VERSION=${{ github.ref_name }}
                  pip install lmcache==${{ needs.build-rocm.outputs.rocm_version }} --no-deps \\
                    --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/\${VERSION}-rocm
                  \`\`\`" \
                    dist/*.whl

    # Publish XPU wheel to GitHub Release (not PyPI) when a release is published.
    # Built with oneAPI + torch xpu pins; runtime binds to host oneAPI/SYCL libs.
    publish-xpu-github-release:
        name: Publish XPU wheel to GitHub Release
        if: |
            needs.build-xpu.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        needs: [changes, build-xpu, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch XPU release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: release-xpu-artifacts
                  path: dist

            - name: Publish XPU wheel to dedicated GitHub Release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}-xpu" \
                    --repo "${{ github.repository }}" \
                    --target "$GITHUB_SHA" \
                    --latest=false \
                    --title "Release ${{ github.ref_name }} · Intel XPU (SYCL)" \
                    --notes "Intel XPU/SYCL wheel for LMCache ${{ github.ref_name }}.

                  Built against pinned torch-xpu + oneAPI toolchain; runtime binds to host oneAPI/SYCL libraries.

                  Install into an upstream Intel vLLM XPU container:
                  \`\`\`
                  VERSION=${{ github.ref_name }}
                  pip install lmcache==${{ needs.build-xpu.outputs.xpu_version }} --no-deps \\
                    --no-index \\
                    --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/\${VERSION}-xpu
                  \`\`\`" \
                    dist/*.whl

    # Publish the MUSA-compatible wheel to GitHub Release (not PyPI) when a
    # release is published. TorchMUSA and the MUSA SDK remain host-owned.
    publish-musa-github-release:
        name: Publish MUSA wheel to GitHub Release
        if: |
            needs.build-musa.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        needs: [changes, build-musa, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch MUSA release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: release-musa-artifacts
                  path: dist

            - name: Publish MUSA wheel to dedicated GitHub Release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}-musa" \
                    --repo "${{ github.repository }}" \
                    --target "$GITHUB_SHA" \
                    --latest=false \
                    --title "Release ${{ github.ref_name }} · Moore Threads MUSA" \
                    --notes "MUSA-compatible wheel for LMCache ${{ github.ref_name }}.

                  Built and smoke-tested in the validated TorchMUSA/MUSA SDK image. TorchMUSA, musa_aiter, and the MUSA userspace runtime stay in the host image and are not installed from PyPI.

                  Install inside the matching MUSA runtime image:
                  \`\`\`bash
                  VERSION=${{ github.ref_name }}
                  pip install lmcache==${{ needs.build-musa.outputs.musa_version }} --no-deps \\
                    --no-index \\
                    --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/\${VERSION}-musa
                  \`\`\`" \
                    dist/*.whl

    # Publish the general ROCm wheel built against the torch 2.10 ABI.
    publish-rocm-torch210-github-release:
        name: Publish ROCm torch 2.10 wheel to GitHub Release
        if: |
            needs.build-rocm-torch210.result == 'success' &&
            needs.test.result == 'success' &&
            needs.code-quality.result == 'success' &&
            needs.changes.outputs.lmcache == 'true' &&
            github.repository_owner == 'LMCache' && github.event.action == 'published'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        needs: [changes, build-rocm-torch210, test, code-quality]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                  disable-sudo-and-containers: false
                  egress-policy: audit

            - name: Fetch ROCm torch 2.10 release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: release-rocm-torch210-artifacts
                  path: dist

            - name: Publish ROCm torch 2.10 wheel to dedicated GitHub Release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}-rocm-torch210" \
                    --repo "${{ github.repository }}" \
                    --target "$GITHUB_SHA" \
                    --latest=false \
                    --title "Release ${{ github.ref_name }} · AMD ROCm 7.2.4 / torch 2.10.0 git3d3aa833 / cp312 / CXX11 ABI=1" \
                    --notes "ROCm wheel for LMCache ${{ github.ref_name }}, built and tested in
                  \`rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0\`
                  at digest \`sha256:4449f856653602317e4101a76fce599c7fcd58ccec2e539951fce5f73083179e\`.

                  Supported ABI (exact):
                  - AMD torch wheel source: https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.4/torch-2.10.0%2Brocm7.2.4.lw.git3d3aa833-cp312-cp312-linux_x86_64.whl
                  - torch runtime: \`2.10.0+rocm7.2.4.git3d3aa833\` (git \`3d3aa833db84eed6b7f5595cb5f162c2f78300a4\`)
                  - ROCm: \`7.2.4\` (HIP runtime \`7.2.53211\`)
                  - Python/platform: \`cp312-cp312-manylinux_2_39_x86_64\`
                  - C++ ABI: \`_GLIBCXX_USE_CXX11_ABI=1\`

                  It includes gfx942/gfx950 GPU code objects and all integrations shipped
                  by the corresponding LMCache release.

                  Install into the pinned AMD PyTorch container:
                  \`\`\`bash
                  VERSION=${{ github.ref_name }}
                  pip install lmcache==${{ needs.build-rocm-torch210.outputs.rocm_torch210_version }} --no-deps \\
                    --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/\${VERSION}-rocm-torch210
                  \`\`\`
                  " \
                    dist/*.whl

    # Build container image and push to DockerHub when:
    # - a new stable GitHub release is created (non-RC)
    publish-image:
        name: Build image (${{ matrix.arch }})
        if: |
            needs.publish-pypi.result == 'success' &&
            !cancelled() &&
            github.repository_owner == 'LMCache' && github.event.action == 'published' &&
            !contains(github.ref_name, 'rc')

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    # Build CUDA images natively; QEMU is too slow and fragile
                    # for the package installation and extension build stages.
                    - arch: arm64
                      runner: ubuntu-24.04-arm

        runs-on: ${{ matrix.runner }}
        needs: [publish-pypi, publish-cu129-github-release]

        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Login to DockerHub
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                # for setuptools-scm
                fetch-depth: 0

            - name: Free disk space
              uses: ./.github/actions/free-disk-space

            - name: Resolve the release tag that triggered this run
              run: |
                echo "LATEST_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"

            - name: Build lmcache/vllm-openai container image (cu13)
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:25.09-cuda13.0-devel-ubuntu24.04 \
                  --build-arg CUDA_VERSION=13.0 \
                  --build-arg LMCACHE_VERSION=${{ env.LATEST_TAG }} \
                  --build-arg torch_cuda_arch_list='7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX' \
                  --target image-release \
                  --tag lmcache/vllm-openai:${{ env.LATEST_TAG }}-${{ matrix.arch }} \
                  --file docker/Dockerfile .

            # `lmcache --help` exercises eager CLI subcommand discovery,
            # so a missing runtime dep fails the build before the image ships.
            - name: Smoke test lmcache/vllm-openai (cu13)
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/vllm-openai:${{ env.LATEST_TAG }}-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm --entrypoint lmcache lmcache/vllm-openai:${{ env.LATEST_TAG }}-${{ matrix.arch }} --help

            - name: Push lmcache/vllm-openai container image to DockerHub
              run: |
                docker push lmcache/vllm-openai:${{ env.LATEST_TAG }}-${{ matrix.arch }}

            # Payload (docker/Dockerfile.payload) extracts lmcache from the cu13
            # image just pushed above — still local, and dropped by the prune
            # below, so build here.
            - name: Build lmcache/lmcache-payload image
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg SOURCE_IMAGE=lmcache/vllm-openai:${{ env.LATEST_TAG }}-${{ matrix.arch }} \
                  --tag lmcache/lmcache-payload:${{ env.LATEST_TAG }}-${{ matrix.arch }} \
                  --file docker/Dockerfile.payload .

            # Run the ENTRYPOINT copy; assert the lmcache tree lands.
            - name: Smoke test lmcache/lmcache-payload
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/lmcache-payload:${{ env.LATEST_TAG }}-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm -e SHARED_DIR=/out -v "$PWD/payload-out:/out" lmcache/lmcache-payload:${{ env.LATEST_TAG }}-${{ matrix.arch }}
                test -f payload-out/lmcache/__init__.py

            - name: Push lmcache/lmcache-payload image to DockerHub
              run: |
                docker push lmcache/lmcache-payload:${{ env.LATEST_TAG }}-${{ matrix.arch }}

            - name: Clean up Docker layers and cache
              run: |
                docker system prune -f --all
                docker builder prune -af

            - name: Build lmcache/vllm-openai:lightweight
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --tag lmcache/vllm-openai:${{ env.LATEST_TAG }}-lightweight-${{ matrix.arch }} \
                  --file docker/Dockerfile.lightweight .

            - name: Smoke test lmcache/vllm-openai:lightweight
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/vllm-openai:${{ env.LATEST_TAG }}-lightweight-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm --entrypoint lmcache lmcache/vllm-openai:${{ env.LATEST_TAG }}-lightweight-${{ matrix.arch }} --help

            - name: Push lmcache/vllm-openai:lightweight image to DockerHub
              run: |
                docker push lmcache/vllm-openai:${{ env.LATEST_TAG }}-lightweight-${{ matrix.arch }}

            - name: Clean up Docker layers and cache
              run: |
                docker system prune -f --all
                docker builder prune -af

            - name: Build lmcache/standalone container image (cu13)
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:25.09-cuda13.0-devel-ubuntu24.04 \
                  --build-arg CUDA_VERSION=13.0 \
                  --build-arg torch_cuda_arch_list='7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX' \
                  --target lmcache-final \
                  --tag lmcache/standalone:${{ env.LATEST_TAG }}-${{ matrix.arch }} \
                  --file docker/Dockerfile.standalone .

            - name: Smoke test lmcache/standalone (cu13)
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/standalone:${{ env.LATEST_TAG }}-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm --entrypoint lmcache lmcache/standalone:${{ env.LATEST_TAG }}-${{ matrix.arch }} --help

            - name: Push lmcache/standalone container image to DockerHub
              run: |
                docker push lmcache/standalone:${{ env.LATEST_TAG }}-${{ matrix.arch }}

            - name: Clean up Docker layers and cache
              run: |
                docker system prune -f --all
                docker builder prune -af

            - name: Build lmcache/vllm-openai container image (cu12.9)
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:25.05-cuda12.9-devel-ubuntu24.04 \
                  --build-arg CUDA_VERSION=12.9 \
                  --build-arg LMCACHE_VERSION=${{ env.LATEST_TAG }} \
                  --target image-release-cu129 \
                  --tag lmcache/vllm-openai:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }} \
                  --file docker/Dockerfile .

            - name: Smoke test lmcache/vllm-openai (cu12.9)
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/vllm-openai:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm --entrypoint lmcache lmcache/vllm-openai:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }} --help

            - name: Push lmcache/vllm-openai cu129 container image to DockerHub
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                docker push lmcache/vllm-openai:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }}

            # Payload extracts lmcache from the cu129 image just pushed above —
            # still local, and dropped by the prune below, so build here.
            - name: Build lmcache/lmcache-payload image (cu129)
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg SOURCE_IMAGE=lmcache/vllm-openai:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }} \
                  --tag lmcache/lmcache-payload:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }} \
                  --file docker/Dockerfile.payload .

            # Run the ENTRYPOINT copy; assert the lmcache tree lands.
            - name: Smoke test lmcache/lmcache-payload (cu129)
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/lmcache-payload:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm -e SHARED_DIR=/out -v "$PWD/payload-out-cu129:/out" lmcache/lmcache-payload:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }}
                test -f payload-out-cu129/lmcache/__init__.py

            - name: Push lmcache/lmcache-payload cu129 image to DockerHub
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                docker push lmcache/lmcache-payload:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }}

            - name: Clean up Docker layers and cache
              run: |
                docker system prune -f --all
                docker builder prune -af

            - name: Build lmcache/standalone container image (cu12.9)
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:25.05-cuda12.9-devel-ubuntu24.04 \
                  --build-arg CUDA_VERSION=12.9 \
                  --target lmcache-final \
                  --tag lmcache/standalone:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }} \
                  --file docker/Dockerfile.standalone .

            - name: Smoke test lmcache/standalone (cu12.9)
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/standalone:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm --entrypoint lmcache lmcache/standalone:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }} --help

            - name: Push lmcache/standalone cu129 container image to DockerHub
              if: needs.publish-cu129-github-release.result == 'success'
              run: |
                docker push lmcache/standalone:${{ env.LATEST_TAG }}-cu129-${{ matrix.arch }}

    publish-image-manifests:
        name: Publish multi-arch image manifests
        if: needs.publish-image.result == 'success'
        needs: [publish-image]
        runs-on: ubuntu-latest

        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Login to DockerHub
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Publish lmcache/vllm-openai manifest
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/vllm-openai:latest \
                  --tag "lmcache/vllm-openai:${LATEST_TAG}" \
                  "lmcache/vllm-openai:${LATEST_TAG}-amd64" \
                  "lmcache/vllm-openai:${LATEST_TAG}-arm64"
                docker buildx imagetools inspect "lmcache/vllm-openai:${LATEST_TAG}"

            - name: Publish lmcache/vllm-openai cu129 manifest
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/vllm-openai:latest-cu129 \
                  --tag "lmcache/vllm-openai:${LATEST_TAG}-cu129" \
                  "lmcache/vllm-openai:${LATEST_TAG}-cu129-amd64" \
                  "lmcache/vllm-openai:${LATEST_TAG}-cu129-arm64"
                docker buildx imagetools inspect "lmcache/vllm-openai:${LATEST_TAG}-cu129"

            - name: Publish lmcache/vllm-openai:lightweight manifest
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/vllm-openai:lightweight \
                  --tag "lmcache/vllm-openai:${LATEST_TAG}-lightweight" \
                  "lmcache/vllm-openai:${LATEST_TAG}-lightweight-amd64" \
                  "lmcache/vllm-openai:${LATEST_TAG}-lightweight-arm64"
                docker buildx imagetools inspect "lmcache/vllm-openai:${LATEST_TAG}-lightweight"

            - name: Publish lmcache/lmcache-payload manifest
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/lmcache-payload:latest \
                  --tag "lmcache/lmcache-payload:${LATEST_TAG}" \
                  "lmcache/lmcache-payload:${LATEST_TAG}-amd64" \
                  "lmcache/lmcache-payload:${LATEST_TAG}-arm64"
                docker buildx imagetools inspect "lmcache/lmcache-payload:${LATEST_TAG}"

            - name: Publish lmcache/lmcache-payload cu129 manifest
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/lmcache-payload:latest-cu129 \
                  --tag "lmcache/lmcache-payload:${LATEST_TAG}-cu129" \
                  "lmcache/lmcache-payload:${LATEST_TAG}-cu129-amd64" \
                  "lmcache/lmcache-payload:${LATEST_TAG}-cu129-arm64"
                docker buildx imagetools inspect "lmcache/lmcache-payload:${LATEST_TAG}-cu129"

            - name: Publish lmcache/standalone manifests
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/standalone:latest \
                  --tag "lmcache/standalone:${LATEST_TAG}" \
                  --tag lmcache/standalone:latest-cu130 \
                  --tag "lmcache/standalone:${LATEST_TAG}-cu130" \
                  "lmcache/standalone:${LATEST_TAG}-amd64" \
                  "lmcache/standalone:${LATEST_TAG}-arm64"
                docker buildx imagetools inspect "lmcache/standalone:${LATEST_TAG}"

            - name: Publish lmcache/standalone cu129 manifest
              env:
                LATEST_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag lmcache/standalone:latest-cu129 \
                  --tag "lmcache/standalone:${LATEST_TAG}-cu129" \
                  "lmcache/standalone:${LATEST_TAG}-cu129-amd64" \
                  "lmcache/standalone:${LATEST_TAG}-cu129-arm64"
                docker buildx imagetools inspect "lmcache/standalone:${LATEST_TAG}-cu129"

    # Build RC container image and push to DockerHub when:
    # - a new RC GitHub release is created (e.g. v0.4.8rc1)
    # Only pushes lmcache/vllm-openai:<tag> — does not touch latest or other image variants.
    publish-image-rc:
        name: Build RC image (${{ matrix.arch }})
        if: |
            needs.publish-pypi.result == 'success' &&
            !cancelled() &&
            github.repository_owner == 'LMCache' && github.event.action == 'published' &&
            contains(github.ref_name, 'rc')

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    # Keep RC validation identical to stable releases.
                    - arch: arm64
                      runner: ubuntu-24.04-arm

        runs-on: ${{ matrix.runner }}
        needs: [publish-pypi]

        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Login to DockerHub
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Free disk space
              uses: ./.github/actions/free-disk-space

            - name: Get the release tag
              run: |
                REF="${{ github.ref_name }}"
                [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]] && echo "LATEST_RC_TAG=$REF" >> "$GITHUB_ENV"

            - name: Build lmcache/vllm-openai container image (cu13)
              run: |
                docker buildx build --load \
                  --platform linux/${{ matrix.arch }} \
                  --build-arg BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:25.09-cuda13.0-devel-ubuntu24.04 \
                  --build-arg CUDA_VERSION=13.0 \
                  --build-arg LMCACHE_VERSION=${{ env.LATEST_RC_TAG }} \
                  --build-arg torch_cuda_arch_list='7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX' \
                  --target image-release \
                  --tag lmcache/vllm-openai:${{ env.LATEST_RC_TAG }}-${{ matrix.arch }} \
                  --file docker/Dockerfile .

            - name: Smoke test lmcache/vllm-openai (cu13)
              run: |
                test "$(docker image inspect --format '{{.Architecture}}' lmcache/vllm-openai:${{ env.LATEST_RC_TAG }}-${{ matrix.arch }})" = "${{ matrix.arch }}"
                docker run --rm --entrypoint lmcache lmcache/vllm-openai:${{ env.LATEST_RC_TAG }}-${{ matrix.arch }} --help

            - name: Push lmcache/vllm-openai RC image to DockerHub
              run: |
                docker push lmcache/vllm-openai:${{ env.LATEST_RC_TAG }}-${{ matrix.arch }}

    publish-image-rc-manifest:
        name: Publish multi-arch RC image manifest
        if: needs.publish-image-rc.result == 'success'
        needs: [publish-image-rc]
        runs-on: ubuntu-latest

        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Login to DockerHub
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Publish lmcache/vllm-openai RC manifest
              env:
                LATEST_RC_TAG: ${{ github.ref_name }}
              run: |
                docker buildx imagetools create \
                  --tag "lmcache/vllm-openai:${LATEST_RC_TAG}" \
                  "lmcache/vllm-openai:${LATEST_RC_TAG}-amd64" \
                  "lmcache/vllm-openai:${LATEST_RC_TAG}-arm64"
                docker buildx imagetools inspect "lmcache/vllm-openai:${LATEST_RC_TAG}"
