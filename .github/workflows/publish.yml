name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*"  # trigger on version tags (requires write access)
# example:
# git tag v1.0.0
# git push origin v1.0.0
# this will not apply the version to PyPI, this needs
# to be manually changed in setup.py

jobs:
  build-and-publish:
    name: Build with CUDA 12.4 and Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches setup.py version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          SETUP_VERSION=$(python setup.py --version)
          if [ "$TAG_VERSION" != "$SETUP_VERSION" ]; then
            echo "Git tag version ($TAG_VERSION) does not match setup.py version ($SETUP_VERSION)"
            exit 1
          fi

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel twine

      - name: Clean dist/
        run: |
          rm -rf dist/

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Build CUDA wheels with cibuildwheel
        env:
          # lmcache supports python 3.10 or higher right now
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp*"
          # see https://developer.nvidia.com/cuda-gpus for compute capabilities
          # "CUDA-Enabled Datacenter Products"
          # 7.0: V100
          # 7.5: T4
          # 8.0: A100, A30
          # 8.6: A40, A10, A16, A2
          # 8.9: L4, L40, L40S
          # 9.0: H100
          CIBW_ENVIRONMENT: "TORCH_CUDA_ARCH_LIST='7.0;7.5;8.0;8.6;8.9;9.0'"
        run: |
          python -m cibuildwheel --output-dir dist

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
