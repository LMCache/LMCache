name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*"  # trigger on version tags (requires write access)
# example:
# git tag v1.0.0
# git push origin v1.0.0

jobs:
  build-and-publish:
    name: Build with CUDA 12.4 and Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel twine

      - name: Clean dist/
        run: |
          rm -rf dist/

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Build CUDA wheels with cibuildwheel
        env:
          CIBW_SKIP: "pp* cp36* cp37*"  # Skip PyPy, older Python
        run: |
          python -m cibuildwheel --output-dir dist

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
