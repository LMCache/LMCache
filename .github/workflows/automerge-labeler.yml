name: Label auto-merge PRs

on:
  pull_request_target:
    types: [ auto_merge_enabled, auto_merge_disabled, synchronize, reopened ]

concurrency:
  group: automerge-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  add_remove_labels:
    if: github.event.action == 'auto_merge_disabled' || github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    steps:
      # Query PR files through the API; never check out PR code in this
      # pull_request_target workflow, which has a write token.
      - uses: dorny/paths-filter@v3
        if: github.event.action != 'auto_merge_disabled'
        id: changes
        with:
          filters: |
            non_test:
              - '!tests/**'

      # The unit-test workflows still cover tests-only changes. Re-evaluate
      # on synchronize so a later production change receives full coverage.
      # Leave an existing (possibly manual) full label alone.
      - name: Label auto-merge PRs with changes outside tests
        if: steps.changes.outputs.non_test == 'true' && !contains(github.event.pull_request.labels.*.name, 'full')
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ['full'],
            });

      - uses: ubuntudroid/automerge-labeler@v1
        if: github.event.action == 'auto_merge_disabled'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: 'full'
