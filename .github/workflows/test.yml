name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - "dev"
      - "release-**"

env:
  LC_ALL: en_US.UTF-8
  PYTHONHASHSEED: 0

defaults:
  run:
    shell: bash

# Cancel older in-flight runs on the same PR / branch.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      lmcache: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || steps.filter.outputs.lmcache == 'true' }}
      raw_block: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || steps.filter.outputs.raw_block == 'true' }}
      token_drop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.token_drop == 'true' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - '**.py'
              - 'pyproject.toml'
              - 'requirements/**.txt'
              - '.github/workflows/test.yml'
              - '!operator/**'
            raw_block:
              - 'rust/raw_block/**'
              - 'lmcache/v1/distributed/l2_adapters/raw_block/**'
              - 'lmcache/v1/distributed/l2_adapters/raw_block_l2_adapter.py'
              - 'lmcache/v1/multiprocess/**'
              - 'tests/v1/distributed/raw_block/test_*.py'
              - 'tests/v1/distributed/raw_block/test_utils.py'
              - 'tests/inprocess/v1/storage_backend/test_raw_block_uring_cmd.py'
              - 'tests/v1/multiprocess/test_raw_block_l2_adapter.py'
              - '.github/workflows/test.yml'
            token_drop:
              - 'lmcache/integration/vllm/experimental/token_drop_adapter.py'
              - 'lmcache/integration/vllm/experimental/token_drop_scheduler.py'
              - 'tests/v1/test_token_drop_allocator_adapter.py'
              - 'tests/v1/test_token_drop_prefix_caching_publication_guard.py'
              - '.github/workflows/test.yml'

  test:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: "test: ${{ matrix.python }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        platform:
          - "ubuntu-24.04"

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # https://github.com/actions/checkout/issues/249
          fetch-depth: 0

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
  
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install vllm
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: "CPU only unit tests"
        env:
          RUN_DEVDAX_L1_INTEGRATION: "1"
          RUN_DAX_L2_INTEGRATION: "1"
          LMCACHE_TEST_DEVDAX_L1_PATHS: ""
        run: |
          pytest -m "not (cuda or musa or xpu or npu or neuron or rbln)"

  token-drop-vllm-0251:
    needs: changes
    if: needs.changes.outputs.token_drop == 'true'
    name: "Token dropping: allocator + prefix-cache publication guard (vLLM 0.25.1)"
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install pinned vLLM and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "vllm==0.25.1" -r requirements/common.txt -r requirements/test.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation --no-deps

      - name: Verify pinned version and run allocator tests
        run: |
          python - <<'PY'
          import vllm

          assert vllm.__version__.split("+", 1)[0] == "0.25.1", vllm.__version__
          PY

          pytest -q -rs --junitxml=token-drop-tests.xml tests/v1/test_token_drop_allocator_adapter.py tests/v1/test_token_drop_prefix_caching_publication_guard.py

          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("token-drop-tests.xml").getroot().iter("testcase"))
          assert len(cases) >= 17, "Expected at least 17 token-dropping test cases"
          assert not any(c.find("skipped") is not None for c in cases), "Token-dropping test skipped"
          assert any(
              c.get("name") == "test_allocator_hook_installation_is_idempotent"
              for c in cases
          ), "vLLM installer test was not executed"
          assert any(
              c.get("name") == "test_token_dropping_blocks_are_not_published_but_normal_blocks_are"
              for c in cases
          ), "Prefix-cache publication test was not executed"
          print(f"{len(cases)} token-dropping tests passed, 0 skipped")
          PY

  rust-unit-tests:
    needs: changes
    if: needs.changes.outputs.raw_block == 'true'
    name: Rust unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/raw_block/Cargo.toml --no-default-features

  raw-block-tests:
    needs: changes
    if: needs.changes.outputs.raw_block == 'true'
    name: raw-block temp-file tests
    runs-on: ubuntu-24.04
    env:
      LMCACHE_LOG_LEVEL: CRITICAL

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: Build raw-block Rust extension
        run: |
          python -m maturin build --release --locked \
            --manifest-path rust/raw_block/Cargo.toml \
            --out .pytest-tmp/raw-block-dist
          python -m pip install .pytest-tmp/raw-block-dist/*.whl

      - name: Run raw-block tests
        run: |
          pytest -q --basetemp=.pytest-tmp/raw-block \
            tests/v1/distributed/raw_block/test_device.py \
            tests/v1/distributed/raw_block/test_core.py \
            tests/v1/multiprocess/test_raw_block_l2_adapter.py

  grpc-native-tests:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: gRPC native server tests
    runs-on: ubuntu-latest
    env:
      LMCACHE_LOG_LEVEL: CRITICAL

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      # pygrpc-native is optional, so the main test job skips these tests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          python -m pip install pygrpc-native==0.5.2
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: Run native, shared transport and liveness tests
        run: |
          pytest -q tests/v1/multiprocess/test_grpc_native_server.py \
            tests/v1/multiprocess/test_grpc_transport.py \
            tests/v1/multiprocess/test_worker_liveness.py
