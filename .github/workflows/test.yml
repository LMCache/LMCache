name: Test

on:
  workflow_call:
    inputs:
      python_versions:
        description: >-
          JSON array of Python versions for the CPU unit tests, e.g.
          '["3.12", "3.14"]'. Empty keeps the default: 3.12 on draft PRs,
          every supported version otherwise.
        type: string
        default: ""
      force_rust:
        description: >-
          Run the Rust raw-block jobs even when no raw-block path changed
          (the PR author ticked `rust` in the CI scope checklist).
        type: boolean
        default: false
  workflow_dispatch:
  # PR runs are started by code_quality_checks.yml: on drafts directly, and
  # after pre-commit once the PR is ready for review.

env:
  LC_ALL: en_US.UTF-8
  PYTHONHASHSEED: 0

defaults:
  run:
    shell: bash

# Cancel older in-flight runs on the same PR / branch.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      lmcache: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || steps.filter.outputs.lmcache == 'true' }}
      raw_block: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || inputs.force_rust == true || steps.filter.outputs.raw_block == 'true' }}
      hf3fs_native: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || steps.filter.outputs.hf3fs_native == 'true' }}
      token_drop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.token_drop == 'true' }}
      python_versions: ${{ steps.python.outputs.versions }}
    steps:
      # Draft PR pushes run one representative Python; ready-for-review PRs
      # pass the versions their author picked. Push, release and dispatch
      # runs cover every version. Inside a reusable workflow, github.event is
      # the caller's event.
      - name: Select Python versions
        id: python
        env:
          SELECTED: ${{ inputs.python_versions }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          if [[ -n "$SELECTED" ]]; then
            versions=$SELECTED
          elif [[ "$DRAFT" == "true" ]]; then
            versions='["3.12"]'
          else
            versions='["3.11", "3.12", "3.13", "3.14"]'
          fi
          echo "versions=$versions" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - '**.py'
              - '.github/deprecated-modules.toml'
              - 'pyproject.toml'
              - 'requirements/**.txt'
              - '.github/workflows/test.yml'
              - '.github/scripts/pr-ci-scope.sh'
              - '!operator/**'
            raw_block:
              - 'rust/raw_block/**'
              - 'lmcache/v1/distributed/l2_adapters/raw_block/**'
              - 'lmcache/v1/distributed/l2_adapters/raw_block_l2_adapter.py'
              - 'lmcache/v1/multiprocess/**'
              - 'tests/v1/distributed/raw_block/**'
              - 'tests/v1/distributed/test_raw_block_l2_adapter.py'
              - 'tests/v1/multiprocess/test_raw_block_l2_adapter.py'
              - '.github/workflows/test.yml'
            hf3fs_native:
              - 'csrc/storage_backends/*.h'
              - 'csrc/storage_backends/hf3fs/**'
              - 'tests/native/storage_backends/hf3fs/**'
              - 'setup_extensions/storage_backend_profiles/hf3fs.py'
              - '.github/workflows/test.yml'

            token_drop:
              - 'lmcache/integration/vllm/experimental/token_drop*.py'
              - 'lmcache/integration/vllm/lmcache_mp_connector.py'
              - 'lmcache/integration/vllm/lmcache_mp_metadata.py'
              - 'tests/v1/test_token_drop*.py'
              - '.github/workflows/test.yml'

  test:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: "test: ${{ matrix.python }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    strategy:
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.python_versions) }}
        platform:
          - "ubuntu-24.04"

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # https://github.com/actions/checkout/issues/249
          fetch-depth: 0

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
  
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install vllm
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: "CPU only unit tests"
        env:
          RUN_DEVDAX_L1_INTEGRATION: "1"
          RUN_DAX_L2_INTEGRATION: "1"
          LMCACHE_TEST_DEVDAX_L1_PATHS: ""
        run: |
          pytest -m "not (cuda or musa or xpu or npu or neuron or rbln)"

  hf3fs-native-tests:
    needs: changes
    if: needs.changes.outputs.hf3fs_native == 'true' && github.event.pull_request.draft != true
    name: HF3FS connector native tests
    runs-on: ubuntu-24.04

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Abseil
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libabsl-dev

      - name: Run HF3FS connector tests against the SDK double
        run: python3 tests/native/storage_backends/hf3fs/run_tests.py

  token-drop-vllm-0251:
    needs: changes
    if: needs.changes.outputs.token_drop == 'true' && github.event.pull_request.draft != true
    name: "Token-dropping tests (vLLM 0.25.1)"
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install pinned vLLM and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "vllm==0.25.1" -r requirements/common.txt -r requirements/test.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation --no-deps

      - name: Verify pinned version and run token-dropping tests
        run: |
          python - <<'PY'
          import vllm

          assert vllm.__version__.split("+", 1)[0] == "0.25.1", vllm.__version__
          PY

          pytest -q -rs --junitxml=token-drop-tests.xml tests/v1/test_token_drop_allocator_adapter.py tests/v1/test_token_drop_prefix_caching_publication_guard.py tests/v1/test_token_drop_query_hooks.py tests/v1/test_token_drop_worker_adapter.py tests/v1/test_token_drop_native_ownership.py tests/v1/test_token_drop_aio_lifecycle.py tests/v1/test_token_drop_scheduler_resident.py tests/v1/test_token_drop_ownership_boundaries.py

          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("token-drop-tests.xml").getroot().iter("testcase"))
          assert len(cases) >= 27, "Expected at least 27 token-dropping test cases"
          assert not any(c.find("skipped") is not None for c in cases), "Token-dropping test skipped"
          assert any(
              c.get("name") == "test_allocator_hook_installation_is_idempotent"
              for c in cases
          ), "vLLM installer test was not executed"
          assert any(
              c.get("name", "").startswith("test_token_dropping_blocks_stay_private_and_normal_blocks_are_cached[")
              for c in cases
          ), "Prefix-cache publication test was not executed"
          assert any(
              c.get("name") == "test_pinned_vllm_flash_attention_profiling_forward_is_preserved"
              for c in cases
          ), "Pinned vLLM attention contract was not executed"
          for required in (
              "test_pinned_flash_attention_impl_captures_real_query_path",
              "test_install_worker_hook_does_not_patch_global_slot_mapping",
              "test_nested_scheduled_td_dispatch_excludes_full_on_first_prefill",
              "test_native_td_reclaim_preserves_reallocated_block_ownership",
              "test_allocator_hook_isolates_native_pools_with_identical_request_ids",
              "test_scheduler_generations_and_finish_state_are_instance_local",
              "test_scheduler_cannot_reclaim_from_another_pool",
              "test_resident_binding_does_not_keep_pool_or_state_alive",
              "test_owner_gc_while_pool_survives",
              "test_connector_shutdown_unbinds_only_its_own_pool",
              "test_shutdown_failure_still_releases_binding",
              "test_failed_pool_rebind_preserves_original_connector_binding",
              "test_unbound_pool_preserves_native_publication_for_tagged_request",
              "test_read_view_exposes_selection_only_and_preserves_native_kv",
              "test_disabled_normal_request_preserves_original_eager_prefetch_early_return",
              "test_disabled_token_drop_opt_in_fails_before_any_hook_or_tracker",
          ):
              assert any(c.get("name") == required for c in cases), f"{required} was not executed"
          for mode in (
              "NONE", "PIECEWISE", "FULL", "FULL_DECODE_ONLY", "FULL_AND_PIECEWISE"
          ):
              assert any(
                  c.get("name") == f"test_td_admission_preserves_engine_cudagraph_config[{mode}]"
                  for c in cases
              ), f"Batch-local graph admission test for {mode} was not executed"
          print(f"{len(cases)} token-dropping tests passed, 0 skipped")
          PY

  rust-unit-tests:
    needs: changes
    if: needs.changes.outputs.raw_block == 'true' && github.event.pull_request.draft != true
    name: Rust unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/raw_block/Cargo.toml --no-default-features

  raw-block-tests:
    needs: changes
    if: needs.changes.outputs.raw_block == 'true' && github.event.pull_request.draft != true
    name: raw-block temp-file tests
    runs-on: ubuntu-24.04
    env:
      LMCACHE_LOG_LEVEL: CRITICAL

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: Build raw-block Rust extension
        run: |
          python -m maturin build --release --locked \
            --manifest-path rust/raw_block/Cargo.toml \
            --out .pytest-tmp/raw-block-dist
          python -m pip install .pytest-tmp/raw-block-dist/*.whl

      - name: Run raw-block tests
        run: |
          python -m pytest -q --basetemp=.pytest-tmp/raw-block \
            tests/v1/distributed/raw_block/ \
            tests/v1/distributed/test_raw_block_l2_adapter.py \
            tests/v1/multiprocess/test_raw_block_l2_adapter.py

  grpc-native-tests:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true' && github.event.pull_request.draft != true
    name: gRPC native server tests
    runs-on: ubuntu-latest
    env:
      LMCACHE_LOG_LEVEL: CRITICAL

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      # pygrpc-native is optional, so the main test job skips these tests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          python -m pip install pygrpc-native==0.7.0
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: Run native, shared transport, real server and liveness tests
        run: |
          pytest -q tests/v1/multiprocess/test_grpc_native_server.py \
            tests/v1/distributed/test_p2p.py \
            tests/v1/multiprocess/test_grpc_transport.py \
            tests/v1/multiprocess/test_grpc_real_server.py \
            tests/v1/multiprocess/test_worker_liveness.py
