name: Build cu129 Artifacts

# Reusable workflow that builds the cu129 CUDA 12.9 wheel via cibuildwheel
# against the pytorch manylinux cu12.9 base image.
# Uploaded as the `release-cu129-artifacts` GHA artifact.
# The cu12.9 wheel carries no local version suffix and is published to a
# dedicated v{tag}-cu12 GitHub Release (not PyPI).

on:
  workflow_call:
    secrets:
      dockerhub_token:
        description: DockerHub token used to avoid image pull rate limits.
        required: false

env:
    LC_ALL: en_US.UTF-8

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    build-cu129-artifacts:
        name: Build cu129 artifacts
        runs-on: ubuntu-latest
        steps:
            - name: "Harden Runner"
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                disable-sudo-and-containers: false
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                fetch-depth: 0

            - name: Prepare artifact build
              id: prepare
              uses: ./.github/actions/build-artifacts
              with:
                dockerhub_login: "true"
                dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
                dockerhub_token: ${{ secrets.dockerhub_token }}
                free_disk_space: "true"
                resolve_version: "true"
                fallback_version: 0.0.0.dev
                version_environment_variable: CU129_VERSION

            - name: Setup Python 3.13
              uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
              with:
                python-version: "3.13"

            - name: Install build tooling
              run: |
                python -m pip install --upgrade pip
                pip install build cibuildwheel

            - name: Clean up release artifacts
              run: |
                rm -rf dist/

            - name: Build cu12.9 CUDA wheels with cibuildwheel
              env:
                CIBW_MANYLINUX_X86_64_IMAGE: docker.io/pytorch/manylinux2_28-builder:cuda12.9
                CIBW_ENVIRONMENT: 'TORCH_CUDA_ARCH_LIST="7.0;7.5;8.0;8.6;8.9;9.0;10.0;12.0" ENABLE_CXX11_ABI=1 LMCACHE_CUDA_MAJOR=12 SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.CU129_VERSION }} PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu129 PIP_CONSTRAINT=/project/cibw-constraints.txt'
                CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
                  auditwheel repair
                  --plat manylinux_2_28_x86_64
                  --exclude libtorch.so
                  --exclude libtorch_cuda.so
                  --exclude libtorch_python.so
                  --exclude libtorch_cpu.so
                  --exclude libc10.so
                  --exclude libc10_cuda.so
                  --exclude libcudart.so.12
                  -w {dest_dir} {wheel}
                CIBW_TEST_COMMAND: "python {project}/.github/scripts/assert_native_ops.py"
              run: |
                python -m cibuildwheel --output-dir dist

            - name: Upload cu12.9 release artifacts to GHA
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                name: release-cu129-artifacts
                path: dist/
