# Auto-close requires the absolute line minimum and either ratio threshold.
# Tests, deletion-only changes, and pure renames of deprecated files are excluded.
minimum_deprecated_changed_lines = 200
minimum_deprecated_line_fraction = 0.5
minimum_deprecated_file_fraction = 0.5
# Maintainers can apply this repository label to approve an exceptional change.
allow_changes_label = "allow-deprecated-changes"
# Test changes do not affect either side of the deprecated-code ratio.
test_paths = ["tests/"]
test_suffixes = ["_test.go"]

# Add one table per deprecated module. `paths` contains repository-relative
# file names or directory prefixes; `replacement` is shown in the warning so
# contributors know where maintained work belongs.
[[modules]]
name = "Kubernetes operator"
paths = [
  "operator/",
  ".buildkite/operator/",
  ".github/workflows/operator_ci.yml",
  ".github/workflows/operator_nightly.yml",
  ".github/workflows/operator_release.yml",
]
replacement = "Use the manual DaemonSet deployment described in docs/source/mp/deployment.rst."

[[modules]]
name = "ZMQ request transport"
paths = [
  "lmcache/v1/client/transport/zmq_impl/",
  "lmcache/v1/multiprocess/transport/zmq_impl/",
]
replacement = "Use the gRPC request transport under lmcache/v1/transport/grpc/."
