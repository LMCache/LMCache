[pytest]
log_cli = true
log_cli_level = INFO
# pytest's defaults, plus PRT: its tests need Python >= 3.11 and run on their
# own (python -m pytest perf_regression_testing/tests).
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} perf_regression_testing
markers =
    no_shared_allocator: Disable the shared-allocator monkeypatch for this test
    integration: Mark integration tests
    cuda: Tests that can only run with CUDA runtime
    xpu: Tests that can only run with XPU runtime
    musa: Tests that can only run with MUSA runtime
    npu: Tests that can only run with Ascend NPU runtime
    neuron: Tests that can only run with Neuron (AWS Trainium) runtime
    rbln: Tests that can only run with RBLN (Rebellions NPU) runtime
    supa: Tests that can only run with Biren SUPA runtime
    sglang: Tests for SGLang connector/integration

