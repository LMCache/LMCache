// SPDX-License-Identifier: Apache-2.0
//
// Wire format for the LMCache mp-mode message queue over gRPC.
//
// Two rpc flavors coexist here on purpose:
//
//   1. Typed rpcs -- request / response are real proto messages, so
//      the wire is self-describing and callers never touch msgspec.
//      New rpcs should go this way; migrating existing ones is a
//      per-rpc chore because each has a bespoke Python payload shape.
//   2. Legacy rpcs -- request / response are ``BytesRequest`` /
//      ``BytesResponse`` wrappers whose ``payload`` / ``result``
//      still carry msgspec-encoded values.  Kept only so we can
//      promote rpcs to typed messages incrementally without
//      touching the 30+ callers in one PR.
//
// The end state is "every rpc typed"; ``BytesRequest`` / ``BytesResponse``
// will be deleted once the last handler stops using them.

syntax = "proto3";

package lmcache.mp;

// -----------------------------------------------------------------------
// Legacy msgspec envelope.  Do not use for new rpcs -- add a real proto
// message pair instead (see PingRequest / PingResponse below for the
// smallest possible reference impl).
// -----------------------------------------------------------------------

message BytesRequest {
  bytes payload = 1;
}

message BytesResponse {
  bytes result = 1;
}

// -----------------------------------------------------------------------
// Typed rpc messages start here.  Each new pair lives right above the
// rpc that uses it so ``git blame`` reads top to bottom.
// -----------------------------------------------------------------------

// Ping: liveness probe.  ``instance_id`` is the caller's worker id, or
// -1 for an untracked prober (the scheduler adapter uses this).  The
// server always returns ``ok=true`` -- the mere fact that the rpc
// completes is the health signal.  Chosen as the first typed rpc
// precisely because both sides are trivial.
message PingRequest {
  // -1 => untracked prober; otherwise the worker instance id.
  int64 instance_id = 1;
}

message PingResponse {
  bool ok = 1;
}

// -----------------------------------------------------------------------
// Shared: cache key used by 9+ engine rpcs (Lookup / Store / Retrieve /
// FreeLookupLocks / PrepareStore / CommitStore / PrepareRetrieve /
// CommitRetrieve / EndSession / CB_LOOKUP_PRE_COMPUTED / ...).  Kept
// here so those rpcs can just embed it once they migrate off the
// legacy BytesRequest envelope, instead of each redeclaring the same
// eight fields.  Field numbers mirror the dataclass declaration order
// in ``lmcache/v1/multiprocess/custom_types.py`` for readability.
//
// ``worker_id`` is optional to preserve the ``int | None`` semantics
// used for tp-fan-out lookups (the sentinel is a missing field, not
// ``-1``, so numeric worker ids collide with nothing).
// -----------------------------------------------------------------------
message IpcCacheServerKey {
  string model_name = 1;
  int64 world_size = 2;
  optional int64 worker_id = 3;
  repeated int64 token_ids = 4;
  int64 start = 5;
  int64 end = 6;
  string request_id = 7;
  string cache_salt = 8;
}

// Lookup: submit a prefix lookup and return once the job is registered.
// The rpc itself has no return value -- the caller polls with
// ``QueryPrefetchStatus`` for the outcome.
message LookupRequest {
  IpcCacheServerKey key = 1;
  int64 tp_size = 2;
}

message LookupResponse {}

// FreeLookupLocks: release the read locks acquired by a Lookup without
// paying for a full Retrieve.  Same key contract as Lookup so it can
// reuse the shared IpcCacheServerKey message.
message FreeLookupLocksRequest {
  IpcCacheServerKey key = 1;
  int64 tp_size = 2;
}

message FreeLookupLocksResponse {}

// EndSession: drop server-side session state for a request id.
message EndSessionRequest {
  string request_id = 1;
}

message EndSessionResponse {}

// UnregisterKvCache / UnregisterKvCacheEngineDrivenContext:
// symmetric teardown for the two register flavours.  Payload is just
// the instance id; both handlers return nothing.
message UnregisterKvCacheRequest {
  int64 instance_id = 1;
}

message UnregisterKvCacheResponse {}

message UnregisterKvCacheEngineDrivenContextRequest {
  int64 instance_id = 1;
}

message UnregisterKvCacheEngineDrivenContextResponse {}

// QueryPrefetchStatus / WaitPrefetchStatus / QueryPrefetchLookupHits:
// the three prefetch pollers.  All return ``int | None`` today, so the
// wire uses optional int64 (absent field == Python ``None``); no
// magic sentinel value is needed on the wire.
message QueryPrefetchStatusRequest {
  string request_id = 1;
}

message QueryPrefetchStatusResponse {
  optional int64 chunk_count = 1;
}

message WaitPrefetchStatusRequest {
  string request_id = 1;
  double timeout = 2;
}

message WaitPrefetchStatusResponse {
  optional int64 chunk_count = 1;
}

message QueryPrefetchLookupHitsRequest {
  string request_id = 1;
}

message QueryPrefetchLookupHitsResponse {
  optional int64 chunk_count = 1;
}

// Clear / GetChunkSize / GetExperimental / Noop: controller & debug rpcs
// with trivial payloads.  Every message keeps its own name so the wire
// remains self-describing (no shared "EmptyRequest" alias — cheaper to grep).
message ClearRequest {}

message ClearResponse {}

message GetChunkSizeRequest {}

message GetChunkSizeResponse {
  int64 chunk_size = 1;
}

message GetExperimentalRequest {}

message GetExperimentalResponse {
  repeated string names = 1;
}

message NoopRequest {}

message NoopResponse {
  string message = 1;
}

// -----------------------------------------------------------------------
// Wave 3 shared messages.  Store / Retrieve and every CB pre-computed
// rpc share the ``(event_ipc_handle, success)`` reply shape, so it
// lives once here.  Same reasoning as IpcCacheServerKey.
// -----------------------------------------------------------------------
message EventIpcHandleResult {
  bytes event_ipc_handle = 1;
  bool success = 2;
}

// LMCache KV-group's block ID list: STORE / RETRIEVE / CB_RETRIEVE_V3
// all send one entry per KV group in kernel order.
message BlockIdGroup {
  repeated int64 block_ids = 1;
}

// (start, end) match range for the V1 CB lookup/retrieve rpcs.  A
// dedicated message keeps the wire self-describing (proto has no
// native tuple type).
message MatchRange {
  int64 start = 1;
  int64 end = 2;
}

// CBMatchResult: V2/V3 lookup returns one per matched sub-sequence.
message CbMatchResult {
  int64 old_st = 1;
  int64 old_ed = 2;
  int64 cur_st = 3;
  int64 cur_ed = 4;
  bytes hash = 5;
}

// Store: publish a KV group into the server-side cache.
message StoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
}

message StoreResponse {
  EventIpcHandleResult result = 1;
}

// Retrieve: pull a KV group into the caller's paged blocks.
// ``skip_first_n_tokens`` lets the caller keep APC-shared blocks intact.
message RetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
  int64 skip_first_n_tokens = 5;
}

message RetrieveResponse {
  EventIpcHandleResult result = 1;
}

// ReportBlockAllocation: fire-and-forget vLLM block allocation trace.
message BlockAllocationRecord {
  string req_id = 1;
  repeated int64 new_block_ids = 2;
  repeated int64 new_token_ids = 3;
}

message ReportBlockAllocationRequest {
  int64 instance_id = 1;
  string model_name = 2;
  repeated BlockAllocationRecord records = 3;
}

message ReportBlockAllocationResponse {}

// CB Unregister family — same [int] -> None shape as UnregisterKvCache.
message CbUnregisterKvCacheRequest {
  int64 instance_id = 1;
}

message CbUnregisterKvCacheResponse {}

message CbUnregisterRopeV3Request {
  int64 instance_id = 1;
}

message CbUnregisterRopeV3Response {}

// Blend V1 lookup: returns per-match ranges.
message CbLookupPreComputedRequest {
  IpcCacheServerKey key = 1;
}

message CbLookupPreComputedResponse {
  repeated MatchRange ranges = 1;
}

// Blend V1 store family (StorePreComputed + StoreFinal share the shape).
message CbStorePreComputedRequest {
  IpcCacheServerKey key = 1;
  int64 offset = 2;
  int64 instance_id = 3;
  bytes event_ipc_handle = 4;
}

message CbStorePreComputedResponse {
  EventIpcHandleResult result = 1;
}

message CbStoreFinalRequest {
  IpcCacheServerKey key = 1;
  int64 offset = 2;
  int64 instance_id = 3;
  bytes event_ipc_handle = 4;
}

message CbStoreFinalResponse {
  EventIpcHandleResult result = 1;
}

// Blend V1 retrieve: pulls the pre-computed chunks into the CB buffer.
message CbRetrievePreComputedRequest {
  IpcCacheServerKey key = 1;
  repeated MatchRange ranges = 2;
  int64 offset = 3;
  int64 instance_id = 4;
  bytes event_ipc_handle = 5;
}

message CbRetrievePreComputedResponse {
  EventIpcHandleResult result = 1;
}

// Blend V2: uses CbMatchResult everywhere plain (start,end) was used.
message CbLookupPreComputedV2Request {
  IpcCacheServerKey key = 1;
}

message CbLookupPreComputedV2Response {
  repeated CbMatchResult matches = 1;
}

message CbRetrievePreComputedV2Request {
  IpcCacheServerKey key = 1;
  repeated CbMatchResult cb_match_result = 2;
  int64 offset = 3;
  int64 instance_id = 4;
  bytes event_ipc_handle = 5;
}

message CbRetrievePreComputedV2Response {
  EventIpcHandleResult result = 1;
}

// Blend V3: retrieve into paged blocks (per LMCache KV group).
message CbRetrievePreComputedV3Request {
  IpcCacheServerKey key = 1;
  repeated CbMatchResult cb_match_result = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  int64 instance_id = 4;
  bytes event_ipc_handle = 5;
}

message CbRetrievePreComputedV3Response {
  EventIpcHandleResult result = 1;
}

// Blend V3 unified lookup: same input shape as LOOKUP; the response
// carries prefix coverage and non-prefix segment matches together, or
// is absent while either leg is still loading.
message CbUnifiedLookupRequest {
  IpcCacheServerKey key = 1;
  int64 tp_size = 2;
}

// CBUnifiedLookupResult dataclass mirrored on the wire.
message CbUnifiedLookupPayload {
  int64 prefix_coverage_tokens = 1;
  repeated CbMatchResult non_prefix_segments = 2;
  repeated CbMatchResult segmented_prefix_segments = 3;
}

message CbUnifiedLookupResponse {
  // Nullable: unset while the prefix or the sparse chunks are still
  // loading into L1; the handler returns Python None in that case.
  optional CbUnifiedLookupPayload payload = 1;
}

// -----------------------------------------------------------------------
// Wave 4 messages.
// -----------------------------------------------------------------------

// RegisterKvCacheEngineDrivenContext: worker-side non-GPU (data path)
// registration.  All fields are already flat primitives (“dtype_str”
// carries the torch dtype name), so the msgspec.Struct mirrors 1:1.
message RegisterKvCacheEngineDrivenContextRequest {
  int64 instance_id = 1;
  string model_name = 2;
  int64 world_size = 3;
  int64 block_size = 4;
  int64 num_layers = 5;
  int64 hidden_dim_size = 6;
  string dtype_str = 7;
  bool use_mla = 8;
}

message RegisterKvCacheEngineDrivenContextResponse {
  string shm_name = 1;
  int64 pool_size = 2;
}

// PrepareStore / CommitStore / PrepareRetrieve / CommitRetrieve.
//
// ``context`` here is an opaque strategy-owned dict; the SHM strategy
// packs slot / chunk-index bookkeeping into it, the pickle strategy
// keeps it empty.  Rather than schematising every possible key today,
// the wire carries the pickled bytes and the mq boundary transparently
// (de)serialises -- this keeps the strategy layer free to add fields
// without touching the .proto.  Empty dict maps to empty bytes on the
// wire, so a fresh client hitting an old server (or vice versa) works.
message PrepareStoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
}

message PrepareStoreResponse {
  bytes pickled_context = 1;
}

message CommitStoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  bytes pickled_context = 3;
}

message CommitStoreResponse {
  bool success = 1;
}

message PrepareRetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
}

message PrepareRetrieveResponse {
  bool success = 1;
  bytes data = 2;
  bytes pickled_context = 3;
}

message CommitRetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
}

message CommitRetrieveResponse {
  bool success = 1;
}

// ObjectKey / MemoryLayoutDesc: shared distributed-storage types used
// by every P2P rpc.  Flat primitive fields so the wire is fully
// self-describing.
message ObjectKey {
  bytes chunk_hash = 1;
  string model_name = 2;
  int64 kv_rank = 3;
  int64 object_group_id = 4;
  string cache_salt = 5;
}

// A tensor shape carried as a plain list of dims (torch.Size on the
// Python side).
message TensorShape {
  repeated int64 dims = 1;
}

message MemoryLayoutDesc {
  repeated TensorShape shapes = 1;
  // torch dtype names, aligned with ``shapes``.
  repeated string dtypes = 2;
}

message TransferChannelAddress {
  int64 offset = 1;
  int64 size = 2;
}

message P2pLookupAndLockRequest {
  repeated ObjectKey keys = 1;
  map<int64, MemoryLayoutDesc> group_layout_descs = 2;
}

message P2pLookupAndLockResponse {
  int64 task_id = 1;
}

message P2pQueryLookupResultsRequest {
  int64 task_id = 1;
}

message TransferChannelAddressList {
  repeated TransferChannelAddress addresses = 1;
}

message P2pQueryLookupResultsResponse {
  // Absent = handler returned Python None (lookup still in flight or
  // already consumed); present with an empty list would be a real
  // empty match.
  optional TransferChannelAddressList addresses = 1;
}

message P2pUnlockObjectsRequest {
  repeated ObjectKey keys = 1;
}

message P2pUnlockObjectsResponse {}

// -----------------------------------------------------------------------
// Wave 5 messages: the last three Register* rpcs that carry
// ``DeviceIPCWrapper`` (a pickle-preserved base class chosen so the
// concrete subclass -- CudaIPCWrapper, RawCudaIPCWrapper,
// CpuShmTensorWrapper, ... -- travels with the object).  The
// wrapper's own ``Serialize`` / ``Deserialize`` static methods do the
// pickle round-trip today, so the wire carries the opaque bytes and
// this .proto stays free of subclass-specific fields.  A follow-up
// PR can promote ``DeviceIpcWrapper`` to a ``oneof`` without touching
// any rpc definition below.
// -----------------------------------------------------------------------
message DeviceIpcWrapper {
  // Subclass identity preserved by ``DeviceIPCWrapper.Serialize``
  // (pickle under the hood).  Length only bounded by the wire limit.
  bytes pickled_payload = 1;
}

// EngineGroupInfo mirrors the ``msgspec.Struct`` field-by-field.
message EngineGroupInfo {
  int64 engine_group_id = 1;
  repeated int64 layer_indices = 2;
  int64 tokens_per_block = 3;
  int64 sw_size_tokens = 4;
}

// RegisterKvCache: the GPU-path registration.  ``engine_type`` is
// carried as the enum's string value (``"vllm"`` / ``"sglang"`` /
// ``"trtllm"`` / ``"mock"``) -- matches how msgspec encoded it and
// keeps forward-compat cheap when new engines land.  ``LayoutHints``
// is a ``TypedDict``: pickle bytes so the schema layer stays free to
// evolve without touching the .proto.
message RegisterKvCacheRequest {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper kv_cache = 2;
  string model_name = 3;
  int64 world_size = 4;
  string engine_type = 5;
  bytes pickled_layout_hints = 6;
  repeated EngineGroupInfo engine_group_infos = 7;
}

message RegisterKvCacheResponse {}

// CbRegisterKvCache: the CB-path registration.  Same shape as the
// GPU path but without the format-detection metadata (CB flow is
// engine-agnostic once the wrapper list is registered).
message CbRegisterKvCacheRequest {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper kv_cache = 2;
  string model_name = 3;
  int64 world_size = 4;
}

message CbRegisterKvCacheResponse {}

// CbRegisterRopeV3: publish per-engine rope caches (dual-RoPE models
// send two).  ``group_to_cache`` maps engine group idx -> cache idx;
// empty means "all groups use cache 0".
message RopeWindow {
  repeated int64 values = 1;
}

message CbRegisterRopeV3Request {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper cos_sin_caches_ipc = 2;
  int64 head_size = 3;
  bool is_neox_style = 4;
  repeated int64 group_to_cache = 5;
  repeated RopeWindow group_rot = 6;
}

message CbRegisterRopeV3Response {}

// Concurrent callers can share one gRPC unary exchange without giving up
// typed protobuf payloads.  Field names mirror RequestType names so the
// Python registry can map them without a second hand-maintained table.
message BatchRequestItem {
  oneof request {
    PingRequest ping = 2;
    LookupRequest lookup = 3;
    FreeLookupLocksRequest free_lookup_locks = 4;
    EndSessionRequest end_session = 5;
    UnregisterKvCacheRequest unregister_kv_cache = 6;
    UnregisterKvCacheRequest unregister_q_cache = 7;
    UnregisterKvCacheEngineDrivenContextRequest
        unregister_kv_cache_engine_driven_context = 8;
    QueryPrefetchStatusRequest query_prefetch_status = 9;
    WaitPrefetchStatusRequest wait_prefetch_status = 10;
    QueryPrefetchLookupHitsRequest query_prefetch_lookup_hits = 11;
    ClearRequest clear = 12;
    GetChunkSizeRequest get_chunk_size = 13;
    GetExperimentalRequest get_experimental = 14;
    NoopRequest noop = 15;
    StoreRequest store = 16;
    StoreRequest store_q = 17;
    RetrieveRequest retrieve = 18;
    ReportBlockAllocationRequest report_block_allocation = 19;
    CbUnregisterKvCacheRequest cb_unregister_kv_cache = 20;
    CbUnregisterRopeV3Request cb_unregister_rope_v3 = 21;
    CbLookupPreComputedRequest cb_lookup_pre_computed = 22;
    CbStorePreComputedRequest cb_store_pre_computed = 23;
    CbStoreFinalRequest cb_store_final = 24;
    CbRetrievePreComputedRequest cb_retrieve_pre_computed = 25;
    CbLookupPreComputedV2Request cb_lookup_pre_computed_v2 = 26;
    CbRetrievePreComputedV2Request cb_retrieve_pre_computed_v2 = 27;
    CbRetrievePreComputedV3Request cb_retrieve_pre_computed_v3 = 28;
    CbUnifiedLookupRequest cb_unified_lookup = 29;
    RegisterKvCacheEngineDrivenContextRequest
        register_kv_cache_engine_driven_context = 30;
    PrepareStoreRequest prepare_store = 31;
    CommitStoreRequest commit_store = 32;
    PrepareRetrieveRequest prepare_retrieve = 33;
    CommitRetrieveRequest commit_retrieve = 34;
    P2pLookupAndLockRequest p2p_lookup_and_lock = 35;
    P2pQueryLookupResultsRequest p2p_query_lookup_results = 36;
    P2pUnlockObjectsRequest p2p_unlock_objects = 37;
    RegisterKvCacheRequest register_kv_cache = 38;
    RegisterKvCacheRequest register_q_cache = 39;
    CbRegisterKvCacheRequest cb_register_kv_cache = 40;
    CbRegisterRopeV3Request cb_register_rope_v3 = 41;
  }
}

message BatchRequest {
  repeated BatchRequestItem items = 1;
}

message BatchError {
  string status = 1;
  string details = 2;
}

message BatchResponseItem {
  oneof response {
    PingResponse ping = 2;
    LookupResponse lookup = 3;
    FreeLookupLocksResponse free_lookup_locks = 4;
    EndSessionResponse end_session = 5;
    UnregisterKvCacheResponse unregister_kv_cache = 6;
    UnregisterKvCacheResponse unregister_q_cache = 7;
    UnregisterKvCacheEngineDrivenContextResponse
        unregister_kv_cache_engine_driven_context = 8;
    QueryPrefetchStatusResponse query_prefetch_status = 9;
    WaitPrefetchStatusResponse wait_prefetch_status = 10;
    QueryPrefetchLookupHitsResponse query_prefetch_lookup_hits = 11;
    ClearResponse clear = 12;
    GetChunkSizeResponse get_chunk_size = 13;
    GetExperimentalResponse get_experimental = 14;
    NoopResponse noop = 15;
    StoreResponse store = 16;
    StoreResponse store_q = 17;
    RetrieveResponse retrieve = 18;
    ReportBlockAllocationResponse report_block_allocation = 19;
    CbUnregisterKvCacheResponse cb_unregister_kv_cache = 20;
    CbUnregisterRopeV3Response cb_unregister_rope_v3 = 21;
    CbLookupPreComputedResponse cb_lookup_pre_computed = 22;
    CbStorePreComputedResponse cb_store_pre_computed = 23;
    CbStoreFinalResponse cb_store_final = 24;
    CbRetrievePreComputedResponse cb_retrieve_pre_computed = 25;
    CbLookupPreComputedV2Response cb_lookup_pre_computed_v2 = 26;
    CbRetrievePreComputedV2Response cb_retrieve_pre_computed_v2 = 27;
    CbRetrievePreComputedV3Response cb_retrieve_pre_computed_v3 = 28;
    CbUnifiedLookupResponse cb_unified_lookup = 29;
    RegisterKvCacheEngineDrivenContextResponse
        register_kv_cache_engine_driven_context = 30;
    PrepareStoreResponse prepare_store = 31;
    CommitStoreResponse commit_store = 32;
    PrepareRetrieveResponse prepare_retrieve = 33;
    CommitRetrieveResponse commit_retrieve = 34;
    P2pLookupAndLockResponse p2p_lookup_and_lock = 35;
    P2pQueryLookupResultsResponse p2p_query_lookup_results = 36;
    P2pUnlockObjectsResponse p2p_unlock_objects = 37;
    RegisterKvCacheResponse register_kv_cache = 38;
    RegisterKvCacheResponse register_q_cache = 39;
    CbRegisterKvCacheResponse cb_register_kv_cache = 40;
    CbRegisterRopeV3Response cb_register_rope_v3 = 41;
    BatchError error = 42;
  }
}

message BatchResponse {
  repeated BatchResponseItem items = 1;
}

// -----------------------------------------------------------------------
// Service. One typed unary rpc per RequestType, plus Batch for concurrent
// callers. Method names are the CamelCase form of the RequestType enum
// (STORE -> Store, CB_LOOKUP_PRE_COMPUTED_V2 -> CbLookupPreComputedV2, etc.)
// so gRPC's built-in routing replaces the old hand-written msgspec dispatch.
// -----------------------------------------------------------------------

service MessageQueue {
  // Transport optimization for concurrent callers. Single callers use the
  // dedicated methods below and pay no batching delay.
  rpc Batch(BatchRequest) returns (BatchResponse);

  // Engine operations
  rpc RegisterKvCache(RegisterKvCacheRequest) returns (RegisterKvCacheResponse);
  rpc RegisterQCache(RegisterKvCacheRequest) returns (RegisterKvCacheResponse);
  rpc UnregisterKvCache(UnregisterKvCacheRequest)
      returns (UnregisterKvCacheResponse);
  rpc UnregisterQCache(UnregisterKvCacheRequest)
      returns (UnregisterKvCacheResponse);
  rpc StoreQ(StoreRequest) returns (StoreResponse);
  rpc Store(StoreRequest) returns (StoreResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc QueryPrefetchStatus(QueryPrefetchStatusRequest)
      returns (QueryPrefetchStatusResponse);
  rpc WaitPrefetchStatus(WaitPrefetchStatusRequest)
      returns (WaitPrefetchStatusResponse);
  rpc QueryPrefetchLookupHits(QueryPrefetchLookupHitsRequest)
      returns (QueryPrefetchLookupHitsResponse);
  rpc FreeLookupLocks(FreeLookupLocksRequest) returns (FreeLookupLocksResponse);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
  rpc RegisterKvCacheEngineDrivenContext(
      RegisterKvCacheEngineDrivenContextRequest)
      returns (RegisterKvCacheEngineDrivenContextResponse);
  rpc UnregisterKvCacheEngineDrivenContext(
      UnregisterKvCacheEngineDrivenContextRequest)
      returns (UnregisterKvCacheEngineDrivenContextResponse);
  rpc PrepareStore(PrepareStoreRequest) returns (PrepareStoreResponse);
  rpc CommitStore(CommitStoreRequest) returns (CommitStoreResponse);
  rpc PrepareRetrieve(PrepareRetrieveRequest) returns (PrepareRetrieveResponse);
  rpc CommitRetrieve(CommitRetrieveRequest) returns (CommitRetrieveResponse);

  // Controller operations
  rpc Clear(ClearRequest) returns (ClearResponse);
  rpc GetChunkSize(GetChunkSizeRequest) returns (GetChunkSizeResponse);
  rpc GetExperimental(GetExperimentalRequest) returns (GetExperimentalResponse);
  rpc Ping(PingRequest) returns (PingResponse);

  // Observability operations
  rpc ReportBlockAllocation(ReportBlockAllocationRequest)
      returns (ReportBlockAllocationResponse);

  // Debug operations
  rpc Noop(NoopRequest) returns (NoopResponse);

  // Blend V1
  rpc CbRegisterKvCache(CbRegisterKvCacheRequest)
      returns (CbRegisterKvCacheResponse);
  rpc CbUnregisterKvCache(CbUnregisterKvCacheRequest)
      returns (CbUnregisterKvCacheResponse);
  rpc CbStorePreComputed(CbStorePreComputedRequest)
      returns (CbStorePreComputedResponse);
  rpc CbLookupPreComputed(CbLookupPreComputedRequest)
      returns (CbLookupPreComputedResponse);
  rpc CbRetrievePreComputed(CbRetrievePreComputedRequest)
      returns (CbRetrievePreComputedResponse);
  rpc CbStoreFinal(CbStoreFinalRequest) returns (CbStoreFinalResponse);

  // Blend V2
  rpc CbLookupPreComputedV2(CbLookupPreComputedV2Request)
      returns (CbLookupPreComputedV2Response);
  rpc CbRetrievePreComputedV2(CbRetrievePreComputedV2Request)
      returns (CbRetrievePreComputedV2Response);

  // Blend V3
  rpc CbRegisterRopeV3(CbRegisterRopeV3Request)
      returns (CbRegisterRopeV3Response);
  rpc CbUnregisterRopeV3(CbUnregisterRopeV3Request)
      returns (CbUnregisterRopeV3Response);
  rpc CbRetrievePreComputedV3(CbRetrievePreComputedV3Request)
      returns (CbRetrievePreComputedV3Response);
  rpc CbUnifiedLookup(CbUnifiedLookupRequest) returns (CbUnifiedLookupResponse);

  // P2P
  rpc P2PLookupAndLock(P2pLookupAndLockRequest)
      returns (P2pLookupAndLockResponse);
  rpc P2PQueryLookupResults(P2pQueryLookupResultsRequest)
      returns (P2pQueryLookupResultsResponse);
  rpc P2PUnlockObjects(P2pUnlockObjectsRequest)
      returns (P2pUnlockObjectsResponse);
}
