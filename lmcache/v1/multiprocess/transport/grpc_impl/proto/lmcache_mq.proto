// SPDX-License-Identifier: Apache-2.0
//
// Wire format for the LMCache mp-mode message queue over gRPC.
//
// Two rpc flavors coexist here on purpose:
//
//   1. Typed rpcs -- request / response are real proto messages, so
//      the wire is self-describing and callers never touch msgspec.
//      New rpcs should go this way; migrating existing ones is a
//      per-rpc chore because each has a bespoke Python payload shape.
//   2. Legacy rpcs -- request / response are ``BytesRequest`` /
//      ``BytesResponse`` wrappers whose ``payload`` / ``result``
//      still carry msgspec-encoded values.  Kept only so we can
//      promote rpcs to typed messages incrementally without
//      touching the 30+ callers in one PR.
//
// The end state is "every rpc typed"; ``BytesRequest`` / ``BytesResponse``
// will be deleted once the last handler stops using them.

syntax = "proto3";

package lmcache.mp;

// -----------------------------------------------------------------------
// Legacy msgspec envelope.  Do not use for new rpcs -- add a real proto
// message pair instead (see PingRequest / PingResponse below for the
// smallest possible reference impl).
// -----------------------------------------------------------------------

message BytesRequest {
  bytes payload = 1;
}

message BytesResponse {
  bytes result = 1;
}

// -----------------------------------------------------------------------
// Typed rpc messages start here.  Each new pair lives right above the
// rpc that uses it so ``git blame`` reads top to bottom.
// -----------------------------------------------------------------------

// Ping: liveness probe.  ``instance_id`` is the caller's worker id, or
// -1 for an untracked prober (the scheduler adapter uses this).  The
// server always returns ``ok=true`` -- the mere fact that the rpc
// completes is the health signal.  Chosen as the first typed rpc
// precisely because both sides are trivial.
message PingRequest {
  // -1 => untracked prober; otherwise the worker instance id.
  int64 instance_id = 1;
}

message PingResponse {
  bool ok = 1;
}

// -----------------------------------------------------------------------
// Shared: cache key used by 9+ engine rpcs (Lookup / Store / Retrieve /
// FreeLookupLocks / PrepareStore / CommitStore / PrepareRetrieve /
// CommitRetrieve / EndSession / CB_LOOKUP_PRE_COMPUTED / ...).  Kept
// here so those rpcs can just embed it once they migrate off the
// legacy BytesRequest envelope, instead of each redeclaring the same
// eight fields.  Field numbers mirror the dataclass declaration order
// in ``lmcache/v1/multiprocess/custom_types.py`` for readability.
//
// ``worker_id`` is optional to preserve the ``int | None`` semantics
// used for tp-fan-out lookups (the sentinel is a missing field, not
// ``-1``, so numeric worker ids collide with nothing).
// -----------------------------------------------------------------------
message IpcCacheServerKey {
  string model_name = 1;
  int64 world_size = 2;
  optional int64 worker_id = 3;
  repeated int64 token_ids = 4;
  int64 start = 5;
  int64 end = 6;
  string request_id = 7;
  string cache_salt = 8;
}

// Lookup: submit a prefix lookup and return once the job is registered.
// The rpc itself has no return value -- the caller polls with
// ``QueryPrefetchStatus`` for the outcome.
message LookupRequest {
  IpcCacheServerKey key = 1;
  int64 tp_size = 2;
}

message LookupResponse {}

// -----------------------------------------------------------------------
// Service.  One rpc per RequestType.  Method names are the CamelCase
// form of the RequestType enum (STORE -> Store, CB_LOOKUP_PRE_COMPUTED_V2
// -> CbLookupPreComputedV2, etc.) so gRPC's built-in method routing
// takes over the dispatch that the old msgspec envelope did by hand.
// -----------------------------------------------------------------------

service MessageQueue {
  // Engine operations
  rpc RegisterKvCache(BytesRequest) returns (BytesResponse);
  rpc UnregisterKvCache(BytesRequest) returns (BytesResponse);
  rpc Store(BytesRequest) returns (BytesResponse);
  rpc Retrieve(BytesRequest) returns (BytesResponse);
  // TYPED: first consumer of the shared IpcCacheServerKey message.
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc QueryPrefetchStatus(BytesRequest) returns (BytesResponse);
  rpc WaitPrefetchStatus(BytesRequest) returns (BytesResponse);
  rpc QueryPrefetchLookupHits(BytesRequest) returns (BytesResponse);
  rpc FreeLookupLocks(BytesRequest) returns (BytesResponse);
  rpc EndSession(BytesRequest) returns (BytesResponse);
  rpc RegisterKvCacheEngineDrivenContext(BytesRequest) returns (BytesResponse);
  rpc UnregisterKvCacheEngineDrivenContext(BytesRequest) returns (BytesResponse);
  rpc PrepareStore(BytesRequest) returns (BytesResponse);
  rpc CommitStore(BytesRequest) returns (BytesResponse);
  rpc PrepareRetrieve(BytesRequest) returns (BytesResponse);
  rpc CommitRetrieve(BytesRequest) returns (BytesResponse);

  // Controller operations
  rpc Clear(BytesRequest) returns (BytesResponse);
  rpc GetChunkSize(BytesRequest) returns (BytesResponse);
  // TYPED: reference impl for the typed-rpc migration path.  All
  // other rpcs are still on the legacy BytesRequest/BytesResponse
  // envelope until they get migrated one-by-one.
  rpc Ping(PingRequest) returns (PingResponse);

  // Observability operations
  rpc ReportBlockAllocation(BytesRequest) returns (BytesResponse);

  // Debug operations
  rpc Noop(BytesRequest) returns (BytesResponse);

  // Blend V1
  rpc CbRegisterKvCache(BytesRequest) returns (BytesResponse);
  rpc CbUnregisterKvCache(BytesRequest) returns (BytesResponse);
  rpc CbStorePreComputed(BytesRequest) returns (BytesResponse);
  rpc CbLookupPreComputed(BytesRequest) returns (BytesResponse);
  rpc CbRetrievePreComputed(BytesRequest) returns (BytesResponse);
  rpc CbStoreFinal(BytesRequest) returns (BytesResponse);

  // Blend V2
  rpc CbLookupPreComputedV2(BytesRequest) returns (BytesResponse);
  rpc CbRetrievePreComputedV2(BytesRequest) returns (BytesResponse);

  // Blend V3
  rpc CbRegisterRopeV3(BytesRequest) returns (BytesResponse);
  rpc CbUnregisterRopeV3(BytesRequest) returns (BytesResponse);
  rpc CbRetrievePreComputedV3(BytesRequest) returns (BytesResponse);
  rpc CbUnifiedLookup(BytesRequest) returns (BytesResponse);

  // P2P
  rpc P2PLookupAndLock(BytesRequest) returns (BytesResponse);
  rpc P2PQueryLookupResults(BytesRequest) returns (BytesResponse);
  rpc P2PUnlockObjects(BytesRequest) returns (BytesResponse);
}