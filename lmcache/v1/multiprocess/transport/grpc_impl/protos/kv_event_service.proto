// KVEventService wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";

message SubscribeKvEventsRequest {
  int64 instance_id = 1;
  string model_name = 2;
  int64 cursor = 3;
  int64 max_events = 4;
  int64 world_size = 5;
  KVEventProfile profile = 6;
}

message KVEventRecord {
  int64 seq = 1;
  string kind = 2;
  string medium = 3;
  string model_name = 4;
  reserved 5, 6;  // Legacy LM chunk identities must never reach native consumers.
  repeated bytes encoded_block_hashes = 8;
  optional bytes encoded_parent_block_hash = 9;
  repeated int64 token_ids = 7;
  int64 block_size = 10;
  string profile_id = 11;
  int64 world_size = 12;
  string cache_salt = 13;
}

message KVEventBatch {
  bool enabled = 1;
  int64 incarnation = 2;
  int64 next_cursor = 3;
  bool lost = 4;
  repeated KVEventRecord events = 5;
}

service KVEventService {
  rpc SubscribeKvEvents(SubscribeKvEventsRequest) returns (stream KVEventBatch);
}
