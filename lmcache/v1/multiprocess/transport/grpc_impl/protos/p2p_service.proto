syntax = "proto3";

package lmcache.mp;

import "common.proto";

service P2PService {
  rpc P2PLookupAndLock(TransportPayload) returns (TransportPayload);
  rpc P2PQueryLookupResults(TransportPayload) returns (TransportPayload);
  rpc P2PUnlockObjects(TransportPayload) returns (TransportPayload);
}
