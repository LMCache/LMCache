syntax = "proto3";

package lmcache.mp;

import "lmcache_driven_service.proto";

message ChunkCompletion {
  bytes event_ipc_handle = 1;
  int64 start = 2;
  int64 end = 3;
}

message ChunkStoreResponse {
  bytes terminal_event_ipc_handle = 1;
  repeated ChunkCompletion chunk_events = 2;
  bool success = 3;
  string lease_id = 4;
}

message ReleaseChunkStoreEventsRequest {
  int64 instance_id = 1;
  string lease_id = 2;
}

message ReleaseChunkStoreEventsResponse {}

service ChunkStoreService {
  rpc StoreWithChunkEvents(StoreRequest) returns (ChunkStoreResponse);
  rpc ReleaseChunkStoreEvents(ReleaseChunkStoreEventsRequest)
      returns (ReleaseChunkStoreEventsResponse);
}
