syntax = "proto3";

package lmcache.mp;

import "common.proto";

service ControllerService {
  rpc Clear(TransportPayload) returns (TransportPayload);
  rpc GetChunkSize(TransportPayload) returns (TransportPayload);
  rpc GetExperimental(TransportPayload) returns (TransportPayload);
  rpc Ping(TransportPayload) returns (TransportPayload);
}
