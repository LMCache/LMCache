//
// LMCache-driven transfer wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";
import "p2p_service.proto";

message RegisterKvCacheRequest {
  int64 instance_id = 1;
  repeated DeviceIpcWrapper kv_cache = 2;
  string model_name = 3;
  int64 world_size = 4;
  string engine_type = 5;
  bytes encoded_layout_hints = 6;
  repeated EngineGroupInfo engine_group_infos = 7;
}

message RegisterKvCacheResponse {}

message UnregisterKvCacheRequest {
  int64 instance_id = 1;
}

message UnregisterKvCacheResponse {}

message StoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
}

message StoreResponse {
  EventIpcHandleResult result = 1;
}

message RetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated BlockIdGroup gpu_block_ids = 3;
  bytes event_ipc_handle = 4;
  int64 skip_first_n_tokens = 5;
}

message RetrieveResponse {
  EventIpcHandleResult result = 1;
}

message SparseLeaseRequest {
  int64 instance_id = 1;
  string request_id = 2;
  int64 generation = 3;
  int64 layer_id = 4;
}

message SparsePrefetchRequest {
  int64 instance_id = 1;
  string request_id = 2;
  int64 generation = 3;
  int64 layer_id = 4;
  repeated ObjectKey keys = 5;
}

message SparseWaitPrefetchRequest {
  int64 instance_id = 1;
  string request_id = 2;
  int64 generation = 3;
  int64 layer_id = 4;
  double timeout = 5;
}

message SparseBooleanResponse {
  bool success = 1;
}

message SparseFoundIndices {
  repeated int64 indices = 1;
}

message SparseQueryPrefetchResponse {
  optional SparseFoundIndices found_indices = 1;
}

message SparseRetrieveRequest {
  int64 instance_id = 1;
  string request_id = 2;
  int64 generation = 3;
  int64 layer_id = 4;
  repeated ObjectKey keys = 5;
  repeated BlockIdGroup block_ids = 6;
  bytes event_ipc_handle = 7;
}

message SparseRetrieveResult {
  bool success = 1;
  repeated int64 found_indices = 2;
}

message SparseRetrieveResponse {
  bytes event_ipc_handle = 1;
  SparseRetrieveResult result = 2;
}

service LMCacheDrivenService {
  rpc RegisterKvCache(RegisterKvCacheRequest) returns (RegisterKvCacheResponse);
  rpc UnregisterKvCache(UnregisterKvCacheRequest)
      returns (UnregisterKvCacheResponse);
  rpc Store(StoreRequest) returns (StoreResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  rpc SparsePrefetch(SparsePrefetchRequest) returns (SparseBooleanResponse);
  rpc SparseQueryPrefetch(SparseLeaseRequest)
      returns (SparseQueryPrefetchResponse);
  rpc SparseWaitPrefetch(SparseWaitPrefetchRequest)
      returns (SparseQueryPrefetchResponse);
  rpc SparseRetrieve(SparseRetrieveRequest) returns (SparseRetrieveResponse);
  rpc SparseCancelPrefetch(SparseLeaseRequest) returns (SparseBooleanResponse);
  rpc SparseReleasePrefetch(SparseLeaseRequest) returns (SparseBooleanResponse);
}
