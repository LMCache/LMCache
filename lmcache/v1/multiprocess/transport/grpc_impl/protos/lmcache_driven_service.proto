syntax = "proto3";

package lmcache.mp;

import "common.proto";

service LMCacheDrivenService {
  rpc RegisterKvCache(TransportPayload) returns (TransportPayload);
  rpc UnregisterKvCache(TransportPayload) returns (TransportPayload);
  rpc Store(TransportPayload) returns (TransportPayload);
  rpc Retrieve(TransportPayload) returns (TransportPayload);
}
