// Shared message types for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

// Cache key used by engine and CacheBlend RPCs.
message IpcCacheServerKey {
  string model_name = 1;
  int64 world_size = 2;
  optional int64 worker_id = 3;
  // Packed big-endian uint32, one word per token; replaces a
  // `repeated int64 token_ids` that held field 4. That number is retired,
  // not reused: proto3 encodes packed `repeated int64` and `bytes` alike,
  // so an old client's blob would land here and decode as garbage tokens
  // whenever its length was a multiple of four. Retired, the blob is
  // dropped as an unknown field and this arrives empty, which every
  // consumer reads as zero chunks rather than as tokens.
  // The declaration stays in the slot `token_ids` held: proto_codec binds
  // this message to `IPCCacheServerKey` field by field in declaration
  // order, so the order here mirrors the dataclass and the number is out
  // of sequence on purpose.
  reserved 4;
  bytes token_bytes = 11;
  int64 start = 5;
  int64 end = 6;
  string request_id = 7;
  string cache_salt = 8;
  optional bytes encoded_request_configs = 9;
  int64 num_kv_readers = 10;
}

// Store / Retrieve and CacheBlend retrieve share this reply shape.
message EventIpcHandleResult {
  bytes event_ipc_handle = 1;
  bool success = 2;
}

// One list of block IDs per KV group in kernel order.
message BlockIdGroup {
  repeated int64 block_ids = 1;
}

// Device IPC wrappers preserve concrete Python subclass identity.
message DeviceIpcWrapper {
  bytes pickled_payload = 1;
}

// EngineGroupInfo mirrors the Python msgspec.Struct field-by-field.
message EngineGroupInfo {
  int64 engine_group_id = 1;
  repeated int64 layer_indices = 2;
  int64 tokens_per_block = 3;
  int64 sw_size_tokens = 4;
  int64 extra_object_group_tag = 5;
  bool recurrent_state = 6;
}
