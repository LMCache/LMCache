syntax = "proto3";

package lmcache.mp;

import "common.proto";

service BlendService {
  rpc CbProtocolHandshake(TransportPayload) returns (TransportPayload);
  rpc CbRegisterRope(TransportPayload) returns (TransportPayload);
  rpc CbUnregisterRope(TransportPayload) returns (TransportPayload);
  rpc CbRetrievePreComputed(TransportPayload) returns (TransportPayload);
  rpc CbUnifiedLookup(TransportPayload) returns (TransportPayload);
}
