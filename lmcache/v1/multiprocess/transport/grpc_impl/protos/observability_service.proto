// ObservabilityService wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

message BlockAllocationRecord {
  string req_id = 1;
  repeated int64 new_block_ids = 2;
  repeated int64 new_token_ids = 3;
}

message ReportBlockAllocationRequest {
  int64 instance_id = 1;
  string model_name = 2;
  repeated BlockAllocationRecord records = 3;
}

message ReportBlockAllocationResponse {}

message SubscribeKvEventsRequest {
  int64 instance_id = 1;
  string model_name = 2;
  int64 cursor = 3;
  int64 max_events = 4;
}

message KVEventRecord {
  int64 seq = 1;
  string kind = 2;
  string medium = 3;
  string model_name = 4;
  repeated bytes block_hashes = 5;
  optional bytes parent_block_hash = 6;
  repeated int64 token_ids = 7;
}

message KVEventBatch {
  bool enabled = 1;
  int64 incarnation = 2;
  int64 next_cursor = 3;
  bool lost = 4;
  repeated KVEventRecord events = 5;
}

service ObservabilityService {
  rpc ReportBlockAllocation(ReportBlockAllocationRequest)
      returns (ReportBlockAllocationResponse);
  rpc SubscribeKvEvents(SubscribeKvEventsRequest) returns (stream KVEventBatch);
}
