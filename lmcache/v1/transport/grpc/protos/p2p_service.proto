// P2PService wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";

message ObjectKey {
  ObjectKeyIdentity identity = 1;
  // Request-scoped adapter metadata; excluded from cache identity.
  bytes encoded_extra_attributes = 2;
}

message TensorShape {
  repeated int64 dims = 1;
}

message MemoryLayoutDesc {
  repeated TensorShape shapes = 1;
  repeated string dtypes = 2;
}

message TransferChannelAddress {
  int64 offset = 1;
  int64 size = 2;
}

message P2pLookupAndLockRequest {
  repeated ObjectKey keys = 1;
  map<int64, MemoryLayoutDesc> group_layout_descs = 2;
}

message P2pLookupAndLockResponse {
  int64 task_id = 1;
}

message P2pQueryLookupResultsRequest {
  int64 task_id = 1;
}

message TransferChannelAddressList {
  repeated TransferChannelAddress addresses = 1;
}

message P2pQueryLookupResultsResponse {
  optional TransferChannelAddressList addresses = 1;
}

message P2pUnlockObjectsRequest {
  repeated ObjectKey keys = 1;
}

message P2pUnlockObjectsResponse {}

message P2pReserveWriteRequest {
  repeated ObjectKey keys = 1;
  MemoryLayoutDesc layout_desc = 2;
}

message P2pReserveWriteResponse {
  // One address per requested key; an invalid offset means "not reserved".
  repeated TransferChannelAddress addresses = 1;
}

message P2pFinishWriteRequest {
  repeated ObjectKey keys = 1;
  // Parallel to keys: whether the requester's write of that key completed.
  repeated bool succeeded = 2;
}

message P2pFinishWriteResponse {
  // Parallel to keys: whether the key is now resident on the peer.
  repeated bool committed = 1;
}

service P2PService {
  rpc P2PLookupAndLock(P2pLookupAndLockRequest)
      returns (P2pLookupAndLockResponse);
  rpc P2PQueryLookupResults(P2pQueryLookupResultsRequest)
      returns (P2pQueryLookupResultsResponse);
  rpc P2PUnlockObjects(P2pUnlockObjectsRequest)
      returns (P2pUnlockObjectsResponse);
  rpc P2PReserveWrite(P2pReserveWriteRequest)
      returns (P2pReserveWriteResponse);
  rpc P2PFinishWrite(P2pFinishWriteRequest)
      returns (P2pFinishWriteResponse);
}
