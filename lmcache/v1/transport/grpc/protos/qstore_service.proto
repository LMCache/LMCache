// Experimental QStore wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";
import "lmcache_driven_service.proto";

message ReportQRingStateRequest {
  int64 instance_id = 1;
  int64 worker_id = 2;
  repeated int64 used_blocks = 3;
  int64 num_alloc = 4;
}

message ReportQRingStateResponse {}

message GetQRingRequest {
  string model_name = 1;
  int64 world_size = 2;
}

// QRingInfo mirrors the Python msgspec.Struct field-by-field.
message QRingInfo {
  int64 instance_id = 1;
  int64 worker_id = 2;
  repeated DeviceIpcWrapper q_caches = 3;
  repeated int64 used_blocks = 4;
  int64 num_alloc = 5;
}

message GetQRingResponse {
  repeated QRingInfo result = 1;
}

// SDK transfers address ring pieces: piece p is layer p % num_layers of ring
// block p / num_layers.
message SDKRetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated int64 object_group_ids = 3;
  repeated int64 piece_ids = 4;
  bytes event_ipc_handle = 5;
}

message SDKRetrieveResponse {
  EventIpcHandleResult result = 1;
}

message SDKStoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated int64 object_group_ids = 3;
  repeated int64 piece_ids = 4;
  bytes event_ipc_handle = 5;
}

message SDKStoreResponse {
  EventIpcHandleResult result = 1;
}

service QStoreService {
  rpc RegisterQCache(RegisterKvCacheRequest) returns (RegisterKvCacheResponse);
  rpc UnregisterQCache(UnregisterKvCacheRequest)
      returns (UnregisterKvCacheResponse);
  rpc StoreQ(StoreRequest) returns (StoreResponse);
  rpc ReportQRingState(ReportQRingStateRequest)
      returns (ReportQRingStateResponse);
  rpc GetQRing(GetQRingRequest) returns (GetQRingResponse);
  rpc SDKRetrieve(SDKRetrieveRequest) returns (SDKRetrieveResponse);
  rpc SDKStore(SDKStoreRequest) returns (SDKStoreResponse);
}
