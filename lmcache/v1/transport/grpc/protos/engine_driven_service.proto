// Engine-driven transfer wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";

// Per-LMCache-group layout for multi-group (hybrid-KV) workers. Field order
// mirrors custom_types.GroupLayout: the structural codec matches positionally.
message GroupLayout {
  int64 num_layers = 1;
  int64 hidden_dim_size = 2;
  string dtype_str = 3;
  int64 tokens_per_block = 4;
  int64 num_physical_slots = 9;
  int64 window_tokens = 5;
  int64 kv_size = 6;
  int64 window_chunks = 7;
  bool recurrent = 8;
}

message RegisterKvCacheEngineDrivenContextRequest {
  int64 instance_id = 1;
  string model_name = 2;
  int64 world_size = 3;
  int64 block_size = 4;
  int64 num_layers = 5;
  int64 hidden_dim_size = 6;
  string dtype_str = 7;
  bool use_mla = 8;
  int64 chunk_size = 11;
  int64 num_physical_slots = 9;
  repeated GroupLayout group_layouts = 10;
  optional int64 worker_id = 12;
}

message RegisterKvCacheEngineDrivenContextResponse {
  string shm_name = 1;
  int64 pool_size = 2;
  int64 null_block_id = 3;
}

message UnregisterKvCacheEngineDrivenContextRequest {
  int64 instance_id = 1;
}

message UnregisterKvCacheEngineDrivenContextResponse {}

// Chunk positions of one LMCache group (e.g. the all-null chunks a worker
// will not store).
message ChunkIndexList {
  repeated int64 indices = 1;
}

message PrepareStoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  repeated ChunkIndexList skipped_chunks = 3;
}

message PrepareStoreResponse {
  bytes encoded_context = 1;
}

// chunk_start/chunk_count select one page of the key's chunks; chunk_count 0
// means through the last chunk, so 0/0 is the whole range.
message CommitStoreRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  bytes data = 3;
  int64 chunk_start = 4;
  int64 chunk_count = 5;
}

message CommitStoreResponse {
  bool success = 1;
}

message PrepareRetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  int64 chunk_start = 3;
  int64 chunk_count = 4;
}

message PrepareRetrieveResponse {
  bool success = 1;
  bytes data = 2;
  bytes encoded_context = 3;
}

message CommitRetrieveRequest {
  IpcCacheServerKey key = 1;
  int64 instance_id = 2;
  bool failed = 3;
}

message CommitRetrieveResponse {
  bool success = 1;
}

service EngineDrivenService {
  rpc RegisterKvCacheEngineDrivenContext(
      RegisterKvCacheEngineDrivenContextRequest)
      returns (RegisterKvCacheEngineDrivenContextResponse);
  rpc UnregisterKvCacheEngineDrivenContext(
      UnregisterKvCacheEngineDrivenContextRequest)
      returns (UnregisterKvCacheEngineDrivenContextResponse);
  rpc PrepareStore(PrepareStoreRequest) returns (PrepareStoreResponse);
  rpc CommitStore(CommitStoreRequest) returns (CommitStoreResponse);
  rpc PrepareRetrieve(PrepareRetrieveRequest) returns (PrepareRetrieveResponse);
  rpc CommitRetrieve(CommitRetrieveRequest) returns (CommitRetrieveResponse);
}
