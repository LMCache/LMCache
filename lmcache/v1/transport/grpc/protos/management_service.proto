//
// ManagementService wire contract for LMCache mp-mode gRPC.
//
// Backs modules/management.py (ManagementModule): engine administration and
// utility RPCs -- cache clearing, worker liveness pings, chunk-size and
// experimental-feature queries, plus debug and observability reporting.
// Keep one service per server module; see docs/design/v1/multiprocess.

syntax = "proto3";

package lmcache.mp;

message ClearRequest {
  optional bool force = 1;
}

message ClearResponse {}

message GetChunkSizeRequest {}

message GetChunkSizeResponse {
  int64 chunk_size = 1;
}

message NegotiateChunkSizeRequest {
  int64 required_chunk_alignment = 1;
}

message NegotiateChunkSizeResponse {
  int64 chunk_size = 1;
}

message GetExperimentalRequest {}

message GetExperimentalResponse {
  repeated string names = 1;
}

message NoopRequest {}

message NoopResponse {
  string message = 1;
}

message PingRequest {
  optional int64 instance_id = 1;
}

message PingResponse {
  bool ok = 1;
}

message BlockAllocationRecord {
  string req_id = 1;
  repeated int64 new_block_ids = 2;
  repeated int64 new_token_ids = 3;
}

message ReportBlockAllocationRequest {
  int64 instance_id = 1;
  string model_name = 2;
  repeated BlockAllocationRecord records = 3;
}

message ReportBlockAllocationResponse {}

message RequestSnapshotEntry {
  string request_id = 1;
  repeated int64 token_ids = 2;
  int64 priority = 3;
  double arrival_time = 4;
  string status = 5;
}

message RequestSnapshot {
  string scheduler_id = 1;
  int64 sequence = 2;
  string model_name = 3;
  string scheduling_policy = 4;
  repeated RequestSnapshotEntry requests = 5;
}

message ReportRequestSnapshotRequest {
  RequestSnapshot snapshot = 1;
}

message ReportRequestSnapshotResponse {}

service ManagementService {
  rpc Clear(ClearRequest) returns (ClearResponse);
  rpc GetChunkSize(GetChunkSizeRequest) returns (GetChunkSizeResponse);
  rpc NegotiateChunkSize(NegotiateChunkSizeRequest)
      returns (NegotiateChunkSizeResponse);
  rpc GetExperimental(GetExperimentalRequest) returns (GetExperimentalResponse);
  rpc Noop(NoopRequest) returns (NoopResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ReportBlockAllocation(ReportBlockAllocationRequest)
      returns (ReportBlockAllocationResponse);
  rpc ReportRequestSnapshot(ReportRequestSnapshotRequest)
      returns (ReportRequestSnapshotResponse);
}
