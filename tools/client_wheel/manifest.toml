# Sources of the lmcache-client wheel, read through scope.py. Paths are
# relative to the repository root; a trailing "/" covers every tracked file
# below it. Ownership rules: docs/design/v1/package_boundaries.md.
#
# trees and files are what the wheel ships. [[exclude]] takes shared files back
# out and always wins over them; each entry says why and who removes it. deny
# marks server areas: a selected file there fails the build unless it is a
# compat shim or, with --boundary transitional, a transitional file.

# Client-owned boundary packages and the platform vertical, included whole.
trees = [
    "lmcache/v1/client/",
    "lmcache/v1/common/",
    "lmcache/v1/platform/",
    "lmcache/v1/transport/",
]

# Shared helpers outside the boundary packages, the SDK and the integrations.
files = [
    "lmcache/__init__.py",
    "lmcache/banner.py",
    "lmcache/lmcache_native.pyi",
    "lmcache/logging.py",
    "lmcache/security/__init__.py",
    "lmcache/security/api_key.py",
    # Leaves once #6573 moves the bearer helpers out of the Starlette module.
    "lmcache/security/http.py",
    "lmcache/utils.py",
    "lmcache/v1/__init__.py",
    "lmcache/v1/exceptions/__init__.py",
    "lmcache/v1/kv_layer_groups.py",
    "lmcache/v1/memory_management.py",
    "lmcache/v1/mp_observability/errors.py",
    "lmcache/v1/mp_observability/event.py",
    "lmcache/v1/mp_observability/event_bus.py",
    "lmcache/v1/mp_observability/otel_init.py",
    "lmcache/v1/periodic_thread.py",
    "lmcache/v1/system_detection.py",
    "lmcache/v1/utils/__init__.py",
    "lmcache/v1/utils/frozen_dict.py",
    "lmcache/v1/utils/subclass_discovery.py",
    # SDK
    "lmcache/sdk/",
    "lmcache/cli/__init__.py",
    "lmcache/cli/metrics/",
    # Engine integrations
    "lmcache/integration/__init__.py",
    "lmcache/integration/atom/",
    "lmcache/integration/request_telemetry/",
    "lmcache/integration/sglang/",
    "lmcache/integration/tensorrt_llm/",
    "lmcache/integration/vllm/",
]

# Server areas. Their files enter the wheel only as compat_shims or, with
# --boundary transitional, as transitional entries.
deny = [
    "lmcache/cli/commands/",
    "lmcache/cli/main.py",
    "lmcache/lmcache_frontend/",
    "lmcache/v1/distributed/",
    "lmcache/v1/gpu_connector/",
    "lmcache/v1/memory_allocators/",
    "lmcache/v1/memory_orchestrator/",
    "lmcache/v1/mp_coordinator/",
    "lmcache/v1/multiprocess/",
]

# Non-package inputs of the staged build.
build_inputs = [
    "LICENSE",
    "README.md",
    "csrc/cuda/",
    "csrc/engine_kv_format.h",
    "csrc/kv_transfer_plan_types.h",
    "csrc/kv_transfer_types.h",
    "csrc/lmcache_native/",
    "setup_extensions/",
]

# Native extensions setup.py may put in the wheel.
native_allow = ["lmcache.lmcache_native", "lmcache.cuda_ops"]

# Legacy paths engines import at runtime; they may only re-export.
[[compat_shims]]
path = "lmcache/v1/multiprocess/__init__.py"
callers = "package of the custom_types and group_view paths imported by vLLM and ATOM"

[[compat_shims]]
path = "lmcache/v1/multiprocess/group_view.py"
callers = "ROCm/ATOM atom/kv_transfer/offload/mp/{worker,native_state_layout}.py import EngineGroupInfo"

# Shared files the client does not ship yet; trees and files cannot select them.
[[exclude]]
owner = "#6310"
reason = "only the MP server calls create_cache_context; the cuda and musa ones import gpu_connector.gds_context, which pulls in lmcache/v1/distributed"
paths = [
    "lmcache/v1/platform/base/cache_context.py",
    "lmcache/v1/platform/cache_context.py",
    "lmcache/v1/platform/devices/cpu/cache_context.py",
    "lmcache/v1/platform/devices/cuda/cache_context.py",
    "lmcache/v1/platform/devices/musa/cache_context.py",
    "lmcache/v1/platform/devices/npu/cache_context.py",
]

# Server files the client closure still needs; built only with
# --boundary transitional. Each group names the change that removes it.
[[transitional]]
owner = "#6309 (#6541)"
reason = "msgpack codec of the ZMQ transport; then a compat shim for vLLM's BlockAllocationRecord import"
paths = ["lmcache/v1/multiprocess/custom_types.py"]

[[transitional]]
owner = "#6308"
reason = "RequestClient"
paths = [
    "lmcache/v1/multiprocess/transport/__init__.py",
    "lmcache/v1/multiprocess/transport/base.py",
]

[[transitional]]
owner = "#6309"
reason = "client/transport/zmq_impl/mq_client.py imports the ZMQ codec table"
paths = [
    "lmcache/v1/multiprocess/affinity_pool.py",
    "lmcache/v1/multiprocess/request_handler.py",
    "lmcache/v1/multiprocess/transport/zmq_impl/__init__.py",
    "lmcache/v1/multiprocess/transport/zmq_impl/mq.py",
]

[[transitional]]
owner = "#6307 (#6509, #6481)"
reason = "MemoryLayoutDesc; ObjectKey through multiprocess/transport/base.py"
paths = ["lmcache/v1/distributed/api.py"]

[[transitional]]
owner = "#6307 (#6509)"
reason = "client/transfer_context/base.py lazily imports recalculate_blocks_to_skip"
paths = [
    "lmcache/v1/distributed/bitmap_ops/__init__.py",
    "lmcache/v1/distributed/bitmap_ops/fold.py",
    "lmcache/v1/distributed/config.py",
    "lmcache/v1/distributed/error.py",
    "lmcache/v1/distributed/eviction.py",
    "lmcache/v1/distributed/eviction_policy/__init__.py",
    "lmcache/v1/distributed/eviction_policy/arc.py",
    "lmcache/v1/distributed/eviction_policy/factory.py",
    "lmcache/v1/distributed/eviction_policy/isolated_lru.py",
    "lmcache/v1/distributed/eviction_policy/lru.py",
    "lmcache/v1/distributed/eviction_policy/noop.py",
    "lmcache/v1/distributed/internal_api.py",
    "lmcache/v1/distributed/key_codec.py",
    "lmcache/v1/distributed/l2_adapters/__init__.py",
    "lmcache/v1/distributed/l2_adapters/base.py",
    "lmcache/v1/distributed/l2_adapters/config.py",
    "lmcache/v1/distributed/l2_adapters/factory.py",
    "lmcache/v1/distributed/serde/__init__.py",
    "lmcache/v1/distributed/serde/aesgcm.py",
    "lmcache/v1/distributed/serde/async_processor.py",
    "lmcache/v1/distributed/serde/base.py",
    "lmcache/v1/distributed/serde/factory.py",
    "lmcache/v1/distributed/serde/fp8.py",
    "lmcache/v1/distributed/serde/key_provider.py",
    "lmcache/v1/distributed/serde/multi.py",
    "lmcache/v1/distributed/serde/turboquant/__init__.py",
    "lmcache/v1/distributed/serde/turboquant/decode_kernel.py",
    "lmcache/v1/distributed/serde/turboquant/store_kernel.py",
    "lmcache/v1/distributed/serde/turboquant/turboquant.py",
    "lmcache/v1/distributed/serde/utils.py",
    "lmcache/v1/distributed/storage_controller.py",
    "lmcache/v1/distributed/storage_controllers/__init__.py",
    "lmcache/v1/distributed/storage_controllers/adapter_lifecycle.py",
    "lmcache/v1/distributed/storage_controllers/eviction_controller.py",
    "lmcache/v1/distributed/storage_controllers/prefetch_controller.py",
    "lmcache/v1/distributed/storage_controllers/prefetch_policy.py",
    "lmcache/v1/distributed/storage_controllers/store_controller.py",
    "lmcache/v1/distributed/storage_controllers/store_policy.py",
    "lmcache/v1/distributed/storage_controllers/utils.py",
    "lmcache/v1/gpu_connector/__init__.py",
    "lmcache/v1/gpu_connector/_gds_backends.py",
    "lmcache/v1/gpu_connector/gds_backends/__init__.py",
    "lmcache/v1/gpu_connector/gds_backends/_driver.py",
    "lmcache/v1/gpu_connector/gds_backends/base.py",
    "lmcache/v1/gpu_connector/gds_context.py",
    "lmcache/v1/gpu_connector/gpu_ops.py",
    "lmcache/v1/memory_allocators/__init__.py",
    "lmcache/v1/memory_allocators/lazy_memory_allocator.py",
    "lmcache/v1/memory_allocators/tensor_memory_allocator.py",
    "lmcache/v1/mp_coordinator/__init__.py",
    "lmcache/v1/mp_coordinator/persistence/__init__.py",
    "lmcache/v1/mp_coordinator/persistence/durable_component.py",
    "lmcache/v1/mp_coordinator/utils/__init__.py",
    "lmcache/v1/mp_coordinator/utils/encoding.py",
    "lmcache/v1/multiprocess/object_group_transfer.py",
    "lmcache/v1/platform/base/cache_context.py",
]
