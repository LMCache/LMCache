# Sources of the lmcache-client wheel, read by build.py. Paths are relative to
# the repository root; a trailing "/" covers every tracked file below it.
# Ownership rules: docs/design/v1/package_boundaries.md.

# Client-owned boundary packages, included whole.
trees = [
    "lmcache/v1/client/",
    "lmcache/v1/common/",
    "lmcache/v1/transport/",
]

# The platform vertical minus server_only_hooks.
platform = "lmcache/v1/platform/"

# Called only by the MP server. Nine TYPE_CHECKING or lazy imports in platform
# still point at them; #6310 owns those edges.
server_only_hooks = [
    "lmcache/v1/platform/base/cache_context.py",
    "lmcache/v1/platform/cache_context.py",
    "lmcache/v1/platform/devices/cpu/cache_context.py",
    "lmcache/v1/platform/devices/cuda/cache_context.py",
    "lmcache/v1/platform/devices/musa/cache_context.py",
    "lmcache/v1/platform/devices/npu/cache_context.py",
]

# Shared helpers outside the boundary packages, the SDK and the integrations.
files = [
    "lmcache/__init__.py",
    "lmcache/banner.py",
    "lmcache/cli/__init__.py",
    "lmcache/cli/metrics/__init__.py",
