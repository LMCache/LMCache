[package]
name = "lmcache_rust_raw_block_io"
version = "0.0.1"
edition = "2021"

[lib]
name = "lmcache_rust_raw_block_io"
crate-type = ["cdylib"]

[features]
# Disable extension-module for cargo test so test binaries link to libpython.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.24"
libc = "0.2"
io-uring = "0.7"
