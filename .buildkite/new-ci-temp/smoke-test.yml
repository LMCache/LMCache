steps:
  - label: ":smoke: 1-GPU smoke test"
    agents:
      queue: "yotta-labs-1-gpu"
    command: |
      echo "=== Agent Info ==="
      hostname
      echo "Queue: $$BUILDKITE_AGENT_META_DATA_QUEUE"
      echo ""
      echo "=== GPU Check ==="
      nvidia-smi
      echo ""
      echo "=== GPU Count ==="
      nvidia-smi -L
      GPU_COUNT=$$(nvidia-smi -L | wc -l)
      echo "GPUs visible: $$GPU_COUNT"
      if [ "$$GPU_COUNT" -ne 1 ]; then
        echo "FAIL: Expected 1 GPU, got $$GPU_COUNT"
        exit 1
      fi
      echo "PASS: 1-GPU agent sees exactly 1 GPU"
    timeout_in_minutes: 5

  - label: ":smoke: 2-GPU smoke test"
    agents:
      queue: "yotta-labs-2-gpus"
    command: |
      echo "=== Agent Info ==="
      hostname
      echo "Queue: $$BUILDKITE_AGENT_META_DATA_QUEUE"
      echo ""
      echo "=== GPU Check ==="
      nvidia-smi
      echo ""
      echo "=== GPU Count ==="
      nvidia-smi -L
      GPU_COUNT=$$(nvidia-smi -L | wc -l)
      echo "GPUs visible: $$GPU_COUNT"
      if [ "$$GPU_COUNT" -ne 2 ]; then
        echo "FAIL: Expected 2 GPUs, got $$GPU_COUNT"
        exit 1
      fi
      echo "PASS: 2-GPU agent sees exactly 2 GPUs"
    timeout_in_minutes: 5

  - label: ":docker: Docker & PyTorch check (1-GPU)"
    agents:
      queue: "yotta-labs-1-gpu"
    command: |
      echo "=== Docker accessible? ==="
      docker info --format '{{.ServerVersion}}' || { echo "FAIL: docker not accessible"; exit 1; }
      echo ""
      echo "=== PyTorch + CUDA test (via Docker) ==="
      docker run --rm --gpus all nvcr.io/nvidia/pytorch:25.01-py3 python3 -c "
      import torch
      print('PyTorch version:', torch.__version__)
      print('CUDA available:', torch.cuda.is_available())
      print('GPU count:', torch.cuda.device_count())
      if torch.cuda.is_available():
          print('GPU name:', torch.cuda.get_device_name(0))
          x = torch.randn(100, 100, device='cuda')
          y = x @ x.T
          print('CUDA matmul OK, result shape:', y.shape)
          print('PASS')
      else:
          print('FAIL: CUDA not available')
          exit(1)
      "
    timeout_in_minutes: 10
