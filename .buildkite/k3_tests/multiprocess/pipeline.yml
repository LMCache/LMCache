# Multiprocess tests — one step per test, run in parallel.
# Each step gets its own K8s pod with the exact GPU count it needs.
# Tests are grouped by GPU requirement; the 2-GPU group is listed first so
# these heavier jobs get scheduled before 1-GPU jobs.
#   2-GPU: LMCache+vLLM on GPU 0, baseline on GPU 1 (or TP=2 across both).
#   1-GPU: LMCache+vLLM on GPU 0 only (no baseline server).

# Retry policy for known-flaky long-running multiprocess steps.
# Note: exit_status "*" matches 1-255 only; -1 (agent lost) needs a separate rule.
x-flaky-retry: &flaky-retry
  automatic:
    - exit_status: -1
      limit: 2
    - exit_status: "*"
      limit: 2

# Keep the regular 1-GPU pod anchor available after the two lm_eval steps are
# merged; engine_driven still needs its separate /dev/shm pod below.
# Every pod mounts a 1Gi /dev/shm: the container runtime default is 64MB and
# vLLM needs >160MB of shared memory. (The SHM-transport pods below mount a
# much larger dshm volume instead.)
x-pod-1gpu: &pod-1gpu
  containers:
    - name: container-0
      image: lmcache/ci-base:latest
      imagePullPolicy: Never
      resources: { limits: { "nvidia.com/gpu": "1" } }
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }

steps:
  # 4-GPU group. Runs on a PR labelled "dsv4", or on any build started with
  # RUN_DSV4_TEST=true.
  #
  # This is the only 4-GPU step in the suite -- every other step here takes one
  # or two -- and it runs 40+ min, so on a fleet whose nodes carry four GPUs it
  # holds a whole node for the length of the build, up to three times that
  # under the retry policy above, while the 1- and 2-GPU steps of every other
  # build queue behind it. Unconditional, it paid that toll on every
  # "mp"/"full"-labelled PR build and every dev push and became the suite's
  # head-of-line blocker. The conditions below move it to where the wait is
  # nobody else's problem: the "dsv4" label is how a PR touching the
  # hybrid-KV-group / slot-compression path opts in -- the same shape as the
  # "mp"/"full" labels that gate this pipeline, and it needs nothing but
  # GitHub write access. (Those labels still gate the build itself, so such a
  # PR carries "dsv4" alongside "mp".) RUN_DSV4_TEST=true is the same opt-in
  # for a manual build, where there is no PR to label.
  #
  # This leaves the step with no periodic run of its own: DeepSeek-V4-Flash
  # support is exercised when someone asks for it, not on a timer. That is
  # deliberate -- a 4-GPU node for 40+ minutes is too expensive to spend on a
  # schedule nobody is watching -- but it does mean a regression here surfaces
  # at the next opt-in build rather than the next morning.
  - group: ":compression: Multiprocess (4-GPU)"
    if: build.pull_request.labels includes "dsv4" || build.env("RUN_DSV4_TEST") == "true"
    steps:
      # L1 + slot-compression KV correctness for DeepSeek-V4-Flash (sparse-MLA
      # + fp8, TP=4). The model's KV cache groups mix block geometries
      # (tokens_per_block 256/64/8/4) and pack several logical tokens per
      # physical slot; the test stores one long request through LMCache's
      # slot-compression path, resets vLLM's local prefix cache (LMCache
      # preserved), re-sends the identical request now served from the L1 CPU
      # pool, and asserts the two greedy outputs are byte-identical. The 160GB
      # fp8 TP-shard load (plus the weight download on a cold hf-cache node)
      # needs the long timeout; the script logs a per-phase timing summary, so
      # a run that approaches it can be attributed from the log alone.
      - label: ":compression: dsv4_flash_tp"
        command: .buildkite/k3_tests/multiprocess/run.sh dsv4_flash_tp
        timeout_in_minutes: 90
        retry: *flaky-retry
        env:
          # Every JIT cache this step fills lives under one mount (see below),
          # named explicitly so none of them depends on what HOME happens to
          # be inside the image. DeepGEMM in particular is named rather than
          # left to default to VLLM_CACHE_ROOT/deep_gemm, which would mean
          # persisting all of /root/.cache/vllm -- the torch.compile cache and
          # the P2P-access probe results included -- for one subdirectory.
          # FlashInfer takes a base rather than a cache dir: it appends
          # .cache/flashinfer/<version>/<arch>/cached_ops to it itself.
          DG_JIT_CACHE_DIR: /root/.cache/jit/deep_gemm
          TRITON_CACHE_DIR: /root/.cache/jit/triton
          TILELANG_CACHE_DIR: /root/.cache/jit/tilelang
          FLASHINFER_WORKSPACE_BASE: /root/.cache/jit/flashinfer
          # Nobody publishes a DeepGEMM wheel, so the SM120 workaround in
          # the script builds one; cache it on the same mount so only the
          # first build on a node pays for it.
          DEEPGEMM_WHEEL_CACHE_DIR: /root/.cache/jit/deepgemm_wheel
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "4" } }
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: jit-cache, mountPath: /root/.cache/jit }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  # One mount for every JIT cache in this step's startup path,
                  # with each framework given its own subdirectory of it by the
                  # env vars above. DeepSeek-V4-Flash compiles through four of
                  # them -- DeepGEMM for the fp8 linears, MoE experts, prenorm
                  # GEMM and o_proj einsum, FlashInfer for the sampler and the
                  # fp8 blockscale GEMM, then Triton and TileLang -- and the
                  # pod's filesystem starts empty every run, so without this
                  # the step recompiles the whole set every time: measured
                  # locally, 685s of a 788s vLLM startup, against 103s with all
                  # four warm.
                  # Sharing them across builds is safe because each keys on
                  # something that changes when the toolchain does. DeepGEMM
                  # hashes the kernel source, the nvcc version and the compile
                  # flags, which carry the -gencode arch; FlashInfer puts its
                  # version and arch in the path; Triton's cache key hashes its
                  # own compiler and backend sources along with the kernel, the
                  # backend options and the env; TileLang namespaces its cache
                  # by its own version and the torch version. A new pin, a new
                  # CUDA or a different GPU arch lands on new keys rather than
                  # reusing an old cubin.
                  # Concurrency differs between them: DeepGEMM compiles into a
                  # temp dir and renames into place, which is already how it
                  # tolerates concurrent ranks on one cache, while FlashInfer
                  # builds in place and serialises concurrent builders on a
                  # per-module filelock -- they wait rather than each
                  # recompiling, and a build killed mid-link is left for ninja
                  # to redo on the next run.
                  # The script reports each cache's resolved path, writability
                  # and entry count before and after the run, so a mount that
                  # silently fails to take effect shows up in the log instead
                  # of just costing the compile time again.
                  - { name: jit-cache, hostPath: { path: /data/jit_cache, type: DirectoryOrCreate } }
                  # TP=4 NCCL + vLLM shared memory; the 1Gi used by the
                  # smaller pods is too tight for four ranks.
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (2-GPU)"
    if: build.env("VERIFY_AND_PIN_VLLM") !~ /true/
    steps:
      - label: ":compression: vllm_bench"
        command: .buildkite/k3_tests/multiprocess/run.sh vllm_bench
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-2gpu
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "2" } }
                    volumeMounts: &vol-mounts
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes: &vols
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
        artifact_paths: ["*.log"]

      - label: ":compression: long_doc_qa"
        command: .buildkite/k3_tests/multiprocess/run.sh long_doc_qa
        timeout_in_minutes: 30
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: long_doc_qa_l2"
        command: .buildkite/k3_tests/multiprocess/run.sh long_doc_qa_l2
        timeout_in_minutes: 30
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: deadlock"
        command: .buildkite/k3_tests/multiprocess/run.sh deadlock
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      # Two LMCache MP instances + two vLLM instances + one coordinator on a
      # single 2-GPU pod (localhost). Verifies engine B serves a long prompt's
      # KV from engine A over P2P.
      - label: ":compression: p2p"
        command: .buildkite/k3_tests/multiprocess/run.sh p2p
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      # Cross-TP-rank KV correctness for a hybrid MLA + linear-attention model.
      # Launches Kimi-Linear with TP=2 (both GPUs) + LMCache, sends one long
      # request to populate LMCache, restarts vLLM (LMCache server kept alive),
      # re-sends the identical request now served by LMCache, and asserts the
      # two outputs are byte-identical. A broken cross-rank restore (see
      # utils.py::mla_only) hands non-zero ranks rank 0's mamba shard and
      # diverges the output. Two 48B loads (cold + post-restart) need the long
      # timeout.
      - label: ":compression: kimi_linear_tp"
        command: .buildkite/k3_tests/multiprocess/run.sh kimi_linear_tp
        timeout_in_minutes: 60
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (1-GPU)"
    if: build.env("VERIFY_AND_PIN_VLLM") !~ /true/
    steps:
      # Correctness coverage for both transfer modes. engine_driven requires
      # SHM transport, so both matrix jobs use the existing dshm pod spec.
      - label: ":compression: lm_eval_{{matrix.mode}}"
        command: |
          case "{{matrix.mode}}" in
            lmcache_driven) ;;
            engine_driven)
              export LMCACHE_MP_TRANSFER_MODE="engine_driven"
              export L1_USE_LAZY="false"
              export CPU_BUFFER_SIZE="80"
              ;;
          esac
          .buildkite/k3_tests/multiprocess/run.sh lm_eval
        matrix:
          setup:
            mode:
              - "lmcache_driven"
              - "engine_driven"
        timeout_in_minutes: 30
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-1gpu-dshm
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "1" } }
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }
        artifact_paths: ["*.log"]

      # Preemption correctness: GPU_MEMORY_UTILIZATION=0.4 forces the KV cache
      # pool small enough that vLLM preempts in-flight requests under concurrent
      # lm_eval load. Both steps reuse the same run.sh lm_eval_preemption
      # command; env vars select the transfer mode. Checks: no crash, score
      # drift < 0.01, preemption actually occurred, score >= SCORE_MIN.
      - label: ":compression: lm_eval_preemption / {{matrix.mode}}"
        command: |
          case "{{matrix.mode}}" in
            lmcache_driven) ;;
            engine_driven)
              export LMCACHE_MP_TRANSFER_MODE="engine_driven"
              export L1_USE_LAZY="false"
              ;;
          esac
          .buildkite/k3_tests/multiprocess/run.sh lm_eval_preemption
        matrix:
          setup:
            mode:
              - "lmcache_driven"
              - "engine_driven"
        timeout_in_minutes: 30
        env:
          GPU_MEMORY_UTILIZATION: "0.4"
          NUM_CONCURRENT: "256"
          MAX_MODEL_LEN: "4096"
          MAX_WAIT_SECONDS: "600"
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu-dshm } }]
        artifact_paths: ["*.log"]

      # Temporarily disabled: hma_lm_eval_gemma4.

      - label: ":compression: fault_tolerance"
        command: .buildkite/k3_tests/multiprocess/run.sh fault_tolerance
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: restart_recovery"
        command: .buildkite/k3_tests/multiprocess/run.sh restart_recovery
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: cache_stats"
        command: .buildkite/k3_tests/multiprocess/run.sh cache_stats
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      # Real GPU MP integration: vLLM is launched with FIFO lazy offload
      # (threshold=2, select_count=1). Three requests verify that the first
      # two remain pending and the third drains the first request.
      - label: ":compression: lazy_offload"
        command: .buildkite/k3_tests/multiprocess/run.sh lazy_offload
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: http_api"
        command: .buildkite/k3_tests/multiprocess/run.sh http_api
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: gds_smoke_test"
        command: .buildkite/k3_tests/multiprocess/run.sh gds_smoke_test
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "1" } }
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: scratch, mountPath: /scratch }
                      - { name: udev, mountPath: /run/udev, readOnly: true }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: scratch, hostPath: { path: /data/gds-scratch, type: DirectoryOrCreate } }
                  - { name: udev, hostPath: { path: /run/udev, type: Directory } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (CPU-only)"
    if: build.env("VERIFY_AND_PIN_VLLM") !~ /true/
    steps:
      # Note: LMCACHE_SHM_NAME uses `${VAR-default}` (not `:-`) in the
      # runner script, so an empty string ("") is meaningful and differs
      # from unset. `__default__` is the sentinel meaning "shm mode".
      - label: ":compression: cpu_e2e_validation ({{matrix.mode}})"
        # matrix.adjustments does not support `env:` in Buildkite. Instead
        # we branch on {{matrix.mode}} inside the command to set the
        # per-mode env before invoking the shared runner script.
        command: |
          case "{{matrix.mode}}" in
            shm) ;;  # rely on script defaults (engine-driven + shm transport)
            pickle) export LMCACHE_SHM_NAME="" ;;
            server_copy) export LMCACHE_MP_TRANSFER_MODE="lmcache_driven" ;;
          esac
          bash .github/scripts/run-cpu-e2e-validation.sh
        matrix:
          setup:
            mode:
              - "shm"
              - "pickle"
              - "server_copy"
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources:
                      requests:
                        cpu: "8"
                        memory: "256Gi"
                      limits:
                        cpu: "8"
                        memory: "256Gi"
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }

  # Canary path for VERIFY_AND_PIN_VLLM=true: skips every real test group
  # above (each group's `if` evaluates to false) and instead runs a single
  # vllm_bench step that proves the freshly-installed vLLM nightly works
  # with LMCache. On success, the verified vllm wheel version is pushed to
  # the `buildkite_latest_tested_vllm` branch so downstream builds can pin
  # to a known-good nightly instead of resolving "latest" again.
  - label: ":pushpin: Verify & pin vLLM nightly"
    if: build.env("VERIFY_AND_PIN_VLLM") =~ /true/
    command: |
      .buildkite/k3_tests/multiprocess/run.sh vllm_bench
      bash .github/scripts/pin-tested-vllm.sh
    timeout_in_minutes: 30
    agents: { queue: "k8s" }
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                resources: { limits: { "nvidia.com/gpu": "2" } }
                env:
                  - name: GITHUB_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: buildkite-git-creds
                        key: GITHUB_TOKEN
                volumeMounts:
                  - { name: hf-cache, mountPath: /root/.cache/huggingface }
                  - { name: dshm, mountPath: /dev/shm }
            volumes:
              - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
              - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
    artifact_paths: ["*.log"]
