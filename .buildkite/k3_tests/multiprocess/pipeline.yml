steps:
  - label: ":test_tube: cu132 compatibility + vLLM serving canary"
    command: .buildkite/k3_tests/multiprocess/run.sh vllm_bench
    env:
      INFERENCE_ENGINE: vllm
      LMCACHE_REQUEST_TRANSPORT: zmq
      LAUNCH_BASELINE: "false"
      GPU_FOR_VLLM: "0"
      GPU_FOR_BASELINE: "0"
      MAX_JOBS: "1"
    timeout_in_minutes: 45
    agents: {queue: k8s}
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                resources: {limits: {"nvidia.com/gpu": "1"}}
                volumeMounts:
                  - {name: hf-cache, mountPath: /root/.cache/huggingface}
                  - {name: dshm, mountPath: /dev/shm}
            volumes:
              - {name: hf-cache, hostPath: {path: /data/huggingface, type: DirectoryOrCreate}}
              - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
    artifact_paths: ["*.log", "*.json"]
