# Multiprocess tests — one step per test, run in parallel.
# Each step gets its own K8s pod with the exact GPU count it needs.
# Tests are grouped by GPU requirement; the 2-GPU group is listed first so
# these heavier jobs get scheduled before 1-GPU jobs.
#   2-GPU: LMCache+vLLM on GPU 0, baseline on GPU 1 (or TP=2 across both).
#   1-GPU: LMCache+vLLM on GPU 0 only (no baseline server).

steps:
  - group: ":compression: Multiprocess (2-GPU)"
    steps:
      - label: ":compression: vllm_bench"
        command: .buildkite/k3_tests/multiprocess/run.sh vllm_bench
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-2gpu
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "2" } }
                    volumeMounts: &vol-mounts
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                volumes: &vols
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
        artifact_paths: ["*.log"]

      - label: ":compression: long_doc_qa"
        command: .buildkite/k3_tests/multiprocess/run.sh long_doc_qa
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: long_doc_qa_l2"
        command: .buildkite/k3_tests/multiprocess/run.sh long_doc_qa_l2
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: deadlock"
        command: .buildkite/k3_tests/multiprocess/run.sh deadlock
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (1-GPU)"
    steps:
      - label: ":compression: lm_eval"
        command: .buildkite/k3_tests/multiprocess/run.sh lm_eval
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-1gpu
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "1" } }
                    volumeMounts: *vol-mounts
                volumes: *vols
        artifact_paths: ["*.log"]

      # HMA correctness check on google/gemma-4-31B-it (a hybrid model whose KV
      # cache groups get different block sizes). Runs gsm8k, resets vLLM's prefix
      # cache (LMCache preserved), reruns served by LMCache, and asserts the two
      # runs' scores match. Single GPU, no baseline.
      - label: ":compression: hma_lm_eval_gemma4"
        command: .buildkite/k3_tests/multiprocess/run.sh hma_lm_eval_gemma4
        timeout_in_minutes: 60
        env:
          MODEL: "google/gemma-4-31B-it"
          # Require an exact score match between the two runs.
          SCORE_TOLERANCE: "0"
          ATTENTION_BACKEND: "auto"
          GPU_MEMORY_UTILIZATION: "0.85"
          # 31B load + CUDA-graph capture is slow; raise the readiness timeout
          # above the 300s default.
          MAX_WAIT_SECONDS: "600"
          # Cap samples and enlarge the CPU pool so the retrieve run stays
          # cache-served (31B's per-token KV is large).
          LIMIT: "100"
          CPU_BUFFER_SIZE: "200"
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: fault_tolerance"
        command: .buildkite/k3_tests/multiprocess/run.sh fault_tolerance
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: restart_recovery"
        command: .buildkite/k3_tests/multiprocess/run.sh restart_recovery
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: cache_stats"
        command: .buildkite/k3_tests/multiprocess/run.sh cache_stats
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: http_api"
        command: .buildkite/k3_tests/multiprocess/run.sh http_api
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (8-GPU)"
    steps:
      # HMA correctness check on deepseek-ai/DeepSeek-V4-Flash, a hybrid MLA
      # model (~256B fp8 MoE) whose KV cache groups declare per-group compress
      # ratios of 4 and 128 -- the path this PR's tokens/slots-per-chunk
      # handling drives. Too large for one GPU, so it runs tensor-parallel
      # across 8 with kv_cache_dtype=fp8_ds_mla. FlashMLA-Sparse does not
      # implement batch invariance, so it disables it and score-matches the two
      # runs within a small tolerance (a corrupted-KV regression tanks gsm8k
      # far beyond that). Same flow as gemma4: gsm8k, reset vLLM's prefix cache
      # (LMCache preserved), rerun served by LMCache, assert the scores match.
      - label: ":compression: hma_lm_eval_dsv4_flash"
        command: .buildkite/k3_tests/multiprocess/run.sh hma_lm_eval_dsv4_flash
        timeout_in_minutes: 60
        env:
          MODEL: "deepseek-ai/DeepSeek-V4-Flash"
          TENSOR_PARALLEL_SIZE: "8"
          # The fp8 fused-expert weights only register their weight-scale
          # params under expert parallelism (TP-only KeyErrors on load).
          ENABLE_EXPERT_PARALLEL: "true"
          KV_CACHE_DTYPE: "fp8_ds_mla"
          # 8 TP workers register many KV tensors at once; the 10s default
          # register_kv_caches timeout is too short for this model.
          MQ_TIMEOUT: "120"
          # DSV4-Flash needs its custom tokenizer + remote code; the fp8 MoE
          # expert weights need the DeepGEMM fp8 kernel installed in the image.
          # (Tool/reasoning-parser flags from the official recipe are omitted:
          # lm_eval drives plain /v1/completions.)
          EXTRA_VLLM_ARGS: "--trust-remote-code --tokenizer-mode deepseek_v4"
          # FlashMLA-Sparse has no batch-invariant kernels; compare with a
          # tolerance rather than requiring a bit-exact match.
          VLLM_BATCH_INVARIANT: "0"
          SCORE_TOLERANCE: "0.05"
          # vLLM auto-selects FlashMLA-Sparse for the fp8 MLA layout; do not
          # pin FLASH_ATTN.
          ATTENTION_BACKEND: "auto"
          # ~160GB of fp8 weights load across 8 GPUs + CUDA-graph capture is
          # slow; raise the readiness timeout above the 300s default.
          MAX_WAIT_SECONDS: "900"
          LIMIT: "100"
          CPU_BUFFER_SIZE: "100"
          MAX_WORKERS: "8"
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "8" } }
                    volumeMounts: *vol-mounts
                volumes: *vols
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (CPU-only)"
    steps:
      - label: ":compression: cpu_e2e_validation (shm)"
        command: bash .buildkite/k3_tests/multiprocess/scripts/run-cpu-e2e-validation.sh
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources:
                      requests:
                        cpu: "8"
                        memory: "256Gi"
                      limits:
                        cpu: "8"
                        memory: "256Gi"
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }

      - label: ":compression: cpu_e2e_validation (pickle)"
        command: bash .buildkite/k3_tests/multiprocess/scripts/run-cpu-e2e-validation.sh
        env:
          LMCACHE_SHM_NAME: ""
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources:
                      requests:
                        cpu: "8"
                        memory: "256Gi"
                      limits:
                        cpu: "8"
                        memory: "256Gi"
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }

      - label: ":compression: cpu_e2e_validation (server-side copy)"
        command: bash .buildkite/k3_tests/multiprocess/scripts/run-cpu-e2e-validation.sh
        env:
          LMCACHE_MP_TRANSFER_MODE: "handle"
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources:
                      requests:
                        cpu: "8"
                        memory: "256Gi"
                      limits:
                        cpu: "8"
                        memory: "256Gi"
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
