# Multiprocess lm_eval tests. Each matrix entry runs in its own 1-GPU pod.

# Retry policy for known-flaky long-running multiprocess steps.
# Note: exit_status "*" matches 1-255 only; -1 (agent lost) needs a separate rule.
x-flaky-retry: &flaky-retry
  automatic:
    - exit_status: -1
      limit: 2
    - exit_status: "*"
      limit: 2

# Both transfer modes need the larger shared-memory volume: engine_driven uses
# SHM transport and vLLM needs more than the runtime's 64MB default.
x-pod-1gpu-dshm: &pod-1gpu-dshm
  containers:
    - name: container-0
      image: lmcache/ci-base:latest
      imagePullPolicy: Never
      resources: { limits: { "nvidia.com/gpu": "1" } }
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }

steps:
  - group: ":compression: Multiprocess lm_eval"
    if: build.env("VERIFY_AND_PIN_VLLM") !~ /true/
    steps:
      # Correctness coverage for both transfer modes.
      - label: ":compression: lm_eval_{{matrix.mode}}"
        command: |
          case "{{matrix.mode}}" in
            lmcache_driven) ;;
            engine_driven)
              export LMCACHE_MP_TRANSFER_MODE="engine_driven"
              export L1_USE_LAZY="false"
              export CPU_BUFFER_SIZE="80"
              ;;
          esac
          .buildkite/k3_tests/multiprocess/run.sh lm_eval
        matrix:
          setup:
            mode:
              - "lmcache_driven"
              - "engine_driven"
        timeout_in_minutes: 30
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu-dshm } }]
        artifact_paths: ["*.log"]

      # Preemption correctness under concurrent lm_eval load.
      - label: ":compression: lm_eval_preemption / {{matrix.mode}}"
        command: |
          case "{{matrix.mode}}" in
            lmcache_driven) ;;
            engine_driven)
              export LMCACHE_MP_TRANSFER_MODE="engine_driven"
              export L1_USE_LAZY="false"
              ;;
          esac
          .buildkite/k3_tests/multiprocess/run.sh lm_eval_preemption
        matrix:
          setup:
            mode:
              - "lmcache_driven"
              - "engine_driven"
        timeout_in_minutes: 30
        env:
          GPU_MEMORY_UTILIZATION: "0.4"
          NUM_CONCURRENT: "256"
          MAX_MODEL_LEN: "4096"
          MAX_WAIT_SECONDS: "600"
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu-dshm } }]
        artifact_paths: ["*.log"]
