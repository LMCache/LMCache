# Multiprocess tests — one step per test, run in parallel.
# Each step gets its own K8s pod, launches its own servers, runs one test, cleans up.
# All steps need 2 GPUs (LMCache+vLLM on GPU 0, baseline on GPU 1).

steps:
  - group: ":compression: Multiprocess"
    steps:
      - label: ":compression: lm_eval"
        command: .buildkite/k3_tests/multiprocess/run.sh lm_eval
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-2gpu
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "2" } }
                    volumeMounts: &vol-mounts
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                volumes: &vols
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
        artifact_paths: ["*.log"]

      # HMA (hybrid memory allocator) correctness check on a real hybrid model.
      # openai/gpt-oss-20b interleaves sliding-window and full-attention layers,
      # so vLLM exposes multiple KV cache groups and the connector exercises the
      # hybrid-memory-allocator store/retrieve path. Runs gsm8k, resets vLLM's
      # local prefix cache (LMCache preserved), reruns, and asserts the scores
      # align. gpt-oss-20b is ungated, so the HF cache at /data/huggingface can
      # download it on demand (no token needed).
      - label: ":compression: hma_lm_eval"
        command: .buildkite/k3_tests/multiprocess/run.sh hma_lm_eval
        timeout_in_minutes: 40
        env: { MODEL: "openai/gpt-oss-20b" }
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: vllm_bench"
        command: .buildkite/k3_tests/multiprocess/run.sh vllm_bench
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: long_doc_qa"
        command: .buildkite/k3_tests/multiprocess/run.sh long_doc_qa
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: long_doc_qa_l2"
        command: .buildkite/k3_tests/multiprocess/run.sh long_doc_qa_l2
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: fault_tolerance"
        command: .buildkite/k3_tests/multiprocess/run.sh fault_tolerance
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: deadlock"
        command: .buildkite/k3_tests/multiprocess/run.sh deadlock
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      - label: ":compression: restart_recovery"
        command: .buildkite/k3_tests/multiprocess/run.sh restart_recovery
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]
