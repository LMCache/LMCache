# Multiprocess tests — one step per test, run in parallel.
# Each step gets its own K8s pod with the exact GPU count it needs.
# Tests are grouped by GPU requirement; the 2-GPU group is listed first so
# these heavier jobs get scheduled before 1-GPU jobs.
#   2-GPU: LMCache+vLLM on GPU 0, baseline on GPU 1 (or TP=2 across both).
#   1-GPU: LMCache+vLLM on GPU 0 only (no baseline server).

# Retry policy for known-flaky long-running multiprocess steps.
# Note: exit_status "*" matches 1-255 only; -1 (agent lost) needs a separate rule.
x-flaky-retry: &flaky-retry
  automatic:
    - exit_status: -1
      limit: 0
    - exit_status: "*"
      limit: 0

# The regular 2-GPU pod is used by the LMCache-driven Kimi test.
x-pod-2gpu: &pod-2gpu
  containers:
    - name: container-0
      image: lmcache/ci-base:latest
      imagePullPolicy: Never
      resources: { limits: { "nvidia.com/gpu": "2" } }
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }

# The regular 1-GPU pod is used by the LMCache-driven HMA test. Every pod
# mounts a 1Gi /dev/shm: the container runtime default is 64MB and vLLM needs
# >160MB of shared memory. The SHM-transport pods below mount a much larger
# dshm volume instead.
x-pod-1gpu: &pod-1gpu
  containers:
    - name: container-0
      image: lmcache/ci-base:latest
      imagePullPolicy: Never
      resources: { limits: { "nvidia.com/gpu": "1" } }
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }

steps:
  - group: ":compression: Multiprocess (2-GPU)"
    if: build.env("VERIFY_AND_PIN_VLLM") !~ /true/
    steps:
      # Cross-TP-rank KV correctness for a hybrid MLA + linear-attention model.
      # Launches Kimi-Linear with TP=2 (both GPUs) + LMCache, sends one long
      # request to populate LMCache, restarts vLLM (LMCache server kept alive),
      # re-sends the identical request now served by LMCache, and asserts the
      # two outputs are byte-identical. A broken cross-rank restore (see
      # utils.py::mla_only) hands non-zero ranks rank 0's mamba shard and
      # diverges the output. Two 48B loads (cold + post-restart) need the long
      # timeout.
      - label: ":compression: kimi_linear_tp"
        command: .buildkite/k3_tests/multiprocess/run.sh kimi_linear_tp
        timeout_in_minutes: 60
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu } }]
        artifact_paths: ["*.log"]

      # Exercise the Engine-driven transfer context with Kimi-Linear's
      # TP=2 hybrid MLA + linear-attention KV caches. The test's vLLM restart
      # forces the second request to restore the per-rank cache from LMCache.
      # Cover both engine-driven transports. Pickle skips L1 SHM allocation;
      # SHM maps the Kimi test's 80Gi L1 pool, so it uses the dedicated 128Gi
      # /dev/shm pod below.
      - label: ":electric_plug: kimi_linear_tp_engine_driven / {{matrix.transport}}"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export ENGINE_DRIVEN_TRANSPORT="{{matrix.transport}}"
          case "{{matrix.transport}}" in
            pickle)
              export L1_USE_LAZY="true"
              ;;
            shm)
              export L1_USE_LAZY="false"
              ;;
          esac
          .buildkite/k3_tests/multiprocess/run.sh kimi_linear_tp
        matrix:
          setup:
            transport:
              - "pickle"
              - "shm"
        timeout_in_minutes: 60
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-2gpu-dshm
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "2" } }
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }
        artifact_paths: ["*.log"]

      # DSV4 uses compressed KV groups and its native FP4 indexer cache. This
      # is LMCache-driven only: engine-driven compression remains unsupported.
      - label: ":compression: deepseek_v4_flash_tp_lmcache_driven"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="lmcache_driven"
          .buildkite/k3_tests/multiprocess/run.sh deepseek_v4_flash_tp
        timeout_in_minutes: 90
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-2gpu-dshm } }]
        artifact_paths: ["*.log"]

  - group: ":compression: Multiprocess (1-GPU)"
    if: build.env("VERIFY_AND_PIN_VLLM") !~ /true/
    steps:
      # HMA correctness check on google/gemma-4-31B-it (a hybrid model whose KV
      # cache groups get different block sizes). Runs gsm8k, resets vLLM's prefix
      # cache (LMCache preserved), reruns served by LMCache, and asserts the two
      # runs' scores match. Single GPU, no baseline.
      - label: ":compression: hma_lm_eval_gemma4"
        command: .buildkite/k3_tests/multiprocess/run.sh hma_lm_eval_gemma4
        timeout_in_minutes: 60
        retry: *flaky-retry
        env:
          MODEL: "google/gemma-4-31B-it"
          # Allow a small score difference between the two runs.
          SCORE_TOLERANCE: "0.03"
          ATTENTION_BACKEND: "auto"
          GPU_MEMORY_UTILIZATION: "0.85"
          # 31B load + CUDA-graph capture is slow; raise the readiness timeout
          # above the 300s default.
          MAX_WAIT_SECONDS: "600"
          # Cap samples and enlarge the CPU pool so the retrieve run stays
          # cache-served (31B's per-token KV is large).
          LIMIT: "100"
          CPU_BUFFER_SIZE: "200"
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      # Engine-driven HMA verifies both transport backends end-to-end. Both
      # matrix entries use the dshm pod: pickle remains lazy and ignores the
      # mount, while SHM disables lazy L1 allocation and maps the pool.
      - label: ":electric_plug: hma_lm_eval_gemma4_engine_driven / {{matrix.transport}}"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export ENGINE_DRIVEN_TRANSPORT="{{matrix.transport}}"
          case "{{matrix.transport}}" in
            pickle)
              export L1_USE_LAZY="true"
              # Pickle sends complete hybrid KV payloads through one MQ
              # connection. Limit this correctness-only job's request
              # concurrency so queued payloads do not exhaust the RPC budget;
              # the SHM matrix entry retains the regular 50-way stress load.
              export NUM_CONCURRENT="4"
              export LIMIT="30"
              export STORE_DRAIN_SECONDS="180"
              export LMCACHE_MQ_TIMEOUT="300"
              ;;
            shm)
              export L1_USE_LAZY="false"
              ;;
          esac
          .buildkite/k3_tests/multiprocess/run.sh hma_lm_eval_gemma4_engine_driven
        matrix:
          setup:
            transport:
              - "pickle"
              - "shm"
        timeout_in_minutes: 60
        retry: *flaky-retry
        env:
          MODEL: "google/gemma-4-31B-it"
          SCORE_TOLERANCE: "0.03"
          ATTENTION_BACKEND: "auto"
          GPU_MEMORY_UTILIZATION: "0.85"
          MAX_WAIT_SECONDS: "600"
          LIMIT: "100"
          CPU_BUFFER_SIZE: "80"
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec: &pod-1gpu-dshm
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources: { limits: { "nvidia.com/gpu": "1" } }
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }
        artifact_paths: ["*.log"]
