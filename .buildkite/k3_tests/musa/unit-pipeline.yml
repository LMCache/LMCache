# MUSA containerized unit tests.
# This pipeline mirrors the dedicated unit-tests-xpu Buildkite lane.

env:
  LMCACHE_TRACK_USAGE: "false"
  MUSA_VISIBLE_DEVICES: "0"

steps:
  - label: "MUSA Unit Tests (Serialized)"
    key: "musa_unit_tests"
    command: bash .buildkite/k3_tests/musa/run-in-container.sh unit
    timeout_in_minutes: 60
    concurrency: 1
    concurrency_group: "lmcache/musa-hardware-smoke"

    agents:
      queue: "MooreThreads"

    env:
      MUSA_CI_ARTIFACT_DIR: "musa-ci-artifacts/unit"

    artifact_paths:
      - "musa-ci-artifacts/unit/**/*"
