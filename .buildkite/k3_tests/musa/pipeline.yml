# MUSA bare-metal unit and hardware smoke tests.
# Queue routing remains in the maintainer-owned Buildkite pipeline settings.

env:
  LMCACHE_DEVICE_BACKEND: "musa"
  LMCACHE_TRACK_USAGE: "false"

steps:
  - label: "MUSA Unit Tests (Serialized)"
    key: "musa_unit_tests"
    command: bash "${BUILDKITE_BUILD_CHECKOUT_PATH:-.}/.buildkite/k3_tests/musa/run-unit-tests.sh"
    timeout_in_minutes: 60
    concurrency: 1
    concurrency_group: "lmcache/musa-hardware-smoke"

    env:
      MUSA_CI_ARTIFACT_DIR: "musa-ci-artifacts/unit"

    artifact_paths:
      - "musa-ci-artifacts/unit/**/*"

  - label: "MUSA Hardware Smoke"
    key: "musa_hardware_smoke"
    depends_on: "musa_unit_tests"
    command: bash "${BUILDKITE_BUILD_CHECKOUT_PATH:-.}/.buildkite/k3_tests/musa/run.sh"
    timeout_in_minutes: 60
    concurrency: 1
    concurrency_group: "lmcache/musa-hardware-smoke"

    env:
      MUSA_CI_ARTIFACT_DIR: "musa-ci-artifacts/smoke"

    artifact_paths:
      - "musa-ci-artifacts/smoke/**/*"
