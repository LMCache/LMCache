# MUSA hardware smoke plus serving E2E. Uploaded by musa-mp-test.
# The unit suite is in unittests/; serving scripts live in e2e/.

env:
  HF_HUB_OFFLINE: "1"
  LMCACHE_TRACK_USAGE: "false"
  MUSA_E2E_MODEL: "/models/Qwen3-0.6B"
  MUSA_E2E_ENABLE_SGLANG: "1"
  MUSA_SGLANG_MAX_TOTAL_TOKENS: "16384"
  MUSA_SGLANG_MEM_FRACTION_STATIC: "0.50"
  MUSA_VISIBLE_DEVICES: "0"
  TRANSFORMERS_OFFLINE: "1"

x-musa-hw: &musa-hw
  concurrency: 1
  concurrency_group: "lmcache/musa-hardware-smoke"
  agents: { queue: "MooreThreads" }

steps:
  - label: "MUSA Runtime + Transfer Smoke"
    <<: *musa-hw
    key: "musa_transfer_smoke"
    command: bash .buildkite/k3_tests/musa/multiprocess/run-in-container.sh smoke
    timeout_in_minutes: 60
    env:
      MUSA_CI_ARTIFACT_DIR: "musa-ci-artifacts/smoke"
      MUSA_MP_TEST_MODE: "lm_eval"
      LIMIT: "4"
      NUM_CONCURRENT: "2"
    artifact_paths:
      - "musa-ci-artifacts/smoke/**/*"

  - label: "MUSA vLLM E2E"
    <<: *musa-hw
    key: "musa_vllm_e2e"
    depends_on: "musa_transfer_smoke"
    command: bash .buildkite/k3_tests/musa/multiprocess/run-in-container.sh vllm-e2e
    timeout_in_minutes: 90
    env:
      MUSA_CI_ARTIFACT_DIR: "musa-ci-artifacts/vllm-e2e"
    artifact_paths:
      - "musa-ci-artifacts/vllm-e2e/**/*"

  - label: "MUSA SGLang E2E"
    <<: *musa-hw
    key: "musa_sglang_e2e"
    depends_on: "musa_transfer_smoke"
    command: bash .buildkite/k3_tests/musa/multiprocess/run-in-container.sh sglang-e2e
    timeout_in_minutes: 90
    env:
      MUSA_CI_ARTIFACT_DIR: "musa-ci-artifacts/sglang-e2e"
      MUSA_E2E_STARTUP_TIMEOUT: "900"
    artifact_paths:
      - "musa-ci-artifacts/sglang-e2e/**/*"
