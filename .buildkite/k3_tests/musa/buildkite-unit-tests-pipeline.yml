# Paste this into the unit-tests-musa Buildkite pipeline's "Steps" editor.
# It uploads the MUSA unit-test definition from the repo on the maintainer's
# MooreThreads queue.

agents:
  queue: "MooreThreads"

steps:
  - label: ":pipeline: Upload pipeline"
    command: bash .buildkite/k3_tests/common_scripts/upload-pipeline.sh .buildkite/k3_tests/musa/unit-pipeline.yml
