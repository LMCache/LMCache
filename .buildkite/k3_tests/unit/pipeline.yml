# Unit tests — runs pytest with coverage against LMCache source.
# No vLLM required; uses setup-lmcache-only-env.sh for a lighter install.

steps:
  - label: ":test_tube: Unit Tests"
    key: "unit_tests"
    command: .buildkite/k3_tests/unit/run.sh
    timeout_in_minutes: 60
    agents: { queue: "k8s" }
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                env:
                  - { name: CUDA_LAUNCH_BLOCKING, value: "1" }
                resources:
                  requests:
                    cpu: "32"
                    memory: "96Gi"
                  limits:
                    nvidia.com/gpu: "1"
                    cpu: "64"
                    memory: "200Gi"
                volumeMounts:
                  - { name: hf-cache, mountPath: /root/.cache/huggingface }
                  # K8s defaults /dev/shm to 64 MiB, which causes SIGBUS in
                  # Keep enough shared memory for allocator-heavy distributed tests.
                  # Mount a 16 GiB tmpfs to give shm tests headroom.
                  - { name: dshm, mountPath: /dev/shm }
            volumes:
              - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
              - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
    artifact_paths:
      - "durations/test.html"
      - "coverage-test.xml"
      - "coverage-test/**/*"
      - "junit-unit.xml"

  - wait: ~
    continue_on_failure: true
    if: build.pull_request.id != null

  - label: ":octagonal_sign: Fast-fail cancel sibling CI"
    if: build.pull_request.id != null
    soft_fail: true
    timeout_in_minutes: 5
    agents: { queue: "k8s" }
    command: |
      set -euo pipefail
      outcome="$(buildkite-agent step get outcome --step unit_tests || echo unknown)"
      if [[ "${outcome}" != "passed" ]]; then
        python3 .buildkite/scripts/fast_fail_cancel.py \
          --reason "Fast-fail: Buildkite k3-unit-tests (${outcome})"
      fi
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                env:
                  - name: GITHUB_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: buildkite-git-creds
                        key: GITHUB_TOKEN
