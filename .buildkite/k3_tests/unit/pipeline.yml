# Unit tests — runs pytest with coverage against LMCache source.
# No vLLM required; uses setup-lmcache-only-env.sh for a lighter install.

steps:
  # The GPU starts once GitHub Layer 1 passes and then runs in parallel with
  # Layer 2, which stops it if test.yml or cpu_device.yml fails. This CPU-only
  # pod waits for Layer 1 (and for a maintainer to approve a first-time fork
  # PR's GitHub run); non-PR builds pass straight through.
  - label: ":hourglass: Wait for GitHub Layer 1"
    command: python3 .buildkite/k3_tests/common_scripts/github_ci_gate.py wait-l1
    timeout_in_minutes: 240
    agents: { queue: "k8s" }
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                env:
                  - name: GITHUB_API_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: github-api-readonly
                        key: token

  - wait

  - label: ":test_tube: Unit Tests"
    command: bash .buildkite/k3_tests/common_scripts/run-gpu-with-l2-watch.sh .buildkite/k3_tests/unit/run.sh
    timeout_in_minutes: 60
    agents: { queue: "k8s" }
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                env:
                  - { name: CUDA_LAUNCH_BLOCKING, value: "1" }
                  # Read by github_ci_gate.py watch-l2. PR code runs in this
                  # pod, so this must be a token without scopes.
                  - name: GITHUB_API_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: github-api-readonly
                        key: token
                resources:
                  requests:
                    cpu: "32"
                    memory: "96Gi"
                  limits:
                    nvidia.com/gpu: "1"
                    cpu: "64"
                    memory: "200Gi"
                volumeMounts:
                  - { name: hf-cache, mountPath: /root/.cache/huggingface }
                  # K8s defaults /dev/shm to 64 MiB, which causes SIGBUS in
                  # Keep enough shared memory for allocator-heavy distributed tests.
                  # Mount a 16 GiB tmpfs to give shm tests headroom.
                  - { name: dshm, mountPath: /dev/shm }
                  # GDS-capable scratch dir on the host's local NVMe. Direct
                  # hostPath (no subPath) — K8s' subPath bind-mount breaks
                  # cuFile's fs-type detection. run.sh creates a per-build
                  # subdir here and exposes it via LMCACHE_TEST_TMPDIR.
                  - { name: scratch, mountPath: /scratch }
            volumes:
              - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
              - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
              - { name: scratch, hostPath: { path: /data/gds-scratch, type: DirectoryOrCreate } }
    artifact_paths:
      - "durations/test.html"
      - "coverage-test.xml"
      - "coverage-test/**/*"
