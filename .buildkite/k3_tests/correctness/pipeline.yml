# Path-filter shim. Single tiny step that decides whether to upload the
# real test pipeline (steps.yml) or skip the build entirely.
#
# Why this file exists:
# The Buildkite Web UI's upload command points at this pipeline.yml. Putting
# the filter here means the filter logic can be edited freely in the repo
# without anyone needing to re-paste anything in the Buildkite UI.
#
# - All trivial files changed → upload-pipeline.sh exits 0, no further steps
#   are added, the build is green with just this filter step.
# - Anything non-trivial changed → upload-pipeline.sh execs
#   `buildkite-agent pipeline upload steps.yml`, the real test steps are
#   added to the build, and they run as before.
# - Set K3_PATH_FILTER_DISABLE=1 in the build env to bypass the filter.

steps:
  - label: ":mag: Path filter"
    command: bash .buildkite/k3_tests/common_scripts/upload-pipeline.sh .buildkite/k3_tests/correctness/steps.yml
    agents: { queue: "k8s" }
