# AMD bare-metal unit tests.

env:
  PATH: "$HOME/.local/bin:$PATH"

steps:
  - label: "AMD Unit Tests (Serialized)"
    key: "amd_unit_tests_serialized"
    timeout_in_minutes: 60
    command: bash .buildkite/k3_tests/amd/run-unit-tests.sh serialized

    artifact_paths:
      - "durations/test.html"
      - "coverage-test.xml"
      - "coverage-test/**/*"

  - label: "AMD Unit Tests (Unserialized)"
    key: "amd_unit_tests_unserialized"
    timeout_in_minutes: 60
    command: bash .buildkite/k3_tests/amd/run-unit-tests.sh unserialized

    artifact_paths:
      - "durations/test.html"
      - "coverage-test.xml"
      - "coverage-test/**/*"

  - label: "vLLM + LMCache E2E (AMD)"
    key: "amd_vllm_bench"
    depends_on:
      - "amd_unit_tests_serialized"
      - "amd_unit_tests_unserialized"
    timeout_in_minutes: 90
    command: .buildkite/scripts/amd-vllm-bench.sh
    artifact_paths:
      - "*.log"
      - "amd-vllm-bench-results/**/*"
