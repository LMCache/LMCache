# Paste this into the Buildkite pipeline's "Steps" editor.
# It uploads the XPU multiprocess test pipeline definition from the repo.
agents:
  queue: "xpu"

env:
  HF_TOKEN: ""  # set your HuggingFace token here (needed for gated model access)

steps:
  - label: ":pipeline: Upload XPU multiprocess pipeline"
    command: bash .buildkite/k3_tests/common_scripts/upload-pipeline.sh .buildkite/k3_tests/xpu/multiprocess/pipeline.yml
