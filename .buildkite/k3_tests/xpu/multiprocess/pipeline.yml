# XPU multiprocess tests.
# This suite reuses the multiprocess scripts through an XPU wrapper and may
# allocate 1 or 2 Intel GPUs depending on the test step.

x-flaky-retry: &flaky-retry
  automatic:
    - exit_status: -1
      limit: 2
    - exit_status: "*"
      limit: 2

x-pod-1xpu: &pod-1xpu
  containers:
    - name: container-0
      image: ${XPU_CI_IMAGE}
      imagePullPolicy: IfNotPresent
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: buildkite-git-creds
              key: GITHUB_TOKEN
      resources:
        requests:
          deviceclass.resource.kubernetes.io/gpu.intel.com: "1"
        limits:
          deviceclass.resource.kubernetes.io/gpu.intel.com: "1"
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }

x-pod-2xpu: &pod-2xpu
  containers:
    - name: container-0
      image: ${XPU_CI_IMAGE}
      imagePullPolicy: IfNotPresent
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: buildkite-git-creds
              key: GITHUB_TOKEN
      resources:
        requests:
          deviceclass.resource.kubernetes.io/gpu.intel.com: "2"
        limits:
          deviceclass.resource.kubernetes.io/gpu.intel.com: "2"
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }

steps:
  - group: ":xpu: Multiprocess (1-pod)"
    steps:
      - label: ":xpu: lm_eval"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export L1_USE_LAZY="false"
          export ENFORCE_EAGER="1"
          export VLLM_USE_STANDALONE_COMPILE="0"
          export CPU_BUFFER_SIZE="80"
          .buildkite/k3_tests/xpu/multiprocess/run.sh lm_eval
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log", "ci_results_*/**"]

      # Engine-driven multi-group (hybrid KV) coverage: a GDN + full-attention
      # hybrid at TP1 on one XPU, over both transports. Inline keeps L1 lazy;
      # SHM disables it so the server maps its SHM pool. vLLM's XPU platform
      # rounds a GDN model's block size up to a multiple of 64 (544 -> 576), so
      # the LMCache chunk and the 'align' scheduler step follow it.
      - label: ":xpu: hma_lm_eval_qwen3_5 / engine_driven / {{matrix.transport}}"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export ENGINE_DRIVEN_TRANSPORT="{{matrix.transport}}"
          case "{{matrix.transport}}" in
            inline) export L1_USE_LAZY="true" ;;
            shm) export L1_USE_LAZY="false" ;;
          esac
          export ENFORCE_EAGER="1"
          export VLLM_USE_STANDALONE_COMPILE="0"
          export CPU_BUFFER_SIZE="80"
          export CHUNK_SIZE="576"
          export MAX_NUM_BATCHED_TOKENS="576"
          .buildkite/k3_tests/xpu/multiprocess/run.sh hma_lm_eval_qwen3_5
        matrix:
          setup:
            transport:
              - "inline"
              - "shm"
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log", "ci_results_*/**"]

      # Tiny Kimi preserves MLA + KDA groups but has random weights: compare
      # sample outputs, not task accuracy. Reuse the hybrid workload with a
      # model override and align one recurrent-state snapshot to each chunk.
      - label: ":xpu: kimi_linear_tiny / engine_driven / {{matrix.transport}}"
        command: |
          export MODEL="yujiepan/kimi-linear-tiny-random"
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export ENGINE_DRIVEN_TRANSPORT="{{matrix.transport}}"
          case "{{matrix.transport}}" in
            inline) export L1_USE_LAZY="true" ;;
            shm) export L1_USE_LAZY="false" ;;
          esac
          export VLLM_TRUST_REMOTE_CODE="1"
          export VLLM_BLOCK_SIZE="64"
          export CHUNK_SIZE="64"
          export MAX_NUM_BATCHED_TOKENS="64"
          export MAX_MODEL_LEN="8192"
          export MAMBA_CACHE_MODE="align"
          export SEPARATE_OBJECT_GROUPS="1"
          export NUM_CONCURRENT="1"
          export LIMIT="5"
          export SCORE_TOLERANCE="0"
          export LM_EVAL_VERIFY_MODE="samples"
          export ENFORCE_EAGER="1"
          export VLLM_USE_STANDALONE_COMPILE="0"
          .buildkite/k3_tests/xpu/multiprocess/run.sh hma_lm_eval_qwen3_5
        matrix:
          setup:
            transport:
              - "inline"
              - "shm"
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log", "ci_results_*/**"]

      - label: ":xpu: vllm_bench"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export L1_USE_LAZY="false"
          export ENFORCE_EAGER="1"
          export VLLM_USE_STANDALONE_COMPILE="0"
          export CPU_BUFFER_SIZE="80"
          export VLLM_DISABLE_PREFIX_CACHING="true"
          .buildkite/k3_tests/xpu/multiprocess/run.sh vllm_bench
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-2xpu } }]
        artifact_paths: ["*.log", "ci_results_*/**"]
