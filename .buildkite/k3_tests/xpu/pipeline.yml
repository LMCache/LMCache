# XPU device validation. Runs on a dedicated `intel-xpu` queue using the
# vLLM XPU nightly runtime.

steps:
  - label: ":intel-xpu-unit-tests"
    command: bash "${BUILDKITE_BUILD_CHECKOUT_PATH:-.}/.buildkite/k3_tests/xpu/run.sh"
    timeout_in_minutes: 180
    agents: { queue: "intel-xpu" }
    plugins:
      - kubernetes:
          podSpec:
            # Device tests exercise the current vLLM XPU nightly runtime.
            containers:
              - name: container-0
                image: ${PINNED_XPU_IMAGE}
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    deviceclass.resource.kubernetes.io/gpu.intel.com: "1"
                  limits:
                    deviceclass.resource.kubernetes.io/gpu.intel.com: "1"
                volumeMounts:
                  - { name: hf-cache, mountPath: /root/.cache/huggingface }
                  # K8s defaults /dev/shm to 64 MiB; mount a larger tmpfs for
                  # SHM-heavy tests (e.g. tests/v1/shm_allocator).
                  - { name: dshm, mountPath: /dev/shm }
            volumes:
              - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
              - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }