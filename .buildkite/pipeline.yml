env:
  PATH: "$HOME/.local/bin:$PATH"

steps:
  - label: ":pytest: Prepare venv + Run pytest"
    key: "pytest"
    timeout_in_minutes: 25
    command: |
      # Install env and activate
      bash .buildkite/scripts/install-env.sh
      source .venv/bin/activate

      # Install LMCache
      bash .buildkite/scripts/install-lmcache.sh

      # Set up CUDA environment
      export CUDA_VERSION="12.1"
      export CUDA_HOME="/usr/local/cuda-${CUDA_VERSION}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib64:${LD_LIBRARY_PATH:-}"
      export PATH="${CUDA_HOME}/bin:${PATH}"

      # Pick GPU
      source .buildkite/scripts/pick-free-gpu.sh

      # Run pytest
      CUDA_LAUNCH_BLOCKING=1 \
      LMCACHE_TRACK_USAGE="false" \
      pytest --maxfail=1 --cov=lmcache \
        --cov-report term --cov-report=html:coverage-test \
        --cov-report=xml:coverage-test.xml --html=durations/test.html \
        --ignore=tests/disagg --ignore=tests/v1/test_pos_kernels.py
    artifact_paths:
      - "durations/test.html"
      - "coverage-test.xml"
      - "coverage-test/**/*"

  - label: "Upload Coverage Report"
    depends_on:
      - "pytest"
    command: |
      cat << EOF | buildkite-agent annotate --style "info"
        Read the <a href="artifact://coverage-test/index.html">uploaded coverage report</a>
      EOF
