steps:
  - label: ":rocket: vLLM correctness (source install)"
    key: "correctness"
    timeout_in_minutes: 60
    commands:
      - |
        set -euo pipefail

        # 1. Install uv
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv --version

        # 2. Setup Cache
        # Using \$ ensures Buildkite doesn't try to fill these variables itself
        MY_CACHE_PATH="\$(pwd)/.uv-cache"
        
        echo "DEBUG: Attempting to create directory: \$MY_CACHE_PATH"
        mkdir -p "\$MY_CACHE_PATH"
        
        export UV_CACHE_DIR="\$MY_CACHE_PATH"
        export XDG_CACHE_HOME="\$MY_CACHE_PATH"

        # 3. Verify Exports
        echo "DEBUG: UV_CACHE_DIR is set to: \$UV_CACHE_DIR"
        echo "DEBUG: XDG_CACHE_HOME is set to: \$XDG_CACHE_HOME"

        # 4. Cleanup logic
        cleanup() {
          echo "[INFO] Cleaning up .venv and cache"
          rm -rf .venv "\$MY_CACHE_PATH"
        }
        trap cleanup EXIT INT TERM

        # 5. Create isolated env
        uv venv .venv
        source .venv/bin/activate
        python --version

        # 6. Install dependencies
        uv pip install --upgrade pip
        uv pip install vllm
        uv pip install -e .

        # 7. Run test
        chmod +x .buildkite/scripts/vllm-correctness.sh
        
        # BUILDKITE_BUILD_ID is a native BK variable, so no backslash needed
        BUILD_ID="${BUILDKITE_BUILD_ID}" .buildkite/scripts/vllm-correctness.sh

    artifact_paths:
      - "build_${BUILDKITE_BUILD_ID}.log"