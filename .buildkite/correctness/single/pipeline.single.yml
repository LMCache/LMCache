steps:
  - label: ":rocket: vLLM correctness (source install)"
    key: "correctness"
    timeout_in_minutes: 60
    commands:
      - |
        set -euo pipefail

        # 1. Install uv
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv --version

        # 2. Setup Cache - Use a direct variable and verify it
        MY_CACHE_PATH="$(pwd)/.uv-cache"
        mkdir -p "$MY_CACHE_PATH"
        
        export UV_CACHE_DIR="$MY_CACHE_PATH"
        export XDG_CACHE_HOME="$MY_CACHE_PATH"

        # 3. Cleanup logic
        cleanup() {
          echo "[INFO] Cleaning up .venv and cache"
          rm -rf .venv "$MY_CACHE_PATH"
        }
        trap cleanup EXIT INT TERM

        # 4. Create isolated env (Force python version to ensure stability)
        uv venv .venv
        source .venv/bin/activate

        # 5. Install dependencies
        # Note: installing 'vllm' then '-e .' might cause version conflicts
        # depending on your setup; usually -e . handles the deps.
        uv pip install --upgrade pip
        uv pip install vllm
        uv pip install -e .

        # 6. Run test
        chmod +x .buildkite/scripts/vllm-correctness.sh
        BUILD_ID="${BUILDKITE_BUILD_ID}" .buildkite/scripts/vllm-correctness.sh

    artifact_paths:
      - "build_${BUILDKITE_BUILD_ID}.log"