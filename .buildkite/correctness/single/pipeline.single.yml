steps:
  - label: ":rocket: vLLM Single Request Correctness Test"
    key: "test"
    timeout_in_minutes: 60
    env:
      DOCKER_BUILDKIT: 1
    commands:
      - chmod +x .buildkite/scripts/vllm-correctness.sh
      - BUILD_ID=${BUILDKITE_BUILD_ID} .buildkite/scripts/vllm-correctness.sh
    artifact_paths:
      - "build_${BUILDKITE_BUILD_ID}.log"

  - label: ":broom: Clean up"
    depends_on: ["test"]
    allow_dependency_failure: true
    command: |
      echo "Deleting current workspace $PWD"
      cd /
      sudo rm -rf "$PWD"
