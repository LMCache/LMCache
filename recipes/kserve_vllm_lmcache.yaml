apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: lmcache-config
  data:
    lmcache.yaml: |
      chunk_size: 256
      local_cpu: true
      # Size CPU cache to ~1.5x GPU KV cache budget
      max_local_cpu_size: 48
      use_layerwise: false
      save_unfull_chunk: true
- apiVersion: serving.kserve.io/v1beta1
  kind: InferenceService
  metadata:
    name: vllm-lmcache
  spec:
    predictor:
      containers:
      - name: vllm
        image: lmcache/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: HF_TOKEN
          value: "<YOUR_HF_TOKEN>"
        - name: LMCACHE_CONFIG_FILE
          value: /etc/lmcache/lmcache.yaml
        command: ["bash", "-lc"]
        args:
        - |
          export PYTHONHASHSEED=0
          vllm serve mistralai/Mistral-7B-Instruct-v0.2 \
            --host 0.0.0.0 \
            --port 8080 \
            --max-model-len 8192 \
            --gpu-memory-utilization 0.85 \
            --kv-transfer-config '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "32Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "32Gi"
        volumeMounts:
        - name: lmcache-config
          mountPath: /etc/lmcache
      volumes:
      - name: lmcache-config
        configMap:
          name: lmcache-config
