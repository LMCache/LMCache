# LMCache Configuration: Layerwise KV Storage
# Purpose: Enable layerwise loading for memory efficiency and faster TTFT

enable_chunked_prefill: false
model: "meta-llama/Llama-3.1-70B-Instruct"
tensor_parallel_size: 4
gpu_memory_utilization: 0.85

# Enable layerwise storage - loads KV layer by layer
# Benefits: Memory efficiency, overlapping compute with load
# Best for: Models with 32+ layers, memory-constrained environments
use_layerwise: true

# Chunk configuration
chunk_size: 256

# CPU hot cache for layerwise storage
local_cpu: true
max_local_cpu_size: 100  # GB - layerwise allows smaller buffer

# Lookup service configuration
lookup_url: "/tmp/lmcache_lookup.sock"

# Optional: Combine with async for maximum performance
# enable_async: true
# async_queue_size: 50

# Optional: Add disk tier for larger working sets
# local_disk: "/mnt/fastssd/lmcache"
# max_local_disk_size: 500
