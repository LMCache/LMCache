multinode: false

modelArtifacts:
  name: mistralai/Mistral-7B-Instruct-v0.2
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: mistral-7b-instruct
  uri: hf://"{{ .Values.modelArtifacts.name }}"
  size: 50Gi

routing:
  servicePort: 8000
  proxy:
    secure: false

accelerator:
  type: nvidia

decode:
  replicas: 1
  containers:
  - name: vllm
    image: "ghcr.io/llm-d/llm-d-cuda:latest"
    modelCommand: custom
    command: ["bash", "-lc"]
    args:
      - |
        cat <<'EOF' > /tmp/lmcache.yaml
        chunk_size: 256
        local_cpu: true
        # Size CPU cache to ~1.5x GPU KV cache budget
        max_local_cpu_size: 48
        use_layerwise: false
        save_unfull_chunk: true
        EOF
        export LMCACHE_CONFIG_FILE=/tmp/lmcache.yaml
        export PYTHONHASHSEED=0
        vllm serve mistralai/Mistral-7B-Instruct-v0.2 \
          --host 0.0.0.0 \
          --port 8000 \
          --max-model-len 8192 \
          --gpu-memory-utilization 0.85 \
          --kv-transfer-config '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
    env:
      - name: HF_TOKEN
        value: "<YOUR_HF_TOKEN>"
    ports:
      - containerPort: 8000
        protocol: TCP
    resources:
      limits:
        nvidia.com/gpu: 1
        cpu: "8"
        memory: "32Gi"
      requests:
        nvidia.com/gpu: 1
        cpu: "8"
        memory: "32Gi"
    mountModelVolume: true
