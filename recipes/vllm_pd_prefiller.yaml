# Disable storage mode
local_cpu: False
local_disk: False

# Enable PD mode
enable_pd: True
transfer_channel: "nixl"
pd_role: "sender"

# Proxy configuration
pd_proxy_host: "localhost"
pd_proxy_port: 7500

# Buffer configuration
pd_buffer_size: 1073741824  # 1GB
pd_buffer_device: "cuda"     # or "cpu"

# NIXL configuration
nixl_backends: [UCX]
