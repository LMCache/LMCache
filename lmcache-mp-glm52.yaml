chunk_size: 256
local_cpu: false
max_local_cpu_size: 0
use_layerwise: false
save_unfull_chunk: false
mp_host: "127.0.0.1"
mp_port: 5556
# Override the default 300s MQ timeout to 30s for faster failure
# detection during DSA integration testing. The SGLang adapter resolves
# this via _resolve_extra_config (keys must carry the lmcache.mp. prefix).
extra_config:
  lmcache.mp.mq_timeout: 30.0
