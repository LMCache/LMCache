# Packaging for the lmcache-client wheel (#6315), the counterpart of
# pyproject_cli.toml. .github/scripts/build_client_wheel.sh exports HEAD into
# a temporary directory and builds there with this file as pyproject.toml,
# leaving the checkout and the full lmcache build untouched.

[build-system]
# Same as pyproject.toml; sync_torch_version.yml updates the torch pin in both.
requires = [
    "ninja",
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "setuptools_scm>=8",
    "grpcio==1.78.0",
    "grpcio-tools==1.78.0",
    "torch==2.14.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-client"
authors = [{name = "LMCache Team", email = "lmcacheteam@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "LMCache client for inference workers: engine integrations, SDK and client transport."
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10,<3.15"
dynamic = ["dependencies", "optional-dependencies", "version"]

[project.urls]
homepage = "https://docs.lmcache.ai"
source = "https://github.com/LMCache/LMCache"
issues = "https://github.com/LMCache/LMCache/issues"

[tool.setuptools_scm]
# The build directory has no .git; the build script passes the version.
version_file = "lmcache/_version.py"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/client.txt"] }
optional-dependencies.cuda = { file = ["requirements/cuda13_core.txt"] }

[tool.setuptools]
# Single modules, for packages that also hold modules the wheel leaves out.
# A package's __init__.py ships with any of its modules.
py-modules = [
    # Roots of the packages found below.
    "lmcache.__init__",
    "lmcache._version",
    "lmcache.cli.__init__",
    "lmcache.v1.__init__",

    # Temporary compatibility modules and the remaining GCU -> GDS import
    # closure. CUDA/MUSA no longer import GDS, and shared types/utilities
    # now ship from common. Remove the GDS/distributed group after GCU uses
    # the storage-neutral BufferRegistration contract too.
    "lmcache.v1.kv_layer_groups",
    "lmcache.v1.memory_management",
    "lmcache.v1.system_detection",
    "lmcache.v1.utils.__init__",

    # GCU cache-context imports: GDS hooks, their config and storage policies.
    "lmcache.v1.gpu_connector.__init__",
    "lmcache.v1.gpu_connector._gds_backends",
    "lmcache.v1.gpu_connector.gds_backends.__init__",
    "lmcache.v1.gpu_connector.gds_backends._driver",
    "lmcache.v1.gpu_connector.gds_backends.base",
    "lmcache.v1.gpu_connector.gds_context",
    "lmcache.v1.distributed.bitmap_ops.__init__",
    "lmcache.v1.distributed.bitmap_ops.fold",
    "lmcache.v1.distributed.config",
    "lmcache.v1.distributed.error",
    "lmcache.v1.distributed.eviction",
    "lmcache.v1.distributed.eviction_policy.__init__",
    "lmcache.v1.distributed.eviction_policy.arc",
    "lmcache.v1.distributed.eviction_policy.factory",
    "lmcache.v1.distributed.eviction_policy.isolated_lru",
    "lmcache.v1.distributed.eviction_policy.lru",
    "lmcache.v1.distributed.eviction_policy.noop",
    "lmcache.v1.distributed.internal_api",
    "lmcache.v1.distributed.key_codec",
    "lmcache.v1.distributed.l2_adapters.__init__",
    "lmcache.v1.distributed.l2_adapters.base",
    "lmcache.v1.distributed.l2_adapters.config",
    "lmcache.v1.distributed.l2_adapters.factory",
    "lmcache.v1.distributed.serde.__init__",
    "lmcache.v1.distributed.serde.aesgcm",
    "lmcache.v1.distributed.serde.async_processor",
    "lmcache.v1.distributed.serde.base",
    "lmcache.v1.distributed.serde.factory",
    "lmcache.v1.distributed.serde.fp8",
    "lmcache.v1.distributed.serde.key_provider",
    "lmcache.v1.distributed.serde.multi",
    "lmcache.v1.distributed.serde.turboquant.__init__",
    "lmcache.v1.distributed.serde.turboquant.decode_kernel",
    "lmcache.v1.distributed.serde.turboquant.store_kernel",
    "lmcache.v1.distributed.serde.turboquant.turboquant",
    "lmcache.v1.distributed.serde.utils",
    "lmcache.v1.distributed.storage_controller",
    "lmcache.v1.distributed.storage_controllers.__init__",
    "lmcache.v1.distributed.storage_controllers.adapter_lifecycle",
    "lmcache.v1.distributed.storage_controllers.eviction_controller",
    "lmcache.v1.distributed.storage_controllers.prefetch_controller",
    "lmcache.v1.distributed.storage_controllers.prefetch_policy",
    "lmcache.v1.distributed.storage_controllers.store_controller",
    "lmcache.v1.distributed.storage_controllers.store_policy",
    "lmcache.v1.distributed.storage_controllers.utils",
    "lmcache.v1.mp_coordinator.__init__",
    "lmcache.v1.mp_coordinator.persistence.__init__",
    "lmcache.v1.mp_coordinator.persistence.durable_component",
    "lmcache.v1.mp_coordinator.utils.__init__",
    "lmcache.v1.mp_coordinator.utils.encoding",
    "lmcache.v1.mp_observability.errors",
    "lmcache.v1.mp_observability.event",
    "lmcache.v1.mp_observability.event_bus",
    "lmcache.v1.mp_observability.otel_init",
    "lmcache.v1.distributed.api",
    "lmcache.v1.utils.frozen_dict",

    # External vLLM/ATOM versions still use these compatibility paths.
    "lmcache.v1.multiprocess.custom_types",
    "lmcache.v1.multiprocess.group_view",
    "lmcache.v1.multiprocess.__init__",
]

[tool.setuptools.packages.find]
# Packages shipped whole: the client-owned boundary packages, the platform
# vertical, the SDK and the engine integrations.
where = [""]
include = [
    "lmcache.cli.metrics*",
    "lmcache.integration*",
    "lmcache.sdk*",
    "lmcache.v1.client*",
    "lmcache.v1.common*",
    "lmcache.v1.exceptions*",
    "lmcache.v1.platform*",
    "lmcache.v1.transport*",
]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.proto"]
