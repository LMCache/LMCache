[build-system]
requires = [
    "ninja",
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "setuptools_scm>=8",
    "grpcio==1.78.0",
    "grpcio-tools==1.78.0",
    "torch==2.13.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-client"
authors = [{name = "LMCache Team", email = "lmcacheteam@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "LMCache client runtime for inference engines."
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.15"
dynamic = ["dependencies", "version"]

[project.urls]
homepage = "https://docs.lmcache.ai"
source = "https://github.com/LMCache/LMCache"
issues = "https://github.com/LMCache/LMCache/issues"

[tool.setuptools_scm]
version_file = "lmcache/_version.py"
local_scheme = "no-local-version"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+.*)$"
git_describe_command = ["git", "describe", "--tags", "--long", "--match", "v[0-9]*.[0-9]*", "--exclude", "v*-*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/client.txt"] }

[tool.setuptools.packages.find]
where = [""]
include = ["lmcache", "lmcache*"]

[tool.cibuildwheel]
build = "cp3*-manylinux_x86_64 cp3*-manylinux_aarch64"
before-all = "grep -oE 'torch==[0-9][0-9.]*' /project/pyproject.toml | head -1 > /project/cibw-constraints.txt && cat /project/cibw-constraints.txt"
environment = {LMCACHE_CLIENT_BUILD = "1", TORCH_CUDA_ARCH_LIST = "7.5;8.0;8.6;8.9;9.0;10.0;11.0;12.0", ENABLE_CXX11_ABI = "1", PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cu130", PIP_CONSTRAINT = "/project/cibw-constraints.txt"}
manylinux-x86_64-image = "docker.io/pytorch/manylinux2_28-builder:cuda13.0"
manylinux-aarch64-image = "docker.io/pytorch/manylinuxaarch64-builder:cuda13.0"

[tool.cibuildwheel.linux]
repair-wheel-command = """
auditwheel repair \
  --plat manylinux_2_28_$(uname -m) \
  --exclude libtorch.so \
  --exclude libtorch_cuda.so \
  --exclude libtorch_python.so \
  --exclude libtorch_cpu.so \
  --exclude libc10.so \
  --exclude libc10_cuda.so \
  --exclude libcudart.so.13 \
  -w {dest_dir} {wheel}
"""
