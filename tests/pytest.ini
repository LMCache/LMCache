[pytest]
log_cli = true
log_cli_level = INFO
markers =
    no_shared_allocator: Disable the shared-allocator monkeypatch for this test
    local_cpu: Tests for Local CPU backend
    local_disk: Tests for Local Disk backend
    redis: Tests for Redis connector
    mock_connector: Tests for Mock connector/backends
    p2p: Tests for P2P backend
    pd: Tests for PD/disaggregated setups
    nixl: Tests for Nixl storage backend
    gds: Tests for GDS backend
    weka: Tests for Weka GDS backend
