local_cpu: false
chunk_size: 256

nixl_buffer_size: 1073741824
nixl_buffer_device: cpu
extra_config:
  enable_nixl_storage: true
  nixl_backend: AIStor
  nixl_pool_size: 64
  nixl_path: /tmp/nixl/cache
  nixl_backend_params:
    access_key: YOUR_AISTOR_USER_NAME
    secret_key: YOUR_AISTOR_PASSWORD
    bucket: testbucket
    url: YOUR_AISTOR_URL
    log_level: warn
