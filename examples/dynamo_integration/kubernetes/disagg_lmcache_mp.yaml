apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-lmcache
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.2
    - name: VllmDecodeWorker
      type: worker
      replicas: 1
      # mp mode: LMCache owns /dev/shm
      sharedMemorySize: "0"
      podTemplate:
        spec:
          # mp mode: CUDA IPC between vLLM and the LMCache process
          hostIPC: true
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.2
              workingDir: /workspace/examples/backends/vllm
              resources:
                limits:
                  nvidia.com/gpu: "1"
                requests:
                  # Increase this value for larger models.
                  ephemeral-storage: "2Gi"
              env:
                - name: PYTHONHASHSEED
                  value: "0"
              volumeMounts:
                - name: kv-transfer-config
                  mountPath: /etc/lmcache
                  readOnly: true
              command:
                - /bin/sh
                - -c
                - exec python3 -m dynamo.vllm "$@" --kv-transfer-config "$(cat /etc/lmcache/kv-transfer-config.json)"
                - --
              args:
                - --model
                - Qwen/Qwen3-0.6B
                - --disaggregation-mode
                - decode
                - --disable-hybrid-kv-cache-manager
          volumes:
            - name: kv-transfer-config
              configMap:
                name: lmcache-mp-connection   # = <LMCacheEngine.metadata.name>-connection
    - name: VllmPrefillWorker
      type: worker
      replicas: 1
      sharedMemorySize: "0"
      podTemplate:
        spec:
          hostIPC: true
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.2
              workingDir: /workspace/examples/backends/vllm
              resources:
                limits:
                  nvidia.com/gpu: "1"
                requests:
                  ephemeral-storage: "2Gi"
              env:
                - name: PYTHONHASHSEED
                  value: "0"
              volumeMounts:
                - name: kv-transfer-config
                  mountPath: /etc/lmcache
                  readOnly: true
              command:
                - /bin/sh
                - -c
                - exec python3 -m dynamo.vllm "$@" --kv-transfer-config "$(cat /etc/lmcache/kv-transfer-config.json)"
                - --
              args:
                - --model
                - Qwen/Qwen3-0.6B
                - --disaggregation-mode
                - prefill
                - --disable-hybrid-kv-cache-manager
          volumes:
            - name: kv-transfer-config
              configMap:
                name: lmcache-mp-connection   # = <LMCacheEngine.metadata.name>-connection
