# The launch scripts combine this file with docker-compose.yml.

services:
  dynamo:
    image: ${DYNAMO_IMAGE:-nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.2}
    init: true
    gpus: all
    network_mode: host
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - .:/opt/dynamo-lmcache:ro
    depends_on:
      - nats-server
      - etcd-server
    environment:
      LMCACHE_L1_SIZE_GB: ${LMCACHE_L1_SIZE_GB:-16}
      LMCACHE_PORT: ${LMCACHE_PORT:-5555}
      LMCACHE_HTTP_PORT: ${LMCACHE_HTTP_PORT:-8080}
      DYN_HTTP_PORT: ${DYN_HTTP_PORT:-8000}
      DYN_SYSTEM_PORT: ${DYN_SYSTEM_PORT:-8081}
      DYN_SYSTEM_PORT1: ${DYN_SYSTEM_PORT1:-8081}
      DYN_SYSTEM_PORT2: ${DYN_SYSTEM_PORT2:-8082}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-4096}
      MAX_CONCURRENT_SEQS: ${MAX_CONCURRENT_SEQS:-2}
    command:
      - bash
      - /opt/dynamo-lmcache/serve.sh
      - ${DYNAMO_MODE:-aggregated}
