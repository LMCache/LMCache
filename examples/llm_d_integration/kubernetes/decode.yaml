# vLLM decode model server for the llm-d Router, connected to the LMCache
# server of lmcache_engine.yaml. The shape follows the llm-d `decode` base:
# container `modelserver`, port 8000, the `llm-d.ai/role` label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  namespace: llm-d
  labels:
    llm-d.ai/role: decode
    llm-d.ai/guide: lmcache
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: decode
      llm-d.ai/guide: lmcache
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        llm-d.ai/guide: lmcache            # selected by the router
    spec:
      terminationGracePeriodSeconds: 120   # vLLM unregisters its KV cache before it stops
      containers:
        - name: modelserver
          image: lmcache/vllm-openai:v0.5.6
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen3-0.6B
            - --port=8000
            - --no-enable-prefix-caching   # a repeated prompt reaches LMCache; remove in production
            - --kv-transfer-config
            - $(LMCACHE_KV_CONFIG)
          env:
            - name: PYTHONHASHSEED
              value: "0"
            - name: LMCACHE_KV_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: lmcache-engine-connection
                  key: kv-transfer-config.json
          ports:
            - name: modelserver
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
