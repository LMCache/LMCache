---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-process-deployment
  namespace: multi-process
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-process-deployment
  template:
    metadata:
      labels:
        app: multi-process-deployment
    spec:
      hostIPC: true
      containers:
        # Sidecar container: LMCache server. The vLLM container will wait for it to be ready.
        - name: lmcache-server
          image: lmcache/standalone:nightly
          command:
            - /opt/venv/bin/python3
            - -m
            - lmcache.v1.multiprocess.server
            - --host
            - "0.0.0.0"
            - --port
            - "6555"
            - --cpu-buffer-size
            - "60"
            - --max-workers
            - "4"
          resources:
            requests:
              memory: "10Gi"
              cpu: "4"
            limits:
              memory: "120Gi"
              cpu: "8"
          env:
            - name: LMCACHE_LOG_LEVEL
              value: "DEBUG"
          ports:
            - containerPort: 6555
              name: lmcache
              protocol: TCP

        # Main container: vLLM
        - name: vllm
          image: lmcache/vllm-openai:latest-nightly
          args:
            - Qwen/Qwen3-14B
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --no-enable-prefix-caching
            - --max-model-len
            - "32768"
            - --gpu-memory-utilization
            - "0.85"
            - --tensor-parallel-size
            - "4"
            - --kv-transfer-config
            - '{"kv_connector":"LMCacheMPConnector", "kv_role":"kv_both", "kv_connector_extra_config": {"lmcache.mp.port": 6555}}'
          resources:
            limits:
              # Note: GPU allocation in Kubernetes is pod-level, not container-level.
              # Even though specified here on the vLLM container, all 4 GPUs are mounted
              # to the pod's device namespace, making them accessible to ALL containers
              # (including lmcache-server).
              nvidia.com/gpu: "4"
            requests:
              nvidia.com/gpu: "4"
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: PYTHONHASHSEED
              value: "0"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp"
            - name: LMCACHE_LOG_LEVEL
              value: "DEBUG"
