# LMCacheEngine on AMD ROCm GPU nodes.
#
# Setting `gpuVendor: amd` opts out of the NVIDIA defaults: the operator omits
# RuntimeClassName from the pod spec and skips the NVIDIA_VISIBLE_DEVICES /
# NVIDIA_DRIVER_CAPABILITIES env vars. AMD GPUs are exposed via host devices
# (/dev/kfd, /dev/dri) under the default container runtime with privileged: true,
# so no RuntimeClass is required.
#
# AMD GPU nodes do not have a universal label equivalent to
# nvidia.com/gpu.present=true. Use the label your platform exposes.
apiVersion: lmcache.lmcache.ai/v1alpha1
kind: LMCacheEngine
metadata:
  name: amd-cache
spec:
  gpuVendor: amd
  nodeSelector:
    # Use the label your platform exposes for AMD GPU nodes. With the
    # ROCm/gpu-operator, feature.node.kubernetes.io/amd-gpu="true" is applied
    # via Node Feature Discovery.
    feature.node.kubernetes.io/amd-gpu: "true"
  l1:
    sizeGB: 60
