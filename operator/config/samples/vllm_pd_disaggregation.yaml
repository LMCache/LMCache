# vLLM Prefiller + Decoder Deployments for standard PD disaggregation.
#
# Each Deployment opts in to the LMCache webhook, which injects:
#   - pod hostIPC=true
#   - --kv-transfer-config <MultiConnector JSON from the engine ConfigMap>
#   - PYTHONHASHSEED=0
#   - VLLM_NIXL_SIDE_CHANNEL_HOST (downward API, pod's own IP via status.podIP)
#   - VLLM_NIXL_SIDE_CHANNEL_PORT (from spec.pd.nixlSideChannelPort on the engine CR)
#
# PREREQUISITES:
#   1. LMCacheEngine "prefiller-cache" (pd.role=prefiller, port 5557) is Ready.
#   2. LMCacheEngine "decoder-cache"   (pd.role=decoder,   port 5558) is Ready.
#   3. The webhook is deployed (make deploy) and cert-manager is installed.
#   4. This namespace is labeled pod-security.kubernetes.io/enforce=privileged.
#
# After creation, verify injection on a pod:
#   kubectl get pod -l app=pd-prefiller -o yaml | \
#     grep -E "hostIPC|kv-transfer-config|NIXL|lmcache-injected"
#
# Then deploy the pd-router pointing --prefill and --decode at the Services
# below (pd-prefiller:8001, pd-decoder:8002).
---
# ── Prefiller vLLM ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-prefiller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-prefiller
  template:
    metadata:
      labels:
        app: pd-prefiller
        # Opt in to the LMCache webhook.
        lmcache.ai/lmcache-inject: "true"
      annotations:
        # Bind to the prefiller LMCacheEngine (must be in the same namespace).
        lmcache.ai/lmcache-engine: "prefiller-cache"
    spec:
      runtimeClassName: nvidia
      # Do NOT set hostIPC here — the webhook injects hostIPC=true.
      # Do NOT mount an emptyDir at /dev/shm — hostIPC shares the host /dev/shm.
      containers:
        - name: vllm
          image: lmcache/vllm-openai:latest-nightly
          # Args-only launch (ENTRYPOINT is ["vllm","serve"]).
          # Do NOT add --kv-transfer-config — the webhook injects it.
          args:
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--served-model-name"
            - "Llama-3.1-8B-Instruct"
            - "--port"
            - "8001"
            - "--tensor-parallel-size"
            - "1"
            - "--enforce-eager"
            - "--max-model-len"
            - "16384"
            - "--gpu-memory-utilization"
            - "0.4"
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: UCX_NET_DEVICES
              value: "all"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: pd-prefiller
  namespace: default
spec:
  selector:
    app: pd-prefiller
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# ── Decoder vLLM ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-decoder
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-decoder
  template:
    metadata:
      labels:
        app: pd-decoder
        lmcache.ai/lmcache-inject: "true"
      annotations:
        lmcache.ai/lmcache-engine: "decoder-cache"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: lmcache/vllm-openai:latest-nightly
          args:
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--served-model-name"
            - "Llama-3.1-8B-Instruct"
            - "--port"
            - "8002"
            - "--tensor-parallel-size"
            - "1"
            - "--enforce-eager"
            - "--max-model-len"
            - "16384"
            - "--gpu-memory-utilization"
            - "0.4"
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: UCX_NET_DEVICES
              value: "all"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: pd-decoder
  namespace: default
spec:
  selector:
    app: pd-decoder
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
# ── vLLM Router ─────────────────────────────────────────────────────────────
# Runs pd-router in PD disaggregation mode. Adjust image/version as needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-router
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-router
  template:
    metadata:
      labels:
        app: pd-router
    spec:
      containers:
        - name: router
          image: vllm/vllm-router:nightly
          command:
            - vllm-router
          args:
            - "--policy"
            - "round_robin"
            - "--vllm-pd-disaggregation"
            - "--prefill"
            - "http://pd-prefiller:8001"
            - "--decode"
            - "http://pd-decoder:8002"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "30000"
            - "--intra-node-data-parallel-size"
            - "1"
          ports:
            - name: http
              containerPort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: pd-router
  namespace: default
spec:
  selector:
    app: pd-router
  ports:
    - name: http
      port: 30000
      targetPort: 30000
