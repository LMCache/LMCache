# LMCacheEngine — PD disaggregation PREFILLER role.
#
# This engine runs alongside the prefiller vLLM pod. The connection ConfigMap
# it generates contains a MultiConnector config:
#   MultiConnector(kv_producer)
#     ├── NixlConnector(kv_producer)   — direct GPU-GPU KV transfer to decoder
#     └── LMCacheMPConnector(kv_both)  — node-local KV cache (prefix reuse)
#
# The webhook also injects into opted-in vLLM pods:
#   VLLM_NIXL_SIDE_CHANNEL_HOST = pod's own IP (downward API status.podIP)
#   VLLM_NIXL_SIDE_CHANNEL_PORT = spec.pd.nixlSideChannelPort (5557 here)
#
# PREREQUISITES:
#   1. Apply the decoder LMCacheEngine (lmcache_v1alpha1_lmcacheengine_pd_decoder.yaml).
#   2. Deploy the prefiller vLLM with the opt-in label/annotation (see vllm_pd_disaggregation.yaml).
#   3. Deploy a vllm-router pointing at the prefiller and decoder vLLM Services.
apiVersion: lmcache.lmcache.ai/v1alpha1
kind: LMCacheEngine
metadata:
  name: prefiller-cache
  namespace: default
spec:
  l1:
    sizeGB: 100

  server:
    port: 5555
    httpPort: 8080
    chunkSize: 256

  eviction:
    policy: LRU

  # PD disaggregation: prefiller role.
  # Use a distinct nixlSideChannelPort from the decoder to avoid collision
  # when both roles run on the same node (e.g. in single-node testing).
  pd:
    role: prefiller
    nixlSideChannelPort: 5557         # decoder must use a different port
    nixlLoadFailurePolicy: fail       # abort if NixlConnector cannot reach decoder

  # -- Scheduling --
  # nodeSelector:
  #   nvidia.com/gpu.present: "true"
  #   lmcache.ai/role: prefiller      # optional: pin to prefiller nodes
