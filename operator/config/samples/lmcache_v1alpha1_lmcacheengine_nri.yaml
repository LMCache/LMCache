# LMCacheEngine for NVIDIA GPU Operator NRI/CDI clusters that have no
# RuntimeClass objects (typical of GPU Operator v25+/v26 with CDI+NRI).
#
# Cluster prerequisites:
#   - NVIDIA Container Toolkit v1.20.0+ (NRI_MANAGEMENT_CDI_DEVICE_NAMESPACES)
#   - ClusterPolicy env NRI_MANAGEMENT_CDI_DEVICE_NAMESPACES includes this
#     namespace (comma-separated; the GPU Operator install ns stays allowed)
#
# Empty runtimeClassName omits the field. Request GPU visibility yourself via
# spec.podAnnotations (container name is always "lmcache").
apiVersion: lmcache.lmcache.ai/v1alpha1
kind: LMCacheEngine
metadata:
  name: my-cache
spec:
  runtimeClassName: ""
  podAnnotations:
    nvidia.cdi.k8s.io/container.lmcache: management.nvidia.com/gpu=all
  l1:
    sizeGB: 10
