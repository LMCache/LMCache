# CacheBlendEngine — PD disaggregation PREFILLER role (CacheBlend prefiller).
#
# This engine runs alongside the CacheBlend prefiller vLLM pod. The connection
# ConfigMap it generates contains a MultiConnector config:
#   MultiConnector(kv_producer)
#     ├── NixlConnector(kv_producer)  — direct GPU-GPU KV transfer to decoder
#     └── CBKVConnector(kv_both)      — CacheBlend node-local cache
#
# The webhook also injects into opted-in vLLM pods:
#   VLLM_NIXL_SIDE_CHANNEL_HOST = pod's node IP (downward API status.hostIP)
#   VLLM_NIXL_SIDE_CHANNEL_PORT = spec.pd.nixlSideChannelPort (5557 here)
#
# The decoder side uses a plain LMCacheEngine with pd.role=decoder
# (lmcache_v1alpha1_lmcacheengine_pd_decoder.yaml).
#
# PREREQUISITES:
#   1. Apply lmcache_v1alpha1_lmcacheengine_pd_decoder.yaml for the decoder engine.
#   2. Deploy prefiller vLLM with lmcache.ai/cacheblend-inject + annotation.
#   3. Deploy decoder  vLLM with lmcache.ai/lmcache-inject   + annotation.
#   4. Deploy a vllm-router in PD disaggregation mode.
apiVersion: lmcache.lmcache.ai/v1alpha1
kind: CacheBlendEngine
metadata:
  name: cacheblend-prefiller
  namespace: default
spec:
  image:
    repository: lmcache/vllm-openai
    tag: latest-nightly

  l1:
    sizeGB: 60

  server:
    port: 5555
    httpPort: 8080
    chunkSize: 256          # fixed at 256 for CacheBlend (must equal vLLM --block-size * 4)
    maxWorkers: 1

  blend:
    checkLayer: 1
    recompRatio: 0.15

  injection:
    payloadImage:
      repository: lmcache/cacheblend-plugin
      tag: latest
    cudagraph: eager

  # PD disaggregation: CacheBlend prefiller.
  # enforce_handshake_compat=false is required when prefiller and decoder
  # run different vLLM builds (common in CacheBlend PD setups).
  pd:
    role: prefiller
    nixlSideChannelPort: 5557
    nixlLoadFailurePolicy: fail
    enforceHandshakeCompat: false

  # -- Scheduling --
  # nodeSelector:
  #   nvidia.com/gpu.present: "true"
  #   lmcache.ai/role: prefiller
