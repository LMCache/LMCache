# Install one operator release per cluster. All namespaces are watched.
image:
  repository: lmcache/lmcache-operator
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
imagePullSecrets: []
podAnnotations: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  # Requires the Prometheus Operator CRDs. The manager serves HTTPS metrics
  # using its generated self-signed certificate and Kubernetes authorization.
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    tlsConfig:
      insecureSkipVerify: true
